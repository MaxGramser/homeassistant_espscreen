# Light. Home Assistant: homeassistant/components/light.
# Home Assistant's own facts for it (flags, actions) come from its source: catalogue/_ha.json (tools/read_ha_source.py).
# docs/CATALOGUE.md says what every key means.
domain: light
memory: {bytes: 160, extras: true}
displays:
  standard: {}
  watch: {}
# A tile that grows suggests the brightness slider, else the switch.
grow: [brightness, toggle]
controls:
  toggle:
    needs: {actions: [light.toggle]}
  brightness:
    needs: {actions: [{action: light.turn_on, field: brightness_pct}]}
inline:
  needs: {actions: [{action: light.turn_on, field: brightness_pct}]}

# Fan. Home Assistant: homeassistant/components/fan.
# Home Assistant's own facts for it (flags, actions) come from its source: catalogue/_ha.json (tools/read_ha_source.py).
# docs/CATALOGUE.md says what every key means.
domain: fan
memory: {bytes: 96, extras: false}
displays:
  standard: {}
  watch: {}
# A tile that grows suggests the speed slider, else the switch.
grow: [speed, toggle]
controls:
  toggle:
    needs: {actions: [fan.toggle]}
  speed:
    needs: {actions: [fan.set_percentage]}
inline:
  needs: {actions: [fan.set_percentage]}

# Camera. Home Assistant: homeassistant/components/camera.
# Home Assistant's own facts for it (flags, actions) come from its source: catalogue/_ha.json (tools/read_ha_source.py).
# docs/CATALOGUE.md says what every key means.
domain: camera
memory: {bytes: 96, extras: false}
firmware: 0.2.57   # the first firmware that draws this type
displays:
  standard: {}
  # The picture itself, on a board that draws pictures (firmware 0.2.77).
  live:
    screen: {pictures: true, firmware: 0.2.77}
key: false
# How a live picture sits on its tile: filling it or whole, with the name over it or nothing, and how often it is new.
# 0 is Live: the camera streams on its tile, on a screen whose hello says `live` (a P4, live_view.h), where it is the
# default; any other screen refreshes such a tile at 15 seconds (live_feed.live_pace).
picture:
  fit: [fill, contain]
  overlay: [name, none]
  refresh: [0, 5, 10, 15, 30]

# The screen's own cards: the clock, the bedside clock, the settings card and the tiles that go to a page. Nothing in
# Home Assistant stands behind them. docs/CATALOGUE.md says what every key means.
domain: screen
memory: {bytes: 32, extras: false}
# The energy card (firmware 0.47.0) keeps the house's moment (its devices and their sensors) and the diagram drawn from it,
# with a small picture of each running dot: its own price, measured as docs/TILE_MEMORY.md says.
cards:
  energy: {bytes: 6144, extras: true}
  # The template tile (module text_card) keeps its rows and its plan in PSRAM; inside the chip it keeps its one canvas,
  # its plan's lists and the pieces' small strings: priced at what a full tile of 24 rows takes there.
  text: {bytes: 2048, extras: true}
# How the energy card shows power along a line: running dots (power-flow-card-plus's, the default), or calm lines that
# grow with the power and carry an arrow the way it goes. A firmware before this one keeps the dots.
energy:
  flow: [dots, lines]
firmware: 0.2.14   # the first firmware that draws these cards
displays:
  # The clock's faces; the dial and the flip clock came with firmware 0.3.6.
  digital: {}
  analog: {}
  dial:
    screen: {firmware: 0.3.6, else: digital}
  flip:
    screen: {firmware: 0.3.6, else: digital}
key: false

# Sun. Home Assistant: homeassistant/components/sun.
# Home Assistant's own facts for it (flags, actions) come from its source: catalogue/_ha.json (tools/read_ha_source.py).
# docs/CATALOGUE.md says what every key means.
domain: sun
memory: {bytes: 32, extras: true}
firmware: 0.2.14   # the first firmware that draws this type
# The library shows it with its path over the day from two cells up (docs/CATALOGUE.md, "The library's tiles").
showcase: sunpath
displays:
  standard: {}
  watch: {}
  # The sun's path over the day, on a card of two columns or more.
  sunpath:
    wide: true

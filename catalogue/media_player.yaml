# Media player. Home Assistant: homeassistant/components/media_player.
# Home Assistant's own facts for it (flags, actions) come from its source: catalogue/_ha.json (tools/read_ha_source.py).
# docs/CATALOGUE.md says what every key means.
domain: media_player
memory: {bytes: 1312, extras: true}
# A tile that grows suggests the volume over the playback keys (docs/CATALOGUE.md, "A tile that grows").
grow: [volume_playback]
controls:
  volume:
    needs: {actions: [media_player.volume_set, media_player.volume_mute]}
  playback:
    needs: {actions: [media_player.media_play_pause, media_player.media_play, media_player.media_pause, media_player.media_next_track, media_player.media_previous_track]}
  # Both, Home Assistant's volume slider and playback features stacked: the volume over the keys on a card with a second
  # row for it, drawn by a screen that says media_rows (its hello); an older one draws the keys.
  volume_playback:
    of: [volume, playback]
    rows: 2
    screen: {feature: media_rows, else: playback}
    one_row: volume
inline:
  needs: {actions: [media_player.volume_set]}
displays:
  standard: {}
  watch: {}
  # The album cover in the icon's place, on a board that draws pictures (firmware 0.2.78), not on a whole page.
  cover:
    screen: {pictures: true, firmware: 0.2.78}
    sizes: {full: false}
  # A favourite (firmware 0.24.0): one playlist, album, artist or show from the player's library, started with a tap on
  # the speaker chosen for it, or where the player plays. Its cover fills the tile on a board that draws pictures.
  favorite:
    needs: {features: [BROWSE_MEDIA]}
    screen: {firmware: 0.24.0}
    sizes: {full: false}
# What a favourite sets as it starts (app 0.4.84), each where Home Assistant lists the action for the player: its own
# shuffle and repeat. The add-on sets them; the screen knows nothing of them.
favorite:
  shuffle:
    needs: {actions: [media_player.shuffle_set]}
  repeat:
    needs: {actions: [media_player.repeat_set]}

# ESP Screens - a picture of what LVGL draws, sent over the log, for a board with the memory for a second frame (PSRAM).
#
# The `ui_snapshot` action (Home Assistant, or diagnostics/capture_ui.py) copies the screen LVGL draws row by row into
# the log, which capture_ui.py turns into a PNG. It needs LVGL's snapshot, which this file switches on.
esphome:
  platformio_options:  # not `build_flags:` yet, see packages/core.yaml
    build_flags:
      - -DLV_USE_SNAPSHOT=1
  includes:
    - <esphome/components/smart_display/screen_diagnostics.h>

api:
  actions:
    - action: ui_snapshot
      then:
        - script.execute: capture_ui_snapshot
    # The panel's frame buffer instead (screen_diagnostics::glass_begin): a live picture written past LVGL shows too.
    - action: glass_snapshot
      then:
        - lambda: screen_diagnostics::glass_begin();
        - script.execute: send_snapshot_rows
    # A part of the frame buffer at its own size, at most 240 pixels each way, in the panel's coordinates: a line one
    # pixel wide, which the whole glass's picture steps over.
    - action: glass_part
      variables:
        x: int
        y: int
        w: int
        h: int
      then:
        - lambda: screen_diagnostics::glass_part(x, y, w, h);
        - script.execute: send_snapshot_rows
    # A burst: the frame buffer now and after each refresh that follows, at least `every` ms apart (count at most 8),
    # kept in PSRAM until glass_send streams each copy (screen_diagnostics.h).
    - action: glass_burst
      variables:
        count: int
        every: int
      then:
        - lambda: screen_diagnostics::glass_burst(count, every);
    - action: glass_send
      variables:
        n: int
      then:
        - lambda: screen_diagnostics::glass_send(n);
        - script.execute: send_snapshot_rows
    # The Dock opened from afar (docs/MODULES.md), so a snapshot can show it: a finger is the only other way. A board
    # without the module does nothing.
    - action: ui_dock
      then:
        - lambda: |-
            #ifdef SD_MOD_DOCK
            if (runtime_tiles::navigation_ready()) dock::show();
            #endif

script:
  - id: capture_ui_snapshot
    mode: single
    then:
      - lambda: screen_diagnostics::snapshot_begin();
      - script.execute: send_snapshot_rows
  - id: send_snapshot_rows
    mode: single
    then:
      - while:
          condition:
            lambda: return screen_diagnostics::streaming();
          then:
            - lambda: screen_diagnostics::snapshot_next_row();
            - delay: 100ms

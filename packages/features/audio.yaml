# ESP Screens - a board's microphone and speaker as one audio graph, for a board file that includes this one
# (phase 1 of the audio plan: ESPHome's own components only).
#
# The board file brings its hardware: the I2S bus of the speaker (`ts_speaker_bus`) and of the microphone
# (`ts_mic_bus`, the same bus on a board that has one), its DAC as `audio_dac` with `id: ts_audio_dac` and its ADC,
# and the two data pins in `AUDIO_DOUT_PIN` and `AUDIO_DIN_PIN`. This file builds what every such screen then has,
# under the ids a plugin may count on (plugin API 0.7, `plugin_manifest.FEATURES`):
#
# - `ts_microphone`: the microphone, shared by whatever listens (ESPHome's microphone source);
# - `ts_speaker`: the mixer's input for announcements, voice and a plugin's sounds, which always wins;
# - `ts_media_player`: Home Assistant's media player of the screen, so announcements and TTS work without a voice
#   assistant; music plays on its own mixer input under them.
#
# Only boards with PSRAM include it: the decoders and the buffers live there.
substitutions:
  AUDIO_SAMPLE_RATE: "48000"

microphone:
  - platform: i2s_audio
    id: ts_microphone
    i2s_audio_id: ts_mic_bus
    i2s_din_pin: ${AUDIO_DIN_PIN}
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

speaker:
  # The DAC, the one speaker that reaches the glass's loudspeaker.
  - platform: i2s_audio
    id: ts_speaker_out
    i2s_audio_id: ts_speaker_bus
    i2s_dout_pin: ${AUDIO_DOUT_PIN}
    dac_type: external
    audio_dac: ts_audio_dac
    sample_rate: ${AUDIO_SAMPLE_RATE}
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 100ms
  # Two inputs in front of it: announcements over music.
  - platform: mixer
    id: ts_mixer
    output_speaker: ts_speaker_out
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: ts_speaker
      - id: ts_media_speaker

media_source:
  - platform: audio_http
    id: ts_announcement_source
  - platform: audio_http
    id: ts_media_source

media_player:
  - platform: speaker_source
    id: ts_media_player
    name: "Media Player"
    volume_initial: 0.5
    announcement_pipeline:
      speaker: ts_speaker
      sources: [ts_announcement_source]
      format: FLAC
      sample_rate: ${AUDIO_SAMPLE_RATE}
      num_channels: 1
    media_pipeline:
      speaker: ts_media_speaker
      sources: [ts_media_source]
      format: FLAC
      sample_rate: ${AUDIO_SAMPLE_RATE}
      num_channels: 1

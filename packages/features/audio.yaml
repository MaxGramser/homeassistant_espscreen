# ESPHome I2S transport for the shared audio graph: the speaker (audio-speaker.yaml) and the microphone. Board-specific
# transports reuse audio-player.yaml.
packages:
  speaker: !include audio-speaker.yaml

microphone:
  - platform: i2s_audio
    id: ts_microphone
    i2s_audio_id: ${AUDIO_MIC_BUS}
    i2s_din_pin: ${AUDIO_DIN_PIN}
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

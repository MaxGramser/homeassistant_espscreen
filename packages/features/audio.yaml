# ESP Screens - a board's microphone and speaker as one audio graph, for a board file that includes this one
# (phase 1 of the audio plan: ESPHome's own components only).
#
# The board file brings its hardware: the I2S bus of the speaker (`ts_speaker_bus`) and of the microphone (`ts_mic_bus`,
# or the speaker's in `AUDIO_MIC_BUS` on a board with one bus), its DAC as `audio_dac` with `id: ts_audio_dac` and its ADC,
# the two data pins in `AUDIO_DOUT_PIN` and `AUDIO_DIN_PIN`, and how its DAC turns ESPHome's volume into decibels:
# `AUDIO_DAC_DB_AT_0` at 0 and `AUDIO_DAC_DB_AT_1` at 1, evenly in between, as a DAC's volume register runs (the
# ES8311: -95.5 dB to +32 dB). This file builds what every such screen then has,
# under the ids a plugin may count on (plugin API 0.7, `plugin_manifest.FEATURES`):
#
# - `ts_microphone`: the microphone, shared by whatever listens (ESPHome's microphone source);
# - `ts_speaker`: the speaker for announcements, voice and a plugin's sounds at any rate, which always wins over music;
# - `ts_media_player`: Home Assistant's media player of the screen, so announcements and TTS work without a voice
#   assistant; music plays on its own mixer input under them.
#
# A board whose microphone and speaker share one I2S bus sets `AUDIO_HALF_DUPLEX: "true"` and includes
# features/audio-half-duplex.yaml: ESPHome lets the two take turns on a bus, never both at once. Its speaker then lets go
# of the bus half a second after a sound, and the microphone lets go of it whenever the speaker wants it, for any sound,
# and listens again after.
#
# Only boards with PSRAM include it: the decoders and the buffers live there.
substitutions:
  AUDIO_SAMPLE_RATE: "48000"
  AUDIO_HALF_DUPLEX: "false"
  AUDIO_MIC_BUS: ts_mic_bus
  # The volume as ears hear it: Home Assistant's 0 to 100 % runs evenly in decibels, from AUDIO_VOLUME_DB_LOW (5 % is
  # just audible beside the screen) to AUDIO_VOLUME_DB_HIGH (the DAC's full scale, without a digital gain that clips);
  # 0 % mutes. The media player maps its volume onto that part of the DAC's range (volume_min and volume_max below).
  AUDIO_VOLUME_DB_LOW: "-45"
  AUDIO_VOLUME_DB_HIGH: "0"
  # At start: the speaker's bus starts in silence, in the stream the mixer sends it, and keeps running (timeout: never
  # below), so the one pop of a DAC getting its clock falls in the start and never before a sound; on a bus the
  # microphone shares it only starts for a sound (the board switches its amplifier around it). And on the screen's
  # settings page, under Extras (docs/SETTINGS.md, "A board's own settings"): the volume, which is the media player's
  # own (Home Assistant shows and sets the same), and the microphone's switch.
  BOOT_AUDIO: |-
    if (!${AUDIO_HALF_DUPLEX}) {
      id(ts_speaker_out)->set_audio_stream_info(audio::AudioStreamInfo(16, 1, ${AUDIO_SAMPLE_RATE}));
      id(ts_speaker_out)->start();
    }
    settings_screen::board_rows.push_back(settings_screen::number(screen_text::txt::settings_media_player,
        []() -> int32_t { return static_cast<int32_t>(lroundf(id(ts_media_player).volume * 100.0f)); },
        [](int32_t value) { id(ts_media_player).make_call().set_volume(value / 100.0f).perform(); }, 0, 100, 5, "%"));
    settings_screen::board_rows.push_back(settings_screen::toggle(screen_text::txt::settings_microphone,
        []() -> int32_t { return id(ts_microphone_on).state ? 1 : 0; },
        [](int32_t on) { if (on) id(ts_microphone_on).turn_on(); else id(ts_microphone_on).turn_off(); }));

microphone:
  - platform: i2s_audio
    id: ts_microphone
    i2s_audio_id: ${AUDIO_MIC_BUS}
    i2s_din_pin: ${AUDIO_DIN_PIN}
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

# Whether the microphone listens: off mutes it for everything that reads it, kept over a restart. The same switch in
# Home Assistant, in the app (boards.yaml `settings`) and on the screen's settings page.
switch:
  - platform: template
    id: ts_microphone_on
    name: "Microphone"
    icon: "mdi:microphone"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - microphone.unmute: ts_microphone
    on_turn_off:
      - microphone.mute: ts_microphone

speaker:
  # The DAC, the one speaker that reaches the glass's loudspeaker.
  - platform: i2s_audio
    id: ts_speaker_out
    i2s_audio_id: ts_speaker_bus
    i2s_dout_pin: ${AUDIO_DOUT_PIN}
    dac_type: external
    audio_dac: ts_audio_dac
    sample_rate: ${AUDIO_SAMPLE_RATE}
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 100ms
    # The bus keeps running in silence from the start (BOOT_AUDIO), as Home Assistant's Voice PE keeps it: a DAC that
    # lost its clock pops through the amplifier when it gets it back, before every sound. A bus the microphone shares is
    # let go after half a second, so the microphone gets its turn.
    timeout: ${ "500ms" if (AUDIO_HALF_DUPLEX | string | lower) == "true" else "never" }
  # Two inputs in front of it: announcements over music.
  - platform: mixer
    id: ts_mixer
    output_speaker: ts_speaker_out
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: ts_announcement_input
      - id: ts_media_input
  # And in front of each a resampler, as in Home Assistant's Voice PE: a sound at any rate (a plugin's 48 kHz sound on a
  # bus that runs at 16 kHz) reaches the mixer at the bus's own rate, so the bus never starts again for another rate.
  # ts_speaker is the one announcements, voice and a plugin's sounds play on.
  - platform: resampler
    id: ts_speaker
    output_speaker: ts_announcement_input
    task_stack_in_psram: true
  - platform: resampler
    id: ts_media_speaker
    output_speaker: ts_media_input
    task_stack_in_psram: true

media_source:
  - platform: audio_http
    id: ts_announcement_source
  - platform: audio_http
    id: ts_media_source

media_player:
  - platform: speaker_source
    id: ts_media_player
    name: "Media Player"
    volume_initial: 0.5
    volume_min: ${ ((AUDIO_VOLUME_DB_LOW | float) - (AUDIO_DAC_DB_AT_0 | float)) / ((AUDIO_DAC_DB_AT_1 | float) - (AUDIO_DAC_DB_AT_0 | float)) }
    volume_max: ${ ((AUDIO_VOLUME_DB_HIGH | float) - (AUDIO_DAC_DB_AT_0 | float)) / ((AUDIO_DAC_DB_AT_1 | float) - (AUDIO_DAC_DB_AT_0 | float)) }
    announcement_pipeline:
      speaker: ts_speaker
      sources: [ts_announcement_source]
      format: FLAC
      sample_rate: ${AUDIO_SAMPLE_RATE}
      num_channels: 1
    media_pipeline:
      speaker: ts_media_speaker
      sources: [ts_media_source]
      format: FLAC
      sample_rate: ${AUDIO_SAMPLE_RATE}
      num_channels: 1

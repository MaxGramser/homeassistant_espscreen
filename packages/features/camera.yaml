# ESP Screens - camera images, for a board with the memory to show them (PSRAM).
#
# A camera tile opens its picture full screen, a page's camera tiles show a live picture each, and an alert can bring
# a snapshot along (firmware 0.2.57+, 0.2.77+). ESP Screen Manager serves every image already sized for the screen:
# the full view is the canvas, and the alert's image the box screen_alert::layout gives it on that canvas
# (tools/generate_board_shapes.py works out both for boards.json, with screen_manager/app/alert_layout.py for the alert).
substitutions:
  # The canvas lying down, which ESP Screen Manager sizes a full-screen picture for (camera_feed.BOXES).
  CAMERA_FULL_W: ${ PANEL_H if (ROTATION_LANDSCAPE | int) in (90, 270) else PANEL_W }
  CAMERA_FULL_H: ${ PANEL_W if (ROTATION_LANDSCAPE | int) in (90, 270) else PANEL_H }

  # Code the shared lambdas of packages/core.yaml take from this file (docs/PROFILES.md, "hooks")
  # the alert's camera frame is a paint of its own (theme::paints)
  CAMERA_PAINT_FILL: "theme::fill(id(paint_camera), Paint::camera);"
  # in runtime_tiles::dismiss, after the detail card closes
  CLOSE_CARDS_HOOK: "runtime_tiles::camera_close();"
  # after the gesture: the three pictures and the alert's frame
  BOOT_CAMERA_HOOKS: |-
    // Camera images (firmware 0.2.57+): the three pictures a board with PSRAM downloads, each in a task of its own
    // beside the main loop (picture_fetch, firmware 0.49.0+). A slot keeps the ETag of its link, so an unchanged picture
    // answers 304; a new link forgets it. The slot's `done` runs on the main loop (picture_fetch::tick, every 50 ms) and
    // hands the picture to the one route every picture goes (runtime_tiles::picture_done, picture_loader.h).
    picture_fetch::bind(picture_fetch::full(), [](bool ok, bool cached) {
      runtime_tiles::picture_done(picture_loader::Slot::FULL, ok, cached);
    });
    runtime_tiles::camera_full.load = [](const std::string &url) { picture_fetch::load(picture_fetch::full(), url); };
    runtime_tiles::camera_full.release = []() { picture_fetch::release(picture_fetch::full()); };
    runtime_tiles::camera_full.source = []() { return picture_fetch::source(picture_fetch::full()); };
    picture_fetch::bind(picture_fetch::thumb(), [](bool ok, bool cached) {
      runtime_tiles::picture_done(picture_loader::Slot::THUMB, ok, cached);
    });
    runtime_tiles::camera_thumb.load = [](const std::string &url) { picture_fetch::load(picture_fetch::thumb(), url); };
    runtime_tiles::camera_thumb.release = []() { picture_fetch::release(picture_fetch::thumb()); };
    runtime_tiles::camera_thumb.source = []() { return picture_fetch::source(picture_fetch::thumb()); };
    // The tiles' own pictures (a live camera, a cover, a favourite, a map: tile_picture.h), one at a time in the third slot.
    picture_fetch::bind(picture_fetch::live(), [](bool ok, bool cached) {
      runtime_tiles::picture_done(picture_loader::Slot::LIVE, ok, cached);
    });
    runtime_tiles::camera_live.load = [](const std::string &url) { picture_fetch::load(picture_fetch::live(), url); };
    runtime_tiles::camera_live.release = []() { picture_fetch::release(picture_fetch::live()); };
    runtime_tiles::camera_live.source = []() { return picture_fetch::source(picture_fetch::live()); };
    // The alert's frame for the picture; runtime_tiles::alert_place makes room for it in the card.
    runtime_tiles::alert_frame = id(alert_image_frame);
    runtime_tiles::alert_frame_icon = id(alert_image_icon);
  # what else keeps the settings page closed (inline, in the condition)
  MAY_OPEN_EXTRA: " && !runtime_tiles::camera_visible()"
  # every 250 ms after runtime_tiles::tick()
  TICK_HOOK: "runtime_tiles::camera_tick();"
  # back_to_page_1_when_due: what else counts as away from page 1 (inline)
  AWAY_EXTRA: " runtime_tiles::camera_visible() ||"
  # alert_show: after the settings page closed, before the card is made
  ALERT_SHOW_HOOK: |-
    // An open camera closes; the card makes room for an image the app announced for this alert.
    runtime_tiles::alert_prepare();

api:
  actions:
    # A camera full screen from Home Assistant (firmware 0.2.57+), as a tap on its tile opens it; an empty entity closes
    # it. Only a camera on the screen's tiles or in a recent alert gets an image from ESP Screens.
    - action: preview_camera
      variables:
        entity: string
      then:
        - lambda: |-
            if (entity.empty()) { runtime_tiles::camera_close(); return; }
            id(last_use_ms) = millis();
            id(wake_display).execute();
            std::string name = entity;
            for (size_t i = 0; i < runtime_tiles::model.count; ++i)
              if (runtime_tiles::model.tiles[i].entity == entity) { name = runtime_tiles::model.tiles[i].name; break; }
            runtime_tiles::camera_open(entity, name);

# ESP Screen Manager serves each image as an uncompressed BMP on its own port on the LAN (screen_manager/app/camera_feed.py).
# The screen downloads it in a task beside the main loop (components/smart_display/picture_fetch.cpp, firmware 0.49.0+)
# and decodes it as it comes, so touch and drawing never wait for the network. Before, ESPHome's online_image downloaded
# in the main loop, 16 KB a turn, and every turn waited for its chunk: a page of album covers (a few hundred KB at the
# 200 KB/s a 4-inch panel manages) held the glass still for two to three seconds, and so did every camera picture for
# the better part of a second. One picture full screen (also the cover and the library's covers), one in an alert's
# frame, and one for the tiles' own pictures (a live camera, a cover, a favourite, a map); runtime_tiles.h decides when
# they load and frees them when they close. Plain HTTP on the LAN, no certificates.
# LVGL's image widget, which every picture is drawn with: made only in C++ (runtime_tiles.h, media_library.cpp), so
# the YAML names no image and this flag enables it, as the core's flags do for the widgets it makes itself
# (docs/PROFILES.md, "Widgets made only in C++"). Before firmware 0.49.0 a hidden image widget of the alert's
# online_image did this.
esphome:
  platformio_options:
    build_flags:
      - -DLV_USE_IMAGE=1
      # And the download task itself (picture_fetch.cpp), built only where there are pictures to download.
      - -DSCREEN_PICTURES=1

interval:
  # A finished download is handed to its card here, on the main loop.
  - interval: 50ms
    then:
      - lambda: 'picture_fetch::tick();'

lvgl:
  style_definitions:
    # The alert's camera frame (theme::paints fills it: CAMERA_PAINT_FILL).
    - id: paint_camera
  top_layer:
    widgets:
      - obj:
          id: !extend alert_overlay
          widgets:
            - obj:
                id: !extend alert_card
                widgets:
                  # The alert's camera image (firmware 0.2.57+) across the top of the card, shown when the app announced
                  # one; a tap opens the camera full screen over the alert. runtime_tiles.h puts the image in it, and
                  # places and sizes the frame on this screen's glass (runtime_tiles::alert_place, firmware 0.2.103+).
                  # Rounded like the alert card itself (firmware 0.2.73+); the image takes this radius (alert_done).
                  - obj:
                      id: alert_image_frame
                      hidden: true
                      styles: paint_camera
                      bg_opa: COVER
                      radius: 18
                      border_width: 0
                      shadow_width: 0
                      pad_all: 0
                      clickable: true
                      scrollable: false
                      scrollbar_mode: 'OFF'
                      pressed:
                        bg_opa: COVER
                      on_click:
                        - if:
                            condition:
                              lambda: 'return screen_input::touch_guard.accept(millis(), 14) && !runtime_tiles::alert_camera.empty();'
                            then:
                              - lambda: 'runtime_tiles::camera_open(runtime_tiles::alert_camera, id(alert_title_text));'
                      widgets:
                        - label:
                            id: alert_image_icon
                            align: CENTER
                            text: "\U000F07AE"
                            text_font: materialdesign_icons
                            clickable: false

# ESP Screens - the UI self test, with a check of the layout's geometry, on every board.
#
# `ui_self_test` renders every page and overlay a few times without controlling a device and logs PASS or FAIL
# (diagnostics/run_ui_test.py on a screen, tools/render/run.py on this computer). It also checks that nothing falls
# outside its area (screen_diagnostics::check_geometry in components/smart_display/screen_diagnostics.h). The CYD had a
# lighter copy without that check until app 0.2.129, for its flash; the check costs it some 400 bytes.
esphome:
  # The geometry check (screen_diagnostics::check_geometry) this test runs.
  includes:
    - <esphome/components/smart_display/screen_diagnostics.h>

script:
  # Render every overlay and both pages repeatedly without controlling devices.
  - id: ui_self_test
    mode: single
    then:
      - lambda: 'ESP_LOGI("ui_test", "UI_TEST START frames=%u: page/overlay render stress, no HA actions", (unsigned) id(rendered_frames));'
      - lambda: 'ESP_LOGI("ui_test", "Light sliders: %s", light_controls::self_test() ? "PASS" : "FAIL");'
      - lambda: 'id(calibration_active) = false;'
      - lvgl.page.show: home_page
      - script.execute: wake_display
      - repeat:
          count: 10
          then:
            - lambda: |-
                id(last_touch_ms) = millis();
                id(last_use_ms) = millis();
                static unsigned test_page=0;
                id(tile_page) = runtime_tiles::enabled ? test_page++ % runtime_tiles::page_count() : 1;
            - script.execute: show_tile_page
            - delay: 300ms
            - lambda: |-
                lv_obj_update_layout(id(tile_scroll));
                const int count = runtime_tiles::model.count;
                // Wide cards take two slots, so visibility follows the runtime packing.
                const bool paginated = runtime_tiles::enabled
                    ? runtime_tiles::model.page_data.included(id(tile_page)) && runtime_tiles::model.page_data.count() > 1
                    : count > 6;
                // One card per cell of the grid in use (the table holds the most cells a grid may have, firmware
                // 0.53.0+): it is on screen when the page has a tile for its cell.
                bool ok = screen_diagnostics::check_geometry(id(home_page)->obj);
                for (size_t i = 0; i < runtime_tiles::grid.slots(); ++i) {
                  const auto &w = runtime_tiles::widgets[i];
                  bool visible = w.index < runtime_tiles::model.count;
                  ok = ok && w.tile && (lv_obj_has_flag(w.tile, LV_OBJ_FLAG_HIDDEN) != visible);
                }
                // Sequential arrows become Back on an excluded page. Its tile
                // area keeps the same height; hiding the footer uses top-bar Back.
                const bool bar = paginated && (!runtime_tiles::enabled || settings_screen::page_buttons);
                const bool detail = runtime_tiles::enabled && runtime_tiles::model.page_data.detail(id(tile_page));
                const bool footer = runtime_tiles::enabled ? runtime_tiles::model.page_data.footer(settings_screen::page_buttons) : bar;
                ok = ok && (lv_obj_has_flag(id(page_prev), LV_OBJ_FLAG_HIDDEN) != (bar || (detail && footer)));
                for (lv_obj_t* control : {id(page_next), id(page_number)})
                  ok = ok && (lv_obj_has_flag(control, LV_OBJ_FLAG_HIDDEN) != bar);
                lv_area_t nav, grid;
                lv_obj_get_coords(id(page_next), &nav);
                lv_obj_get_coords(id(tile_scroll), &grid);
                ok = ok && (!footer || grid.y2 < nav.y1);
                if(runtime_tiles::enabled)ok = runtime_tiles::check_tile_geometry() && ok;
                ESP_LOGI("ui_test", "page_check=%s count=%d heap=%u frames=%u grid_bottom=%d nav_top=%d", ok ? "PASS" : "FAIL", count, (unsigned) esp_get_free_heap_size(), (unsigned) id(rendered_frames), (int) grid.y2, (int) nav.y1);
                id(tile_page) = 0;
            - script.execute: show_tile_page
            - delay: 150ms
            - lambda: 'runtime_tiles::colour_demo(true);'
            - delay: 150ms
            - lambda: screen_diagnostics::check_geometry(runtime_tiles::colour_root);
            - lambda: 'runtime_tiles::colour_demo(false);'
            - lvgl.widget.show: alert_overlay
            - delay: 150ms
            - lvgl.widget.hide: alert_overlay
      - lambda: 'if (!id(ui_refresh).is_running()) id(ui_refresh).execute();'
      - delay: 150ms
      - lambda: 'ESP_LOGI("ui_test", "UI_TEST COMPLETE frames=%u", (unsigned) id(rendered_frames));'

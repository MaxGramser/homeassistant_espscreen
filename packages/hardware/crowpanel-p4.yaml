# ESP Screens - the Elecrow CrowPanel Advanced ESP32-P4 boards apart from their glass, for a board file that includes
# this one.
#
# Elecrow sells the CrowPanel Advanced P4 in 7, 9 and 10.1 inches on one design: an ESP32-P4 with an ESP32-C6 for
# Wi-Fi, a 1024x600 MIPI-DSI panel (EK79007) with GT911 capacitive touch, a loudspeaker on an NS4168 amplifier and a
# PDM microphone, pin for pin the same, and Elecrow's own ESPHome example serves all three. Built from that example
# (V1.0 and V1.1) and from the configuration a community member ran on a 10.1 V1.2 board (GitHub #116). The board file
# (crowpanel101.yaml, crowpanel7.yaml) adds only its density and its grid. The LoRa socket, the SD card and the UARTs
# are not configured here. Only boards with a pre-v3 ESP32-P4 ("chip revision: v1.3" in the boot log) boot this
# firmware.
esphome:
  # The panel watch reads the DPI panel's vsync callback (glass_dsi.cpp, esp_lcd_dpi_panel_event_callbacks_t on_vsync),
  # which the ESP-IDF of ESPHome 2026.6.2 does not have: these boards build on 2026.9.0, the add-on's ESPHome, as the
  # other ESP32-P4 boards do (CI's min_version build, 2026-10-29).
  min_version: 2026.9.0

packages:
  # The ESP32-P4, its memory, the ESP32-C6 for Wi-Fi and the touch bus, with these boards' own pins below.
  hardware: !include esp32p4-c6.yaml

substitutions:
  # More tiles and pages than the 64 and eight of a board without PSRAM (firmware 0.34.0+): an ESP32-P4 has the PSRAM and
  # the memory inside the chip for them, and the memory budget (tile_memory.h) says how many a layout really takes.
  SCREEN_MAX_TILES: "256"
  SCREEN_MAX_PAGES: "16"
  SCREEN_MAX_BAR_ITEMS: "12"                   # a wider top bar where the glass has the width for it

  # The Wi-Fi link and the touch bus on these boards' own pins (hardware/esp32p4-c6.yaml has the Guition's). From
  # hardware revision V1.1 on, the data lines run the other way round, D0 on GPIO17 to D3 on GPIO14 (a V1.0 board has
  # them on GPIO14 to GPIO17, as Elecrow's V1.0 example does), and the C6's reset is GPIO32.
  HOSTED_RESET_PIN: GPIO32
  HOSTED_D0_PIN: GPIO17
  HOSTED_D1_PIN: GPIO16
  HOSTED_D2_PIN: GPIO15
  HOSTED_D3_PIN: GPIO14
  TOUCH_SDA: GPIO45
  TOUCH_SCL: GPIO46

  # The audio (features/audio.yaml): an NS4168 amplifier that takes I2S as it is, with no volume register, so the
  # speaker turns ESPHome's volume down in software, -49 dB at 0 to 0 dB at 1 (ESPHome's i2s_audio speaker), and a PDM
  # microphone on a bus of its own.
  AUDIO_DOUT_PIN: GPIO23
  AUDIO_DIN_PIN: GPIO26
  AUDIO_DAC_DB_AT_0: "-49"
  AUDIO_DAC_DB_AT_1: "0"
  AUDIO_AMPLIFIER: board_speaker_amp

esp32:
  flash_size: 16MB

# A second internal regulator at 2.5 V beside the MIPI-DSI PHY's (channel 3, in the hardware file): Elecrow's example and
# the configuration that ran on the board both turn it on.
esp_ldo:
  - channel: 4
    voltage: 2.5V

# The power of the LCD and its touch panel: on from the start and never switched off (standby darkens the backlight
# below, not the panel). Elecrow's example drives it high the same way.
switch:
  - platform: gpio
    id: board_panel_power
    internal: true
    pin: GPIO29
    restore_mode: ALWAYS_ON
  # The amplifier's enable, low for on (Elecrow's wiki calls it the amplifier control); features/audio-amplifier.yaml
  # switches it with the sound.
  - platform: gpio
    id: board_speaker_amp
    internal: true
    pin:
      number: GPIO30
      inverted: true
    restore_mode: ALWAYS_OFF

# The backlight, a PWM pin (features/backlight.yaml makes it the light).
output:
  - platform: ledc
    pin: GPIO31
    id: gpio_backlight_pwm

# ESPHome's own mipi_dsi platform knows this panel by name: `model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B` is the
# EK79007 at 1024x600 with its timings and init sequence, the model Elecrow's own example uses. Its reset is GPIO41 on
# these boards.
display:
  - platform: mipi_dsi
    id: my_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin: GPIO41
    update_interval: never
    auto_clear_enabled: false

# ESPHome's own gt911 platform; the GT911 reports the panel's own pixels, so the transform stays the core's.
touchscreen:
  - platform: gt911
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    reset_pin: GPIO40
    interrupt_pin: GPIO42
    update_interval: 20ms

# The audio, as Elecrow's wiki wires it: the amplifier's I2S bus (LRCLK GPIO21, BCLK GPIO22, data GPIO23) and the PDM
# microphone's, whose clock is the bus's word clock (GPIO24, data GPIO26).
i2s_audio:
  - id: ts_speaker_bus
    i2s_lrclk_pin: GPIO21
    i2s_bclk_pin: GPIO22
  - id: ts_mic_bus
    i2s_lrclk_pin: GPIO24

# The NS4168 has no control interface: no audio_dac, and the speaker's own software volume instead.
speaker:
  - id: !extend ts_speaker_out
    audio_dac: !remove

microphone:
  - id: !extend ts_microphone
    pdm: true

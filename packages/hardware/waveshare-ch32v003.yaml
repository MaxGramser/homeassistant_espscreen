# ESP Screens - the Waveshare ESP32-S3-Touch-LCD boards whose touch and backlight hang on Waveshare's CH32V003
# expander (the 7B and the 4.3C), for a board file that includes this one.
#
# What these boards share: the chip (hardware/esp32s3-rgb.yaml), the one I2C bus the GT911 and the expander share, the
# expander's lines for the touch reset (EXIO1) and the backlight enable (EXIO2), its PWM output for the backlight's
# level, and the GT911 with its interrupt line on GPIO4. The board file names its panel (`display:` with its pins and
# timings, the expander's EXIO2 among its enable pins) and its log port, and states `esphome: min_version: 2026.7.0`
# for the expander. The Waveshare 4 V4.0 has the same expander on other pins, with lines of its own, and does not
# include this file.
packages:
  chip: !include esp32s3-rgb.yaml

# The GT911 and the expander share the board's only I2C bus.
i2c:
  id: touch_bus
  sda: GPIO8
  scl: GPIO9
  scan: true

# Waveshare's CH32V003 is a small microcontroller with its own firmware that answers as an expander at 0x24: eight
# lines, one PWM output and one ADC. ESPHome has had a component for it since 2026.7.0.
waveshare_io_ch32v003:
  - id: expander
    i2c_id: touch_bus

output:
  # The backlight's level is the expander's PWM output, low for full light (inverted). The safe levels are
  # ESPHome's defaults for this expander: 247 keeps the backlight from flickering at the dark end, and 1 is full light.
  # The enable line (EXIO2) stays out of this output. It goes high once, with the panel, and never low again: on the
  # 4.3-inch Waveshare, switching the backlight's boost converter on from a dark screen browned the board out
  # (packages/features/backlight-always-on.yaml). A level of 0 is the darkest the PWM gives, with the enable kept on.
  - platform: waveshare_io_ch32v003
    id: gpio_backlight_pwm
    waveshare_io_ch32v003_id: expander
    inverted: true
    safe_pwm_levels:
      min_value: 1
      max_value: 247

# The GT911's reset line hangs on the expander; its interrupt line is GPIO4, which ESPHome holds low while the chip
# resets so that it answers at 0x5D, as Waveshare's own code does. It reports pixels of the panel.
touchscreen:
  - platform: gt911
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    update_interval: 20ms
    interrupt_pin: GPIO4
    reset_pin:
      waveshare_io_ch32v003: expander
      number: 1
      mode:
        output: true

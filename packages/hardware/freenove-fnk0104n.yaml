# ESP Screens - the Freenove FNK0104N hardware: ESP32-S3 with 16 MB flash and 8 MB octal PSRAM, a 3.5-inch
# 320 x 480 ST77922 panel over QSPI, built-in ST77922 TDDI capacitive touch over I2C (compatible with ESPHome's st7123
# protocol) and a PWM backlight on GPIO41.
#
# Pins and init sequence come from Freenove's Freenove_ESP32_S3_Display repository (ST77922.cpp / ST77922.h /
# ST77922_Touch.h). Battery ADC (GPIO8), ES8311 audio (I2S on GPIO15-18/21, amp enable GPIO1), WS2812 RGB LED (GPIO40)
# and SDMMC (GPIO2-7) are documented in docs/FREENOVEFNK0104N.md and left unconfigured here.
packages:
  build: !include esp-idf.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz

psram:
  mode: octal
  speed: 80MHz

# The panel's QSPI bus: four data lines, no DC pin (commands and pixels use QSPI opcodes 0x02 / 0x32).
spi:
  id: lcd
  type: quad
  clk_pin: GPIO12
  data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]

# The ST77922 TDDI touch interface at 0x55 (shared on the board with the ES8311 codec).
i2c:
  id: touch_bus
  sda: GPIO38
  scl: GPIO39
  frequency: 400kHz
  scan: true

# The backlight, a PWM pin (features/backlight.yaml makes it the light).
output:
  - platform: ledc
    pin: GPIO41
    id: gpio_backlight_pwm
    frequency: ${BACKLIGHT_FREQUENCY}

# Built-in ST77922 capacitive touch (0x55, 16-bit big-endian registers, 7-byte point records), using ESPHome's st7123
# driver (available from ESPHome 2026.7.0).
touchscreen:
  - platform: st7123
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    interrupt_pin: GPIO47
    reset_pin: GPIO48
    update_interval: 20ms

# ST77922 over QSPI using mipi_spi CUSTOM. ST77922 lacks reliable MADCTL.MV hardware axis swap, so hardware transform
# is disabled and LVGL rotates the canvas; draw_rounding: 4 enforces ST77922's 4-pixel QSPI window alignment.
# COLMOD (0x3A), MADCTL (0x36), INVON (0x21), SLPOUT (0x11) and DISPON (0x29) are appended by mipi_spi.
display:
  - platform: mipi_spi
    id: my_display
    model: CUSTOM
    spi_id: lcd
    bus_mode: quad
    cs_pin: GPIO10
    spi_mode: MODE0
    data_rate: 40MHz
    dimensions:
      width: 320
      height: 480
    color_order: rgb
    invert_colors: true
    transform: disabled
    draw_rounding: 4
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - [0xF1, 0x00]
      - [0x60, 0x00, 0x00, 0x00]
      - [0x65, 0x80]
      - [0x79, 0x06]
      - [0x7B, 0x00, 0x08, 0x08]

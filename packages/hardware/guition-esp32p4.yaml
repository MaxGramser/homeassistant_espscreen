# ESP Screens - a Guition panel on an ESP32-P4 with an ESP32-C6 for Wi-Fi, for a board file that includes this one.
#
# The chip, its memory, the supply of the MIPI-DSI PHY, the Wi-Fi co-processor, the I2C bus of the touch panel and the
# backlight's pin: what the 10.1-inch JC8012P4A1 and the 7-inch JC1060P470 share, pin for pin. The board file adds its
# display and its touch panel. `HOSTED_SDIO_FREQUENCY` is the clock of the Wi-Fi link, which a board may lower, and
# `ESP32P4_ENGINEERING_SAMPLE` the silicon the firmware is built for, which a board with rev3 silicon sets to false.
packages:
  build: !include esp-idf.yaml

substitutions:
  HOSTED_SDIO_FREQUENCY: "40MHz"
  ESP32P4_ENGINEERING_SAMPLE: "true"

esp32:
  variant: esp32p4
  flash_size: 16MB
  # Engineering-sample silicon (pre-v3) runs at 360 MHz at most; rev3 does 400 MHz. Both build at 360 MHz, which is
  # what the community configurations for rev3 panels run as well.
  cpu_frequency: 360MHz
  # The first panels carry pre-v3 chips ("chip revision: v1.3" in the boot log). ESP-IDF links a different memory
  # layout for pre-v3 and for rev3 (CONFIG_ESP32P4_SELECTS_REV_LESS_V3) and the two are NOT binary compatible: a
  # firmware built with this flag does not boot on rev3 silicon, and the other way round. Checked on a real
  # JC8012P4A1 (pull request #14). A rev3 chip (v3.0 or higher in the boot log, "esp32p4-eco7" in the ROM line) given
  # a pre-v3 firmware restarts straight after the bootloader with CHIP_LP_WDT_RESET, over and over (GitHub issue #52);
  # its board file sets ESP32P4_ENGINEERING_SAMPLE to false.
  engineering_sample: ${ESP32P4_ENGINEERING_SAMPLE}
  framework:
    advanced:
      execute_from_psram: true
    sdkconfig_options:
      # The Wi-Fi co-processor's driver (esp_hosted): its own memory pool off and its task stack in PSRAM, so the
      # memory inside the chip stays for LVGL and the panel; the extra thread-local slot is what that driver asks
      # for. All three from the build that ran on the real board (pull request #14).
      CONFIG_ESP_HOSTED_USE_MEMPOOL: "n"
      CONFIG_ESP_HOSTED_DFLT_TASK_FROM_SPIRAM: "y"
      CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS: "1"

psram:
  mode: hex
  speed: 200MHz

# The MIPI-DSI PHY has its own supply, switched by one of the chip's internal regulators.
esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: true

# The P4 has no radio: an ESP32-C6 beside it does the Wi-Fi over a four-bit SDIO bus.
esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  sdio_frequency: ${HOSTED_SDIO_FREQUENCY}

logger:
  tx_buffer_size: 2048
  hardware_uart: UART0

i2c:
  id: touch_bus
  sda: GPIO7
  scl: GPIO8
  frequency: 400kHz
  # The board has its own pull-ups on this bus.
  sda_pullup_enabled: false
  scl_pullup_enabled: false
  scan: true

# The backlight, a PWM pin (features/backlight.yaml makes it the light).
output:
  - platform: ledc
    pin: GPIO23
    id: gpio_backlight_pwm

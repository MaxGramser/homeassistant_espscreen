# ESP Screens - how every board's firmware is built, for every board to include (directly, or through a hardware file).
#
# ESPHome's recommended ESP-IDF, without ESP-IDF's assert texts (file, line and condition of every check; firmware
# 0.2.75+, 49 KB on the CYD): a failed assert still stops and restarts the screen, and its backtrace still points at
# the line. ESP-IDF's error names stay: without them ESPHome's own error lines only say "UNKNOWN ERROR". The board file
# names its chip (`esp32: board:`, `variant:`) and what else it needs; packages/core.yaml has no esp32: block, so the
# shared tree also builds for ESPHome's host platform (tools/render_topbar.py).
esp32:
  framework:
    type: esp-idf
    version: recommended
    advanced:
      assertion_level: SILENT
      # The loop task runs LVGL, every tile and the API. 16 KB since firmware 0.3.1, when replacing a layout took
      # 8.1-8.3 KB on the CYD and the Guition. By 2026-11 the parser and the page built inside the API's call took a
      # Guition 10.1 to 40 bytes from the end, and a page of live tiles over it. Since then a message pays only its own
      # op and a page is built from the loop's next pass: tools/stack_chains.py measures 9.7 KB for a message's deepest
      # path on a P4 and an S3 and 8.2 KB on the CYD, 5.6-5.9 KB for a page, before LVGL's own depth. The size stays
      # until a board's "Loop Stack Free" with its largest layout says less than 4 KB is left (docs/ARCHITECTURE.md,
      # "The loop's stack"); then it is sized from that reading. Every KB here is a KB of internal RAM, in .bss.
      loop_task_stack_size: 16384

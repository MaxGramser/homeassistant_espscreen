# The original half-duplex transport, without the AEC dependency.
packages:
  audio: !include ../../features/audio.yaml
  half_duplex: !include ../../features/audio-half-duplex.yaml

substitutions:
  AUDIO_SAMPLE_RATE: "16000"
  AUDIO_HALF_DUPLEX: "true"
  P4_AEC_SETTINGS: ""

i2s_audio:
  - id: ts_speaker_bus
    i2s_mclk_pin: GPIO13
    i2s_bclk_pin: GPIO12
    i2s_lrclk_pin: GPIO10

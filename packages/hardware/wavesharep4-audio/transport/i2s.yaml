# Standard ESPHome audio transport. Capture and playback take turns.
i2s_audio:
  - id: panel_audio_bus
    i2s_mclk_pin: GPIO13
    i2s_bclk_pin: GPIO12
    i2s_lrclk_pin: GPIO10

microphone:
  - platform: i2s_audio
    id: panel_microphone
    i2s_audio_id: panel_audio_bus
    adc_type: external
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: stereo

speaker:
  - platform: i2s_audio
    id: panel_speaker
    i2s_audio_id: panel_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO9
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 500ms
    timeout: 500ms

# Experimental opt-in transport. ESPHome endpoints backed by Espressif FD AEC.
# Keep codec I2C control in hardware.yaml; do not also declare stack codec owners.
external_components:
  - source:
      type: git
      url: https://github.com/n-IA-hane/esphome-audio-stack
      ref: 0482d741a938378ef948e3b8f3dd31536f9f2cc9
      path: esphome/components
    components: [esp_audio_stack, esp_aec]
    refresh: never

esp_aec:
  id: panel_aec
  sample_rate: 16000
  mode: fd_low_cost
  filter_length: 4

esp_audio_stack:
  id: panel_audio_stack
  sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 16
  rx_slot_mode: stereo
  mic_channel: left
  speaker_channels: 1
  tx_channel: left
  i2s_mclk_pin: GPIO13
  i2s_bclk_pin: GPIO12
  i2s_lrclk_pin: GPIO10
  i2s_din_pin: GPIO11
  i2s_dout_pin: GPIO9
  processor_id: panel_aec
  aec_reference: ring_buffer
  aec_reference_buffer_ms: 80
  # FD AEC uses 32 ms frames. Six DMA descriptors queue 192 ms of TX,
  # separating the software reference from actual playback. Keep two frames
  # of DMA headroom for this experimental software-reference path.
  dma_desc_num: 2

microphone:
  - platform: esp_audio_stack
    id: panel_microphone

speaker:
  - platform: esp_audio_stack
    id: panel_speaker
    buffer_duration: 100ms
    timeout: never

button:
  - platform: template
    name: Audio diagnostics
    entity_category: diagnostic
    on_press:
      - esp_audio_stack.dump_diagnostics:
          id: panel_audio_stack

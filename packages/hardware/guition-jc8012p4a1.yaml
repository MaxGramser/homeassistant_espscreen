# ESP Screens - the 10.1-inch Guition JC8012P4A1 apart from its chip revision and its LCD, for a board file that includes
# this one.
#
# Guition ships this board in two builds: the first one (guition-jc8012p4a1.yaml), with a pre-v3 ESP32-P4 and the
# first LCD, and the "V3" (guition-jc8012p4a1-v3.yaml), with rev3 silicon and the newer LCD behind the same JD9365
# driver. Everything else is the same board: the ESP32-P4 and its ESP32-C6 (shared with the 7-inch), and the GSL3680
# touch panel. The board file adds its display and says which silicon it is built for.
#
# Only the V3 includes this file for now. The first build carries the same touch panel and sensor in its own board file:
# moving them here changes nothing it builds, but it would count as a firmware update for every screen of it
# (docs/BOARD_RELEASES.md). The next shared release moves them, and the first build includes this file then.
packages:
  hardware: !include guition-esp32p4.yaml

text_sensor:
  - platform: template
    name: "Guition screen type"
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {"guition"};'

# ESPHome's own gsl3670 platform (2026.7.0+) drives the GSL3680 on this panel. `model:` brings its pins and
# the range the panel reports; the transform is the board file's, because the shared tree reads those three names.
# The driver loads a firmware table into the touch chip at boot, which ESPHome fetches from the release the
# model points at and keeps in its own cache, so a build needs to reach GitHub once.
touchscreen:
  - platform: gsl3670
    model: GUITION-JC8012P4A1
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    update_interval: 20ms
    reset_pin: GPIO22
    interrupt_pin: GPIO21

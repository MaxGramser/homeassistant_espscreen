# ESP Screens - the 10.1-inch Guition JC8012P4A1 apart from its chip revision and its LCD, for a board file that includes
# this one.
#
# Guition ships this board in two builds: the first one (guition-jc8012p4a1.yaml), with a pre-v3 ESP32-P4 and the
# first LCD, and the "V3" (guition-jc8012p4a1-v3.yaml), with rev3 silicon and the newer LCD behind the same JD9365
# driver. Everything else is the same board: the ESP32-P4 and its ESP32-C6 (shared with the 7-inch), and the GSL3680
# touch panel. The board file adds its display and says which silicon it is built for.
#
# The V2 and the V3 include this file. The first build carries the same touch panel and sensor in its own board file,
# and keeps them there: its touch runs on ESPHome's own gsl3670, the V2's and the V3's on components/gsl3680_v3
# (below).
packages:
  hardware: !include guition-esp32p4.yaml

text_sensor:
  - platform: template
    name: "Guition screen type"
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {"guition"};'

# The GSL3680 on the V3 runs on components/gsl3680_v3, the driver the community configurations for this board use:
# ESPHome's own gsl3670 loads its firmware without an error and then never reports a touch on the V3 (GitHub #52).
# The driver starts the chip, loads its firmware table, turns on the pull-up of the interrupt pin itself and reports
# the panel's own pixels (800 x 1280); the transform is the board file's, because the shared tree reads those three
# names. The chip does not always interrupt again when the finger lifts, so a contact counts as let go after 50 ms
# without a report, which is what brings LVGL its release and a tap its click.
touchscreen:
  - platform: gsl3680_v3
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    update_interval: 20ms
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    touch_timeout: 50ms

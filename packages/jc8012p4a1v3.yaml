# ESP Screens - the package a Guition JC8012P4A1 V3 builds from over GitHub. Written by tools/generate_entries.py
# from boards.yaml; do not edit.
#
# ESP Screen Manager writes every screen's own YAML with `packages: display: {url: <this repository>, files:
# [packages/jc8012p4a1v3.yaml]}` and adds the name, the Wi-Fi reference and the unique keys (docs/EASY_SETUP.md); nothing
# of that lives here. The screen is two packages: core.yaml, which every board shares, and boards/guition-jc8012p4a1-v3.yaml with this
# board's hardware and sizes (docs/PROFILES.md). checkout/jc8012p4a1v3.yaml builds the same two from a checkout.
substitutions:
  FONT_DIR: "https://raw.githubusercontent.com/MaxGramser/homeassistant_espscreen/main/fonts"

packages:
  core: !include core.yaml
  board: !include boards/guition-jc8012p4a1-v3.yaml

external_components:
  - source:
      type: git
      url: https://github.com/MaxGramser/homeassistant_espscreen.git
      ref: main
      path: components
    refresh: 0s
    components: [mipi_dsi_v3, smart_display]

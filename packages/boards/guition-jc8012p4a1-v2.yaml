# ESP Screens - Guition JC8012P4A1 "V2" board, EXPERIMENTAL: the 10.1-inch JC8012P4A1 with the first build's pre-v3
# ESP32-P4 and the newer LCD behind the same JD9365 driver. 1280x800 MIPI-DSI + GSL3680 capacitive touch, on an
# ESP32-P4 with an ESP32-C6 for Wi-Fi.
#
# 1280x800 at 149 dpi, the standard look, a grid of 5 x 5 cells. The panel itself is
# 800x1280 (portrait); LVGL turns the picture and the touch a quarter, as it does on the CYD.
# Guition sold three builds of this board. The first (guition-jc8012p4a1.yaml) has a pre-v3 chip and the first LCD, this
# one the same chip and the newer LCD (a label saying V2, a case number of 2628 or higher), the V3
# (guition-jc8012p4a1-v3.yaml) rev3 silicon and the newer LCD. The first build's LCD table on this glass gives a
# washed-out picture with a coloured line across it (GitHub issue #92), and the V3's firmware does not start on this
# chip. So this file is the V3's with the first build's chip: the same LCD and touch, and ESPHome's own display driver,
# whose fixed display clock only rev3 silicon refuses. docs/JC8012P4A1.md has what to check on the glass.
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together, docs/ADDING_A_BOARD.md how a board
# is added. Two entry files include this one: checkout/jc8012p4a1v2.yaml (a build on this computer) and
# packages/jc8012p4a1v2.yaml (the package a screen builds from over GitHub).
packages:
  # The board apart from its LCD: the pre-v3 ESP32-P4 and its ESP32-C6 (shared with the 7-inch) and the GSL3680 on
  # the driver the V3 runs it with.
  hardware: !include ../hardware/guition-jc8012p4a1.yaml
  # The cards of this board's grid, one per cell (tools/generate_cells.py writes them; docs/RESPONSIVE.md).
  cells: !include ../cells/25.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "jc8012p4a1v2"
  DEVICE_NAME: "jc8012p4a1v2-new"
  DEVICE_FRIENDLY_NAME: "My Guition 10 V2"

  # The glass: the panel's own pixels, which the display block below always drives; LVGL turns the picture and the
  # touch together, so nothing else on this board knows which way the glass hangs. 1509 diagonal pixels over
  # 10.1 inches: the look scales its sizes by the exact density, the firmware by the nearest whole number.
  PANEL_W: "800"
  PANEL_H: "1280"
  DISPLAY_DPI: "149.44920605238187"
  # The LVGL angle that lays this panel out lying down (1280 x 800). Standing up is a quarter further.
  ROTATION_LANDSCAPE: "90"
  # The touch driver of the V2 and V3 (components/gsl3680_v3) reports the panel's own pixels with x running the other
  # way (the axes are not swapped, the default); LVGL then turns picture and touch together (LVGL_ROTATION), as it
  # does on the CYD.
  TOUCH_MIRROR_X: "true"
  # The tile grid: columns and rows of cells. The shared tree places every cell from these
  # (runtime_tiles::place_page), so a board with more room states more columns or rows.
  # Five by five (firmware 0.18.0): a fifth row fits the glass, and a page need not be full since every grid has eight
  # pages. Before, 5 x 4, and 4 x 5 standing up. A layout saved on those moves on to five rows by itself: every tile
  # keeps its page, its row and its column (page_layout.grown in the app).
  GRID_COLS: "5"
  GRID_ROWS: "5"
  # Standing up (firmware 0.2.92+) the page keeps the same five by five, the default, so it holds the same 25 cells
  # either way. The 10.1-inch glass is 136 x 218 mm standing up, columns of about 27 mm: a long name ends in dots
  # sooner than lying down.
  LVGL_BUFFER_SIZE: "50%"                       # LVGL's draw buffer as a share of the screen

# ============================================================
# No need to edit below this line.
# ============================================================

esphome:
  # This board asks for more ESPHome than the packages' own min_version (2026.6.2, packages/core.yaml): its display
  # model, `JC8012P4A1-V2` below, arrived in 2026.8.0. A board file's min_version wins over the core's, so the CYD,
  # the Guition and the Waveshare keep building on an older ESPHome; only a 10.1-inch screen asks for 2026.8 or newer.
  # docs/RELEASING.md says why the packages stay behind the add-on's ESPHome.
  min_version: 2026.8.0

# ESPHome's own mipi_dsi platform knows the newer LCD by name (2026.8.0+): `model: JC8012P4A1-V2` brings the JD9365's
# init sequence for it, its timings and its reset pin, as on the V3. Its init sequence is the one the community
# configuration for this build runs. On this pre-v3 chip ESPHome's own driver starts the display as on the first
# build; the V3's copy (mipi_dsi_v3) is only for rev3 silicon. The panel is 800x1280; LVGL turns it a quarter
# (LVGL_ROTATION).
display:
  - platform: mipi_dsi
    id: my_display
    model: JC8012P4A1-V2
    dimensions: {width: 800, height: 1280}
    lanes: 2
    update_interval: never
    auto_clear_enabled: false

# ESP Screens - Guition JC1060P470 "V2" board, EXPERIMENTAL: the 7-inch JC1060P470 as Guition ships it since
# mid-2026, with a different LCD behind the same JD9165 driver. The label on the back of the case says "V2" after the
# material number. Everything but the LCD is the JC1060P470's (packages/hardware/guition-jc1060p470.yaml), so this
# file differs from guition-jc1060p470.yaml only in its display and in the clock of the Wi-Fi link.
#
# With the JC1060P470's own panel settings a V2 shows a white screen with a vertical band of noise, which is how
# someone finds out which of the two they have. docs/JC1060P470.md has what to check on the glass.
#
# docs/PROFILES.md says how the files of a screen fit together. Two entry files include this one:
# checkout/jc1060p470v2.yaml (a build on this computer) and packages/jc1060p470v2.yaml (the package a screen builds from
# over GitHub).
packages:
  # The board apart from its LCD: the ESP32-P4 and its ESP32-C6 (shared with the 10.1-inch) and the GT911, shared
  # with the first JC1060P470.
  hardware: !include ../hardware/guition-jc1060p470.yaml
  # The cards of this board's grid, one per cell (tools/generate_cells.py writes them; docs/RESPONSIVE.md).
  cells: !include ../cells/16.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "jc1060p470v2"
  DEVICE_NAME: "jc1060p470v2-new"
  DEVICE_FRIENDLY_NAME: "My Guition 7 V2"

  # The glass: the panel's own pixels, which the display block below always drives, and its density: 1187 diagonal
  # pixels over 7 inches. The look scales its sizes by the exact density, the firmware by the nearest whole number.
  PANEL_W: "1024"
  PANEL_H: "600"
  DISPLAY_DPI: "169.548"
  # The tile grid: columns and rows of cells. The shared tree places every cell from these
  # (runtime_tiles::place_page), so a board with more room states more columns or rows.
  GRID_COLS: "4"
  GRID_ROWS: "4"
  # The cells of a page when this screen stands up: two columns of seven keep the standard tile size.
  GRID_COLS_PORTRAIT: "2"
  GRID_ROWS_PORTRAIT: "7"
  # LVGL's draw buffer as a share of the screen. A quarter of 1024x600 is 300 KB, most of what the chip keeps free
  # inside it, so the buffer goes to PSRAM at once, as on the 10.1-inch (docs/ADDING_A_BOARD.md).
  LVGL_BUFFER_SIZE: "50%"
  # The Wi-Fi link at 10 MHz: at 20 MHz the C6's SDIO clock puts a band of vertical streaks into the picture of this
  # panel, reported and measured by people with a V2 (ESPHome pull request 18695 and the configurations around it).
  HOSTED_SDIO_FREQUENCY: "10MHz"

# ============================================================
# No need to edit below this line.
# ============================================================

# ESPHome has no model for this panel yet (pull request 18695 adds `JC1060P470-V2`), so it is described in full:
# the timings and the init table of Guition's own driver for the new panel (JC1060P470C_I_W_Y.zip, 2026-07-13,
# esp_lcd_jd9165), as that pull request carries them. ESPHome adds the pixel format, the orientation and the
# display-on commands itself.
display:
  - platform: mipi_dsi
    id: my_display
    model: CUSTOM
    update_interval: never
    auto_clear_enabled: false
    # The panel's LCD_RST (GPIO0 on the schematic), a hardware reset as on the first panel: the pull request found
    # this panel blanks on GPIO0, and its table wants the wait below after it.
    reset_pin: GPIO0
    color_order: RGB
    dimensions: {width: 1024, height: 600}
    lanes: 2
    lane_bit_rate: 750Mbps
    pclk_frequency: 52MHz
    hsync_pulse_width: 24
    hsync_back_porch: 136
    hsync_front_porch: 160
    vsync_pulse_width: 2
    vsync_back_porch: 21
    vsync_front_porch: 12
    init_sequence:
      # The JD9165 takes the table only 120 ms after a reset. ESPHome waits that long before its own sleep-out,
      # not before the table, and without this wait the panel comes up white after a restart with the power on.
      - delay 120ms
      - [0x30, 0x00]
      - [0xF7, 0x49, 0x61, 0x02, 0x00]
      - [0x30, 0x01]
      - [0x04, 0x0C]
      - [0x05, 0x08]
      - [0x0B, 0x11]
      - [0x20, 0x04]
      - [0x1F, 0x05]
      - [0x23, 0x38]
      - [0x28, 0x18]
      - [0x29, 0x29]
      - [0x2A, 0x01]
      - [0x2B, 0x29]
      - [0x2C, 0x01]
      - [0x30, 0x02]
      - [0x00, 0x05]
      - [0x01, 0x22]
      - [0x02, 0x08]
      - [0x03, 0x12]
      - [0x04, 0x16]
      - [0x05, 0x64]
      - [0x06, 0x00]
      - [0x07, 0x00]
      - [0x08, 0x78]
      - [0x09, 0x00]
      - [0x0A, 0x04]
      - [0x0B, 0x16, 0x17, 0x0B, 0x0D, 0x0D, 0x0D, 0x11, 0x10, 0x07, 0x07, 0x09]
      - [0x0C, 0x09, 0x1E, 0x1E, 0x1C, 0x1C, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D]
      - [0x0D, 0x0A, 0x05, 0x0B, 0x0D, 0x0D, 0x0D, 0x11, 0x10, 0x06, 0x06, 0x08]
      - [0x0E, 0x08, 0x1F, 0x1F, 0x1D, 0x1D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D]
      - [0x0F, 0x0A, 0x05, 0x0D, 0x0B, 0x0D, 0x0D, 0x11, 0x10, 0x1D, 0x1D, 0x1F]
      - [0x10, 0x1F, 0x08, 0x08, 0x06, 0x06, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D]
      - [0x11, 0x16, 0x17, 0x0D, 0x0B, 0x0D, 0x0D, 0x11, 0x10, 0x1C, 0x1C, 0x1E]
      - [0x12, 0x1E, 0x09, 0x09, 0x07, 0x07, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D]
      - [0x13, 0x00, 0x00, 0x00, 0x00]
      - [0x14, 0x00, 0x00, 0x41, 0x41]
      - [0x15, 0x00, 0x00, 0x00, 0x00]
      - [0x17, 0x00]
      - [0x18, 0x85]
      - [0x19, 0x06, 0x09]
      - [0x1A, 0x05, 0x08]
      - [0x1B, 0x0A, 0x04]
      - [0x26, 0x00]
      - [0x27, 0x00]
      - [0x30, 0x06]
      - [0x12, 0x3F, 0x25, 0x27, 0x35, 0x1D, 0x1B, 0x1B, 0x1A, 0x18, 0x0A, 0x2A, 0x21, 0x19, 0x30]
      - [0x13, 0x3F, 0x26, 0x27, 0x35, 0x1E, 0x1C, 0x1C, 0x1A, 0x18, 0x0B, 0x2A, 0x21, 0x19, 0x30]
      - [0x30, 0x0A]
      - [0x02, 0x4F]
      - [0x0B, 0x40]
      - [0x30, 0x0D]
      - [0x0D, 0x04]
      - [0x10, 0x05]
      - [0x11, 0x0C]
      - [0x12, 0x05]
      - [0x13, 0x0C]
      - [0x30, 0x00]
      # Guition's driver waits 120 ms between sleep-out and display-on; ESPHome's own sleep-out follows with about
      # 10 ms. A sleep-out here and the wait after it keep the vendor's margin; the second one is a no-op.
      - [0x11]
      - delay 120ms

# ESP Screens - waveshare2: the Waveshare ESP32-S3-Touch-LCD-2, EXPERIMENTAL. A 2.0-inch 240 x 320 IPS panel
# (ST7789T3 over SPI, ESPHome's mipi_spi) with CST816D capacitive touch over I2C, on an ESP32-S3R8 with 8 MB of
# octal PSRAM and 16 MB flash. Pins from Waveshare's schematic (ESP32-S3-Touch-LCD-2-SchDoc.pdf). Display, touch and
# backlight confirmed on one owner's unit; the camera connector, the TF slot and the QMI8658 IMU stay unused.
# docs/PROFILES.md says how the files of a screen fit together.
packages:
  build: !include ../hardware/esp-idf.yaml
  look: !include ../looks/compact.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  self_test: !include ../features/self-test.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "waveshare2"
  DEVICE_NAME: "waveshare2-new"
  DEVICE_FRIENDLY_NAME: "My Waveshare 2"

  # The glass: the panel's own pixels and its density, 400 diagonal pixels over 2.0 inches.
  PANEL_W: "240"
  PANEL_H: "320"
  DISPLAY_DPI: "200.000"
  # The LVGL angle that lays this panel out lying down (320 x 240). Standing up is a quarter further.
  ROTATION_LANDSCAPE: "90"
  # The tile grid: columns and rows of cells lying down, and standing up.
  GRID_COLS: "2"
  GRID_ROWS: "2"
  LVGL_BUFFER_SIZE: "12%"                       # LVGL's draw buffer as a share of the screen

  # More tiles and pages than the 64 and eight of a board without PSRAM (firmware 0.34.0+): the tile list, the cards and the
  # extras live in PSRAM here, and the memory budget (tile_memory.h) says how many of them a layout really takes.
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"                   # a wider top bar where the glass has the width for it
  BACKLIGHT_FREQUENCY: "20000Hz"                # the backlight's PWM through an SS8050 transistor (see the output block)

# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz

# The 8 MB of PSRAM in the ESP32-S3R8.
psram:
  mode: octal
  speed: 80MHz

# One SPI bus, shared on the board with the TF slot (its CS is GPIO41, left unused).
spi:
  id: lcd
  clk_pin: GPIO39
  mosi_pin: GPIO38
  miso_pin: GPIO40   # the TF slot's line; the write-only display doesn't read it

# The touch panel's bus, which also carries the QMI8658 IMU (unused).
i2c:
  id: touch_bus
  sda: GPIO48
  scl: GPIO47
  scan: true

output:
  - platform: ledc
    pin: GPIO1
    id: gpio_backlight_pwm
    frequency: ${BACKLIGHT_FREQUENCY}

# The CST816D sleeps between touches and wakes on its interrupt line, so the panel is read on that line, not polled.
# Its reset line is not on a GPIO of its own.
touchscreen:
  - platform: cst816
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    interrupt_pin: GPIO46

# ST7789T3, driven as ESPHome's ST7789V. The panel's reset is GPIO0, the BOOT strapping pin, so the driver does not
# toggle it; the panel starts from its power-on reset.
display:
  - platform: mipi_spi
    id: my_display
    model: ST7789V
    spi_id: lcd
    dimensions: {width: 240, height: 320}
    color_order: rgb      # confirmed on real hardware
    invert_colors: true   # confirmed on real hardware: an IPS ST7789 shows complements without it
    dc_pin: GPIO42
    cs_pin: GPIO45        # a strapping pin; harmless as the panel's CS, confirmed on real hardware
    spi_mode: 0
    data_rate: 40MHz      # conservative; raise once the board is confirmed stable
    update_interval: never
    auto_clear_enabled: false

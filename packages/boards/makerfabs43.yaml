# ESP Screens - Makerfabs E32S3RGB43 V3.1: a 4.3-inch 800 x 480 RGB panel with GT911 capacitive touch,
# an ESP32-S3 with 16 MB flash and 8 MB octal PSRAM.
#
# The RGB pins, 16 MHz pixel clock and panel timings below were verified on V3.1 hardware on 2026-10-29/30. The
# GT911 answers at 0x5D on GPIO17/18; GPIO38 is its reset line and the board does not use a separate interrupt line.
# The stock V3.1 backlight is wired always on. Makerfabs documents an R59 hardware modification that exposes the
# backlight transistor on GPIO44; docs/MAKERFABS43.md shows the optional Tessera Override YAML for that modification.
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together and docs/ADDING_A_BOARD.md how a
# board like this one is added.
packages:
  hardware: !include ../hardware/esp32s3-rgb.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  backlight_always_on: !include ../features/backlight-always-on.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml

substitutions:
  BOARD_ID: "makerfabs43"
  DEVICE_NAME: "makerfabs43-new"
  DEVICE_FRIENDLY_NAME: "My Makerfabs"

  PANEL_W: "800"
  PANEL_H: "480"
  DISPLAY_DPI: "216.966"
  GRID_COLS: "3"
  GRID_ROWS: "3"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "4"
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"
  LVGL_BUFFER_SIZE: "12%"

  # Stock V3.1 has no software backlight control; the optional R59 mod in docs/MAKERFABS43.md changes this per screen.
  BACKLIGHT_DIMMABLE: "false"

  GRID_GAP_Y: "13"

# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  flash_size: 16MB

logger:
  tx_buffer_size: 2048
  hardware_uart: USB_SERIAL_JTAG

i2c:
  id: touch_bus
  sda: GPIO17
  scl: GPIO18
  frequency: 400kHz
  scan: true

# The stock board keeps the backlight on. This no-op output preserves the common backlight contract; the optional
# hardware mod replaces it with LEDC PWM on GPIO44 in the screen's Override YAML.
output:
  - platform: template
    id: gpio_backlight_pwm
    type: float
    write_action:
      - lambda: '(void)0;'

touchscreen:
  - platform: gt911
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    reset_pin:
      number: GPIO38
      mode:
        output: true
    update_interval: 20ms

display:
  - platform: mipi_rgb
    model: RPI
    id: my_display
    dimensions:
      width: ${PANEL_W}
      height: ${PANEL_H}
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    pclk_frequency: 16MHz
    pclk_inverted: true
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 88
    vsync_front_porch: 13
    vsync_pulse_width: 3
    vsync_back_porch: 32
    data_pins:
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false

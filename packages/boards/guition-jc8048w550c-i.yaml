# ESP Screens - Guition JC8048W550C_I: 5-inch ST7262 RGB panel, 800 x 480, with GT911 capacitive touch.
# The manufacturer's JC8048W550N_I has no touch and JC8048W550R_I has resistive touch; this file is only for C_I.
# ESP32-S3-WROOM-1 N16R8, 16 MB flash and 8 MB octal PSRAM (JC8048W550 specification and Arduino demo).
# RGB bus mapping follows https://github.com/baget/JC8048W550-ESPHome; picture and touch tested on JC8048W550.
# The companion entry files are packages/jc8048w550ci.yaml and checkout/jc8048w550ci.yaml.
packages:
  hardware: !include ../hardware/esp32s3-rgb.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml

substitutions:
  BOARD_ID: "jc8048w550ci"
  DEVICE_NAME: "jc8048w550ci-new"
  DEVICE_FRIENDLY_NAME: "My Guition 5"

  PANEL_W: "800"
  PANEL_H: "480"
  DISPLAY_DPI: "186.590"                      # 933 diagonal pixels over 5 inches
  # The grid a screen starts with, lying down and standing up; the owner picks another in the editor within what the
  # glass holds (docs/RESPONSIVE.md, "The grid a screen is given").
  GRID_COLS: "3"
  GRID_ROWS: "3"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "5"
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"
  LVGL_BUFFER_SIZE: "12%"                     # one-eighth draw buffer, as on other 800 x 480 S3 boards

# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  flash_size: 16MB

logger:
  tx_buffer_size: 2048
  hardware_uart: UART0

i2c:
  id: touch_bus
  sda: GPIO19
  scl: GPIO20
  scan: true

light:
  # The default gamma (2.8) makes 20% nearly dark; linear gamma (1.0) is too bright.
  - id: !extend back_light
    gamma_correct: 2.0

output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO2
    # This board's backlight driver loses most brightness at high PWM frequency.
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

touchscreen:
  - platform: gt911
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    reset_pin: GPIO38
    update_interval: 20ms
    calibration:
      x_min: 0
      x_max: ${PANEL_W}
      y_min: 0
      y_max: ${PANEL_H}

# The ST7262 is driven directly as an RGB panel; no SPI init sequence. The JC8048W550 is the reference design of the
# Sunton ESP32-8048S050, and ESPHome's preset for that board drives it: its pins, the 16 MHz clock on the inverted edge,
# the 4/8/8 porches, and the colour bits in RGB order, big-endian. A pin map of our own with BGR and little-endian bytes
# gave neutral greys but turned saturated colours (Home Assistant's red, a lamp's amber) blue.
display:
  - platform: mipi_rgb
    model: ESP32-8048S050
    id: my_display
    dimensions:
      width: ${PANEL_W}
      height: ${PANEL_H}
    update_interval: never
    auto_clear_enabled: false

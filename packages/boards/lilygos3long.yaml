# LilyGO T-Display-S3-Long: 3.4-inch 180 x 640 AXS15231B QSPI panel,
# CST3530 capacitive touch, SY6970 battery PMU, ESP32-S3, 16 MB flash
# and 8 MB octal PSRAM.
# Hardware and panel workarounds follow LilyGO's ESPHome_LVGL_HelloWorld example.
# See docs/LILYGO_S3_LONG.md for sources and the hardware acceptance checklist.
packages:
  build: !include ../hardware/esp-idf.yaml
  cells: !include ../cells/4.yaml
  look: !include ../looks/compact.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml

substitutions:
  BOARD_ID: "lilygos3long"
  SCREEN_FIRMWARE_VERSION: "0.11.1"
  DEVICE_NAME: "lilygos3long-new"
  DEVICE_FRIENDLY_NAME: "My LilyGO Long"
  PANEL_W: "180"
  PANEL_H: "640"
  DISPLAY_DPI: "195.538"
  ROTATION_LANDSCAPE: "90"
  GRID_COLS: "4"
  GRID_ROWS: "1"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "4"
  # Full refresh must have a complete frame, per LilyGO's example.
  LVGL_BUFFER_SIZE: "100%"
  BACKLIGHT_FREQUENCY: "1000Hz"
  # Move the compact header up and start the grid sooner on 180-pixel glass.
  # This gives the single row of four buttons 13 more pixels of height.
  HEADER_Y: "8"
  SCROLL_Y: "42"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz

psram:
  mode: octal
  speed: 80MHz

spi:
  id: lcd
  type: quad
  clk_pin: GPIO17
  data_pins: [GPIO13, GPIO18, GPIO21, GPIO14]

i2c:
  id: touch_bus
  sda: GPIO15
  scl: GPIO10

output:
  - platform: ledc
    pin: GPIO1
    id: gpio_backlight_pwm
    frequency: ${BACKLIGHT_FREQUENCY}

# The CST3530 touch interface is read using LilyGO's ESPHome example's
# axs15231 I2C platform. This is the ESPHome driver name, not the touch IC.
# Touch reports 640 x 180 raw coordinates; LVGL applies rotation afterwards.
# The CST3530's separate reset and interrupt are GPIO2 and GPIO11; polling
# needs neither. GPIO16 resets the AXS15231B display only.
touchscreen:
  - platform: axs15231
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    update_interval: 20ms
    transform:
      mirror_x: true
      mirror_y: true
      swap_xy: false
    calibration:
      x_min: 10
      x_max: 627
      y_min: 6
      y_max: 176

display:
  - platform: mipi_spi
    id: my_display
    model: AXS15231
    spi_id: lcd
    dimensions:
      width: 180
      height: 640
    cs_pin: GPIO12
    reset_pin: GPIO16
    data_rate: 10MHz
    # ESPHome takes the maximum of display and LVGL rounding. Override both.
    draw_rounding: 4
    update_interval: never
    auto_clear_enabled: false

# The controller cannot rotate in hardware. The shared core sets LVGL rotation.
# Avoid partial address windows and rounding 180 pixels up to a multiple of 8.
lvgl:
  full_refresh: true
  draw_rounding: 4

# The SY6970 charger is present at I2C address 0x6A on touch_bus. Its ESPHome
# component writes charge limits and charge enable on setup; enabling it here
# without validated battery settings would change the board's charging policy.
# See docs/LILYGO_S3_LONG.md before adding PMU controls.

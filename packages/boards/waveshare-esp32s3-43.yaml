# ESP Screens - Waveshare ESP32-S3-Touch-LCD-4.3 board: a 4.3-inch 800 x 480 IPS panel with GT911 capacitive
# touch, an ESP32-S3 with 16 MB flash and 8 MB of octal PSRAM, and a CH422G expander that carries the panel's
# reset and the line that lights it.
#
# The panel is one of ESPHome's own models (mipi_rgb, ESP32-S3-TOUCH-LCD-4.3), so its pins, its timings and its
# init sequence come from ESPHome and not from a table here. The backlight is the CH422G line that model would
# use as the display's enable pin: this board switches the panel with it, so the firmware owns it instead, and it
# never goes dark (features/backlight-always-on.yaml).
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together, docs/ADDING_A_BOARD.md how a board
# like this one is added. Two entry files include this one: checkout/waveshare43.yaml (a build on this computer)
# and packages/waveshare43.yaml (the package a screen builds from over GitHub).
packages:
  # The chip, the CH422G expander, the GT911 and the backlight line this board shares with the other Waveshare.
  hardware: !include ../hardware/waveshare-ch422g.yaml
  # The cards of this board's grid, one per cell (tools/generate_cells.py writes them; docs/RESPONSIVE.md).
  cells: !include ../cells/9.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  backlight_always_on: !include ../features/backlight-always-on.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "waveshare43"
  DEVICE_NAME: "waveshare-new"
  DEVICE_FRIENDLY_NAME: "My Waveshare"

  # The glass: the panel's own pixels, which the display block below always drives, and its density.
  PANEL_W: "800"
  PANEL_H: "480"
  DISPLAY_DPI: "217"
  # The tile grid: columns and rows of cells. The shared tree places every cell from these
  # (runtime_tiles::place_page), so a board with more room states more columns or rows.
  GRID_COLS: "3"
  GRID_ROWS: "3"
  # The cells of a page when this screen stands up (firmware 0.2.92+).
  # The 4.3-inch glass is 56 x 94 mm standing up. Two columns would be 26 mm wide, under the 30 mm a
  # card needs, so it is one column of four cards of 51 x 17 mm.
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "4"
  LVGL_BUFFER_SIZE: "12%"                       # LVGL's draw buffer as a share of the screen

  # Set by hand for the three rows of this glass (the review of app 0.2.94); the look has 12
  GRID_GAP_Y: "13"



# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  flash_size: 16MB

display:
  # The timings are Waveshare's own (ESP32_Display_Panel, BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_4_3.h), not the
  # model's. The ST7262 in this panel wants 808 to 896 pixel clocks per line and 488 to 504 lines per frame
  # (datasheet 7.3.4: front and back porch 4 to 48, pulse 2 to 8); ESPHome's model sends 1070 per line (front
  # porch 210, pulse 30, back porch 30), which puts the line rate at 15 kHz, right where the panel lets go. On
  # 2026-09-20 the screen worked for a while, then stood half a centimetre to the right, then showed only
  # white or a loop of flat colours (white, red, blue, green) while the firmware ran on, until any reset or
  # power cycle happened to lock it again. With 820 clocks per line and 500 lines per frame at 16 MHz (39 Hz,
  # 19.5 kHz) it stays locked, through standby and back.
  - id: !extend my_display
    model: ESP32-S3-TOUCH-LCD-4.3
    hsync_pulse_width: 4
    hsync_back_porch: 8
    hsync_front_porch: 8
    vsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8

# ESP Screens - Guition JC8012P4A1 "V3" board, EXPERIMENTAL: the 10.1-inch JC8012P4A1 as Guition ships it now, with
# rev3 ESP32-P4 silicon and a newer LCD behind the same JD9365 driver. 1280x800 MIPI-DSI + GSL3680 capacitive touch,
# on an ESP32-P4 with an ESP32-C6 for Wi-Fi.
#
# 1280x800 at 149 dpi, the standard look, a grid of 5 x 5 cells. The panel itself is
# 800x1280 (portrait); LVGL turns the picture and the touch a quarter, as it does on the CYD.
# Everything but the chip revision and the LCD is the first JC8012P4A1's (packages/hardware/guition-jc8012p4a1.yaml), so
# this file differs from guition-jc8012p4a1.yaml only there. The first build's firmware restarts a V3 straight after
# its bootloader, over and over (CHIP_LP_WDT_RESET, GitHub issue #52), which is how someone finds out which of the two
# they have. docs/JC8012P4A1.md has what to check on the glass. On rev3 silicon ESPHome's own display driver aborts
# while the display starts; the display below says why this board has its own copy of it for now.
# The speaker and the microphone are the Guition P4 panels' audio (hardware/guition-p4-audio.yaml), experimental:
# @Eugen417 runs the same wiring, both ways at once, on a V3 with a build of his own (pull request #259).
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together, docs/ADDING_A_BOARD.md how a board
# is added. Two entry files include this one: checkout/jc8012p4a1v3.yaml (a build on this computer) and
# packages/jc8012p4a1v3.yaml (the package a screen builds from over GitHub).
packages:
  # The board apart from its chip revision and its LCD: the ESP32-P4 and its ESP32-C6 (shared with the 7-inch) and
  # the GSL3680, the same as on the first build.
  hardware: !include ../hardware/guition-jc8012p4a1.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml
  # The ES8311, its speaker and its microphone, on the pins of the 10.1-inch circuit board below.
  audio: !include ../hardware/guition-p4-audio.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "jc8012p4a1v3"
  DEVICE_NAME: "jc8012p4a1v3-new"
  DEVICE_FRIENDLY_NAME: "My Guition 10 V3"

  # The glass: the panel's own pixels, which the display block below always drives; LVGL turns the picture and the
  # touch together, so nothing else on this board knows which way the glass hangs. 1509 diagonal pixels over
  # 10.1 inches: the look scales its sizes by the exact density, the firmware by the nearest whole number.
  PANEL_W: "800"
  PANEL_H: "1280"
  DISPLAY_DPI: "149.44920605238187"
  # The LVGL angle that lays this panel out lying down (1280 x 800). Standing up is a quarter further.
  ROTATION_LANDSCAPE: "90"
  # The V3's touch driver (components/gsl3680_v3) reports the panel's own pixels with x running the other way (the
  # axes are not swapped, the default); LVGL then turns picture and touch together (LVGL_ROTATION), as it does on the
  # CYD.
  TOUCH_MIRROR_X: "true"
  # The tile grid: columns and rows of cells. The shared tree places every cell from these
  # (runtime_tiles::place_page), so a board with more room states more columns or rows.
  # Five rows by default, with six, seven or eight available when the screen is built (boards.yaml `choices`). Each
  # extra row fits more tiles on a page; the default keeps the tiles larger and easier to read.
  GRID_COLS: "5"
  GRID_ROWS: "5"
  # More tiles and pages than the 64 and eight of a board without PSRAM (firmware 0.34.0+): an ESP32-P4 has the PSRAM and
  # the memory inside the chip for them, and the memory budget (tile_memory.h) says how many a layout really takes.
  SCREEN_MAX_TILES: "256"
  SCREEN_MAX_PAGES: "16"
  SCREEN_MAX_BAR_ITEMS: "12"                   # a wider top bar where the glass has the width for it
  # Standing up (firmware 0.2.92+) the page keeps the same five by five, the default, so it holds the same 25 cells
  # either way. The 10.1-inch glass is 136 x 218 mm standing up, columns of about 27 mm: a long name ends in dots
  # sooner than lying down.
  LVGL_BUFFER_SIZE: "50%"                       # LVGL's draw buffer as a share of the screen
  # The audio on the 10.1-inch circuit board (hardware/guition-p4-audio.yaml): the microphone's data and the
  # amplifier's enable.
  AUDIO_DIN_PIN: GPIO11
  AUDIO_AMPLIFIER_PIN: GPIO20
  # The camera's sensor (the feature camera_sensor, docs/PLUGINS.md): the OmniVision OV02C10 on the MIPI-CSI port of
  # the boards that carry one (the "C" in Guition's model name). It answers on the touch bus at 0x36, clocks itself
  # and has no reset or power-down pin; a camera plugin drives it (screen_camera), tried on this board in Home Assistant.
  CAMERA_I2C: touch_bus
  CAMERA_XCLK_PIN: "-1"                        # the sensor has its own clock

# ============================================================
# No need to edit below this line.
# ============================================================

esphome:
  # This board asks for more ESPHome than the packages' own min_version (2026.6.2, packages/core.yaml): its display
  # model, `JC8012P4A1-V2` below, arrived in 2026.8.0, and its audio (the speaker_source media player, the resamplers)
  # is built and tried on 2026.9.0, as on the other boards with a speaker. A board file's min_version wins over the
  # core's, so the CYD, the Guition and the Waveshare keep building on an older ESPHome. docs/RELEASING.md says why the
  # packages stay behind the add-on's ESPHome.
  min_version: 2026.9.0

# Rev3 silicon: the boot ROM of this board reports "esp32p4-eco7". The first build's chips are pre-v3, which
# packages/hardware/guition-esp32p4.yaml builds for; ESP-IDF lays out memory differently for the two and a pre-v3
# firmware restarts a rev3 chip straight after its bootloader (CHIP_LP_WDT_RESET, GitHub issue #52). This board file's
# value wins over that file's. The CPU stays at 360 MHz, as the community configurations for this board run it.
esp32:
  engineering_sample: false

# ESPHome's own mipi_dsi platform knows the newer LCD by name (2026.8.0+): `model: JC8012P4A1-V2` brings the JD9365's
# init sequence for it, its timings and its reset pin. ESPHome's "V2" is the LCD, not Guition's board label; the
# community configurations for V3 boards run this LCD's table. The panel is 800x1280; LVGL turns it a quarter
# (LVGL_ROTATION).
# The platform is mipi_dsi_v3, a copy of ESPHome 2026.9.0's mipi_dsi in components/ that lets ESP-IDF pick the DSI
# clock. Upstream's fixed clock aborts on rev3 silicon while the display starts, so the screen restarts until safe mode
# (GitHub #52). ESPHome fixes this in 2026.9.1 (esphome/esphome#18984); then this goes back to `platform: mipi_dsi`
# and the copy goes away (components/mipi_dsi_v3/README.md).
display:
  - platform: mipi_dsi_v3
    id: my_display
    model: JC8012P4A1-V2
    dimensions: {width: 800, height: 1280}
    lanes: 2
    update_interval: never
    auto_clear_enabled: false

############################################################
# ESP Screens - Hosyond (lcdwiki) ES3C28P, the 2.8-inch ESP32-S3 IPS display, also sold under other names (diymore:
# "ESP32-S3 WiFi Development Board Bluetooth Smart Display TFT Module Touchscreen, supports Xiaozhi, Type-C").
# ILI9341V 240x320 IPS panel over SPI, FT6336G capacitive touch over I2C, an ESP32-S3 N16R8 (16 MB flash, 8 MB octal
# PSRAM), an ES8311 codec with a speaker behind an FM8002E amplifier and a MEMS microphone, and a WS2812 RGB LED. Also on
# the board, not configured here: a microSD slot on SDIO (GPIO38 clock, GPIO40 command, GPIO39/41/48/47 data) and a
# battery charger (its ADC on GPIO9 read 0 V on the board tried).
#
# The pins come from the board's own pin table (lcdwiki.com, "2.8inch ESP32-S3 Display", "ESP32 Pin Parameters") and
# from an ESPHome configuration that ran on a real board (2026-11-21), which also found:
# - the IPS panel needs both invert_colors and color_order bgr (checked with red, green and blue test bars);
# - the FT6336's reset pin (GPIO18) stays untouched: ESPHome reads the chip's ID right after the reset pulse, before
#   the chip is ready, and the touch never starts;
# - the I2C bus runs at 100 kHz: at 400 kHz the touch reported random coordinates;
# - the speaker plays through the ES8311 at 0x18 on the touch panel's bus, with the amplifier on while GPIO1 is low.
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together, docs/ES3C28P.md what was tried on the
# glass. Two entry files include this one: checkout/es3c28p.yaml (a build on this computer) and packages/es3c28p.yaml
# (the package a screen builds from over GitHub).
############################################################
packages:
  # How every board's firmware is built (ESP-IDF, as ESPHome recommends it).
  build: !include ../hardware/esp-idf.yaml
  # The compact look: this glass has the CYD's size and pixels, where that look was drawn.
  look: !include ../looks/compact.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  self_test: !include ../features/self-test.yaml
  # The ES8311 as the whole of the board's sound: its DAC drives the speaker, its ADC reads the microphone
  # (parts/es8311-voice.yaml); the amplifier follows the sound (parts/amplifier.yaml).
  voice: !include ../hardware/parts/es8311-voice.yaml
  amplifier: !include ../hardware/parts/amplifier.yaml
  # The WS2812 on the front, as a light called LED (parts/ws2812.yaml).
  led: !include ../hardware/parts/ws2812.yaml
  # The BOOT key, GPIO0, as the standby key: a press puts the screen in standby or wakes it.
  standby_key: !include ../features/standby-key.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "es3c28p"
  DEVICE_NAME: "es3c28p-new"
  DEVICE_FRIENDLY_NAME: "My Hosyond 2.8"
  STANDBY_KEY_PIN: GPIO0                        # the standby key (features/standby-key.yaml)

  # The glass: the panel's own pixels, which the display block below always drives; LVGL turns the picture and the
  # touch together. 400 diagonal pixels over 2.8 inches is the CYD's 143 dpi, the compact look's reference.
  PANEL_W: "240"
  PANEL_H: "320"
  DISPLAY_DPI: "143"
  # The LVGL angle that lays this panel out lying down (320 x 240). Standing up is a quarter further.
  ROTATION_LANDSCAPE: "90"
  # The CYD's grids: the same glass.
  GRID_COLS: "2"
  GRID_ROWS: "3"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "4"
  # More tiles and pages than a board without PSRAM: the tile list, the cards and the extras live in PSRAM here, as
  # on the Waveshare 3.5 (the same chip and memory).
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"                   # and a top bar of twelve items, as every board with PSRAM
  LVGL_BUFFER_SIZE: "12%"                       # LVGL's draw buffer as a share of the screen

  # The sound (parts/es8311-voice.yaml): the codec at 0x18 on the touch panel's bus, its one I2S bus, the speaker's data
  # (the codec's DSDIN) and the microphone's (its ASDOUT), as the board's pin table names them. ESPHome's own I2S both
  # ways at once: echo cancelling has not been tried on an ESP32-S3 with an SPI panel.
  AUDIO_I2C: touch_bus
  AUDIO_MCLK_PIN: GPIO4
  AUDIO_BCLK_PIN: GPIO5
  AUDIO_LRCLK_PIN: GPIO7
  AUDIO_DOUT_PIN: GPIO8
  AUDIO_DIN_PIN: GPIO6
  AUDIO_TRANSPORT: "i2s"
  # The FM8002E's enable: on while the line is low (the pin table's "low level enable").
  AUDIO_AMPLIFIER_PIN: {number: GPIO1, inverted: true}
  LED_PIN: GPIO42                               # the WS2812 (parts/ws2812.yaml)

  # Hardware a screen's own YAML may change (docs/EASY_SETUP.md, "Hardware-specific YAML overrides").
  DISPLAY_DATA_RATE: "40MHz"                    # what the ESPHome configuration ran at
  BACKLIGHT_FREQUENCY: "1000Hz"                 # ESPHome's ledc default, as on the CYD (GitHub #42)

# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz

# The 8 MB of PSRAM in the N16R8 module.
psram:
  mode: octal
  speed: 80MHz

# One SPI bus for the display; the microSD slot is on SDIO pins of its own.
spi:
  id: lcd
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

# The touch controller (FT6336G, 0x38) and the ES8311 codec (0x18) share this bus. 100 kHz: see the header.
i2c:
  id: touch_bus
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 100kHz

output:
  # The backlight, lit at a high level.
  - platform: ledc
    pin: GPIO45
    id: gpio_backlight_pwm
    frequency: ${BACKLIGHT_FREQUENCY}

# FT6336G. No reset_pin (GPIO18): see the header. Read at 50 Hz like the other boards, and at once when its interrupt
# line (GPIO17) says a finger came down, as in the configuration that ran on the board.
touchscreen:
  - platform: ft63x6
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    interrupt_pin: GPIO17
    update_interval: 20ms

display:
  - platform: mipi_spi
    id: my_display
    spi_id: lcd
    model: ILI9341
    data_rate: ${DISPLAY_DATA_RATE}
    cs_pin: GPIO10
    # A strapping pin on the ESP32-S3; ESPHome warns, harmless after the start (it ran this way on the board).
    dc_pin: GPIO46
    # The display's reset is tied to the chip's EN line: no reset_pin.
    invert_colors: true
    color_order: bgr
    update_interval: never
    auto_clear_enabled: false
    # Native panel dimensions (portrait); LVGL turns the picture (ROTATION_LANDSCAPE), never a display transform.
    dimensions:
      width: 240
      height: 320

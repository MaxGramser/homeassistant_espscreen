# ESP Screens - M5Stack Tab5: 5-inch 1280 x 720 panel, ESP32-P4 and ESP32-C6.
# The Tab5 is sold with an ST7121 (issue #79) or an ST7123 (issue #240) display and touch controller: DISPLAY_MODEL
# below, which New screen asks for (boards.yaml `choices`). docs/TAB5.md says how to tell them apart and records the
# evidence.
packages:
  hardware: !include ../hardware/m5stack-tab5.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml
  # The audio's parts, their wiring below (docs/PROFILES.md, "Parts").
  microphones: !include ../hardware/parts/es7210.yaml
  speaker: !include ../hardware/parts/es8388.yaml
  amplifier: !include ../hardware/parts/amplifier.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "tab5"
  DEVICE_NAME: "tab5-new"
  DEVICE_FRIENDLY_NAME: "My M5Stack Tab5"

  # The glass: the panel's own pixels and its density, 1469 diagonal pixels over 5.0 inches.
  PANEL_W: "720"
  PANEL_H: "1280"
  DISPLAY_DPI: "293.721"
  # The LVGL angle that lays this panel out lying down (1280 x 720). Standing up is a quarter further.
  ROTATION_LANDSCAPE: "90"
  # The tile grid: three columns by three rows lying down, or four rows when selected, and one column by five rows standing up.
  GRID_COLS: "3"
  GRID_ROWS: "3"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "5"
  # More tiles and pages than the 64 and eight of a board without PSRAM (firmware 0.34.0+), as on every ESP32-P4
  # (docs/TILE_MEMORY.md); the memory budget (tile_memory.h) says how many a layout really takes.
  SCREEN_MAX_TILES: "256"
  SCREEN_MAX_PAGES: "16"
  SCREEN_MAX_BAR_ITEMS: "12"                   # a wider top bar where the glass has the width for it (GitHub #247)
  LVGL_BUFFER_SIZE: "50%"                       # LVGL's draw buffer as a share of the screen
  # The display and touch controller, one chip: ST7121 or ST7123, ESPHome's display model M5STACK-TAB5-<this>. The touch
  # is ESPHome's st7123 platform for both.
  DISPLAY_MODEL: "ST7121"
  TOUCH_CONTROLLER: "ST7121/ST7123"
  TOUCH_TEST_READY_LOG: "ST7121 touch test ready; no tile actions"

  # The audio, as ESPHome's own Tab5 configuration and M5Stack's BSP wire it (docs/TAB5.md): an ES8388 for the speaker
  # and an ES7210 for the microphones, both on the system I2C bus, on one I2S bus (pins of M5Stack's BSP,
  # m5stack_tab5.h), both ways at once with echo cancellation by default. The voice is the ES7210's MIC2, as ESPHome's
  # Tab5 configuration and the Tab5 voice configurations that work read it; the schematic routes HPOUT_L through AEC_P to
  # its MIC3 directly (R41, 0 ohm, not Waveshare's attenuator), so the reference starts at unity, to be measured on a real
  # Tab5. The speaker hangs on the ES8388's LINE1 output (ESPHome's own Tab5 configuration turns it on by hand), its
  # amplifier on pin 1 of the first I/O expander (SPK_EN).
  AUDIO_I2C: tab5_bus
  AUDIO_MCLK_PIN: GPIO30
  AUDIO_BCLK_PIN: GPIO27
  AUDIO_LRCLK_PIN: GPIO29
  AUDIO_DOUT_PIN: GPIO26
  AUDIO_DIN_PIN: GPIO28
  AUDIO_MIC_INPUT: "2"
  AUDIO_MIC_DC_OFFSET: "true"
  AUDIO_REFERENCE_GAIN: "0dB"
  AUDIO_DAC_OUTPUT: LINE1
  AUDIO_AMPLIFIER_PIN: {pi4ioe5v6408: tab5_ioe, number: 1}
  # The speaker's buffer 500 ms instead of 100: an answer comes over the C6's Wi-Fi while Home Assistant still makes it,
  # and a buffer that runs dry plays silence, a gap in the voice.
  AUDIO_SPEAKER_BUFFER: "500ms"
  # The transport (parts/es7210.yaml): AUDIO_TRANSPORT in a screen's Override YAML. TAB5_AUDIO_TRANSPORT, its old name,
  # still works in firmware 0.58 and goes in the release after (tests/test_board_declarations.py, STILL_TO_MOVE).
  AUDIO_TRANSPORT: ${TAB5_AUDIO_TRANSPORT}
  TAB5_AUDIO_TRANSPORT: "aec"

  # The camera's sensor (the feature camera_sensor, docs/PLUGINS.md): the SC2356 on the MIPI-CSI port answers on the
  # system I2C bus, and takes its 24 MHz clock from GPIO36, as M5Stack's BSP drives it; the board takes it out of reset
  # (switch below). A camera plugin drives it (screen_camera).
  CAMERA_I2C: tab5_bus
  CAMERA_XCLK_PIN: "36"
  # The sensor sits upside down against the glass: lying down as built, Home Assistant showed its picture on its head
  # (a tester's report, 2026-10-25). The camera turns it upright (camera_turn.h).
  CAMERA_ORIENTATION: "180"

# ============================================================
# No need to edit below this line.
# ============================================================

esphome:
  # M5STACK-TAB5-ST7121 and the st7123 touch driver are available from ESPHome 2026.7.0; the screen's audio
  # (features/audio.yaml: the speaker_source media player, resamplers) is built and tried on 2026.9.0.
  min_version: 2026.9.0

# The factory firmware identifies this variant as ST7121. ESPHome currently exposes the compatible touch protocol
# through its st7123 platform; on this board the reset is driven by the I/O expander.
touchscreen:
  - platform: st7123
    id: ts_touch
    i2c_id: tab5_bus
    display: my_display
    update_interval: 100ms
    reset_pin:
      pi4ioe5v6408: tab5_ioe
      number: 5
    interrupt_pin: GPIO23
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280

# ESPHome's MIPI-DSI model selects the panel's sequence (DISPLAY_MODEL). The panel is 720x1280; LVGL turns it a quarter.
display:
  - platform: mipi_dsi
    id: my_display
    model: M5STACK-TAB5-${DISPLAY_MODEL}
    dimensions: {width: 720, height: 1280}
    lanes: 2
    reset_pin:
      pi4ioe5v6408: tab5_ioe
      number: 4
    update_interval: never
    auto_clear_enabled: false

switch:
  # The camera's reset (CAM_RST, pin 6 of the first I/O expander, active low), released at start as M5Stack's own
  # firmware and Espressif's Tab5 BSP do. ESPHome starts the expander with every pin loose, and a sensor whose reset
  # floats does not answer on its bus ("Get sensor ID failed").
  - platform: gpio
    id: board_camera_run
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      pi4ioe5v6408: tab5_ioe
      number: 6

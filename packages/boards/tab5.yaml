# ESP Screens - M5Stack Tab5 ST7121: 5-inch 1280 x 720 panel, ESP32-P4 and ESP32-C6.
# This profile targets only the confirmed ST7121 display and touch-controller variant (issue #79).
# docs/TAB5.md records the evidence and what still needs checking on the glass.
packages:
  hardware: !include ../hardware/m5stack-tab5.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml
  # The speaker and the two microphones as the screen's audio (features/audio.yaml), with the amplifier following the
  # sound (features/audio-amplifier.yaml): its hardware below.
  audio: !include ../features/audio.yaml
  audio_amplifier: !include ../features/audio-amplifier.yaml
  audio_half_duplex: !include ../features/audio-half-duplex.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "tab5"
  DEVICE_NAME: "tab5-new"
  DEVICE_FRIENDLY_NAME: "My M5Stack Tab5"

  # The glass: the panel's own pixels and its density, 1469 diagonal pixels over 5.0 inches.
  PANEL_W: "720"
  PANEL_H: "1280"
  DISPLAY_DPI: "293.721"
  # The LVGL angle that lays this panel out lying down (1280 x 720). Standing up is a quarter further.
  ROTATION_LANDSCAPE: "90"
  # The tile grid: three columns by three rows lying down, or four rows when selected, and one column by five rows standing up.
  GRID_COLS: "3"
  GRID_ROWS: "3"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "5"
  LVGL_BUFFER_SIZE: "50%"                       # LVGL's draw buffer as a share of the screen
  TOUCH_CONTROLLER: "ST7121"                    # The ESPHome driver is named st7123; the glass reports ST7121.
  TOUCH_TEST_READY_LOG: "ST7121 touch test ready; no tile actions"

  # The audio (features/audio.yaml), as ESPHome's own Tab5 configuration and M5Stack's BSP wire it: an ES8388 for the
  # speaker and an ES7210 for the microphones on one I2S bus, which ESPHome lets them take in turns. The ES8388 turns
  # ESPHome's volume into its DAC register from -96 dB at 0 to 0 dB at 1, half a decibel a step.
  AUDIO_HALF_DUPLEX: "true"
  AUDIO_MIC_BUS: ts_speaker_bus
  AUDIO_DOUT_PIN: GPIO26
  AUDIO_DIN_PIN: GPIO28
  AUDIO_DAC_DB_AT_0: "-96"
  AUDIO_DAC_DB_AT_1: "0"
  AUDIO_AMPLIFIER: board_speaker_amp
  # ESPHome's es8388 leaves the DAC's outputs as the chip starts, off; the Tab5's speaker hangs on LINE1 (ESPHome's own
  # Tab5 configuration turns that output on by hand). This board's own step at start, after every component is set up.
  BOOT_BOARD_SETTINGS: |-
    id(ts_audio_dac)->set_dac_output(es8388::DAC_OUTPUT_LINE1);

  # The camera's sensor (the feature camera_sensor, docs/PLUGINS.md): the SC2356 on the MIPI-CSI port answers on the
  # system I2C bus, and takes its 24 MHz clock from GPIO36, as M5Stack's BSP drives it; the board takes it out of reset
  # (switch below). A camera plugin drives it (screen_camera).
  CAMERA_I2C: tab5_bus
  CAMERA_XCLK_PIN: "36"

# ============================================================
# No need to edit below this line.
# ============================================================

esphome:
  # M5STACK-TAB5-ST7121 and the st7123 touch driver are available from ESPHome 2026.7.0; the screen's audio
  # (features/audio.yaml: the speaker_source media player, resamplers) is built and tried on 2026.9.0.
  min_version: 2026.9.0

# The factory firmware identifies this variant as ST7121. ESPHome currently exposes the compatible touch protocol
# through its st7123 platform; on this board the reset is driven by the I/O expander.
touchscreen:
  - platform: st7123
    id: ts_touch
    i2c_id: tab5_bus
    display: my_display
    update_interval: 100ms
    reset_pin:
      pi4ioe5v6408: tab5_ioe
      number: 5
    interrupt_pin: GPIO23
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280

# ESPHome's MIPI-DSI model selects the ST7121 panel sequence. The panel is 720x1280; LVGL turns it a quarter.
display:
  - platform: mipi_dsi
    id: my_display
    model: M5STACK-TAB5-ST7121
    dimensions: {width: 720, height: 1280}
    lanes: 2
    reset_pin:
      pi4ioe5v6408: tab5_ioe
      number: 4
    update_interval: never
    auto_clear_enabled: false

# The audio: both codecs on the system I2C bus, one I2S bus for both (pins of M5Stack's BSP, m5stack_tab5.h), and the
# speaker's amplifier on pin 1 of the first I/O expander (SPK_EN).
i2s_audio:
  - id: ts_speaker_bus
    i2s_mclk_pin: GPIO30
    i2s_bclk_pin: GPIO27
    i2s_lrclk_pin: GPIO29

audio_adc:
  - platform: es7210
    id: ts_audio_adc
    i2c_id: tab5_bus
    sample_rate: 16000
    bits_per_sample: 16bit
    # The microphones' gain in the ES7210's analogue stage, before the converter: 30 dB rather than ESPHome's 24, which
    # raises the voice above the converter's own noise, where a digital gain raises both and clips the peaks.
    mic_gain: 30dB

audio_dac:
  - platform: es8388
    id: ts_audio_dac
    i2c_id: tab5_bus

# The Tab5's own choices on top of features/audio.yaml (ESPHome's !extend). The microphone on the right
# channel of the ES7210, as ESPHome's Tab5 configuration and the Tab5 voice configurations that work read it, with its
# DC offset taken out. The speaker with ESPHome's default buffer of 500 ms instead of 100: an answer comes over the
# C6's Wi-Fi while Home Assistant still makes it, and a buffer that runs dry plays silence, a gap in the voice.
microphone:
  - id: !extend ts_microphone
    channel: right
    correct_dc_offset: true

speaker:
  - id: !extend ts_speaker_out
    buffer_duration: 500ms

switch:
  # The camera's reset (CAM_RST, pin 6 of the first I/O expander, active low), released at start as M5Stack's own
  # firmware and Espressif's Tab5 BSP do. ESPHome starts the expander with every pin loose, and a sensor whose reset
  # floats does not answer on its bus ("Get sensor ID failed").
  - platform: gpio
    id: board_camera_run
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      pi4ioe5v6408: tab5_ioe
      number: 6
  - platform: gpio
    id: board_speaker_amp
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      pi4ioe5v6408: tab5_ioe
      number: 1

# ESP Screens - Waveshare ESP32-S3-Touch-LCD-4B board, experimental: a 4-inch 480 x 480 IPS panel (ST7701S over
# RGB) with GT911 capacitive touch, an ESP32-S3 with 16 MB flash and 8 MB of octal PSRAM, and a TCA9554 expander
# that carries the three lines the panel's own setup is sent over. Not the older ESP32-S3-Touch-LCD-4 without the
# "B": that board has other pins (ESPHome's WAVESHARE-4-480X480 model). No physical acceptance yet: see
# docs/WAVESHARE4B.md.
#
# The glass is the size of the 4-inch Guition's, so every size is the Guition's: the same tiles in millimetres,
# the same six cells. The battery charger (AXP2101), the audio chips, the motion sensor and the clock chip on this
# board stay unused.
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together. Two entry files include this one:
# checkout/waveshare4b.yaml (a build on this computer) and packages/waveshare4b.yaml (the package a screen builds
# from over GitHub).
packages:
  # The chip and its memory for an RGB panel, as on the other Waveshare boards.
  hardware: !include ../hardware/esp32s3-rgb.yaml
  # The cards of this board's grid, one per cell (tools/generate_cells.py writes them; docs/RESPONSIVE.md).
  cells: !include ../cells/6.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "waveshare4b"
  DEVICE_NAME: "waveshare4b-new"
  DEVICE_FRIENDLY_NAME: "My Waveshare 4B"

  # The glass: the panel's own pixels and its density, the 4-inch Guition's.
  PANEL_W: "480"
  PANEL_H: "480"
  DISPLAY_DPI: "170"
  # The tile grid: columns and rows of cells; square glass has the same six whichever way it hangs.
  GRID_COLS: "2"
  GRID_ROWS: "3"
  # More tiles and pages than the 64 and eight of a board without PSRAM (firmware 0.34.0+): the tile list, the cards and the
  # extras live in PSRAM here, and the memory budget (tile_memory.h) says how many of them a layout really takes.
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"                   # a wider top bar where the glass has the width for it
  LVGL_BUFFER_SIZE: "25%"                       # LVGL's draw buffer as a share of the screen

  # Hardware a screen's own YAML may change (docs/EASY_SETUP.md, "Hardware-specific YAML overrides")
  BACKLIGHT_FREQUENCY: "300000Hz"               # the backlight's PWM: an analog dim input behind a 160 Hz filter (below)

# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  flash_size: 16MB

logger:
  tx_buffer_size: 2048
  # This board has two USB-C ports: one through a USB-to-UART chip, one on the chip's own USB. The log goes out
  # over the UART one, as on the Guition.
  hardware_uart: UART0

# The GT911, the TCA9554 and the board's other chips (battery charger, audio, motion sensor, clock) share one bus.
i2c:
  id: touch_bus
  sda: GPIO47
  scl: GPIO48
  frequency: 400kHz
  scan: true

# The IO expander: its first three lines carry the panel's setup (the SPI bus below), the fourth the speaker amplifier,
# which stays off. The TCA9554 speaks the PCA9554's registers.
pca9554:
  - id: expander
    address: 0x20
    i2c_id: touch_bus

# The ST7701S takes its setup over three-wire SPI, and on this board those wires are expander lines, so the bus is
# ESPHome's software SPI on them. It runs once, at boot; the picture itself goes over the RGB pins below.
spi:
  id: lcd
  interface: software
  clk_pin:
    pca9554: expander
    number: 2
    allow_other_uses: true
  mosi_pin:
    pca9554: expander
    number: 1
    allow_other_uses: true

# ESPHome's light corrects for the eye with gamma 2.8, made for a LED that a PWM switches. This driver's analog dim already
# has the narrow range above, and that gamma pressed every step under about 30 % onto its dimmest end, so 10 and 30 looked
# the same (GitHub #158). Its level goes straight onto the range instead.
light:
  - id: !extend back_light
    gamma_correct: 1.0

output:
  # GPIO4 is no switch for the LEDs but the analog dim input of their boost driver (Waveshare's schematic: GPIO4 through
  # 10 kOhm and 100 nF, then 68 kOhm into the feedback pin of the AP3032), low for full light (inverted). The driver
  # stops altogether once that filtered level passes about 1.78 V, duty 54 % (GitHub #158, measured on a panel). At the
  # 5 kHz this board ran before, the ripple behind the 160 Hz filter crossed that line while the average stayed below it,
  # and everything under 74 % brightness was dark. 300 kHz leaves a sixtieth of that ripple, and the dimmest end stops at
  # duty 48 %, two points inside the steady range (min_power acts before the inversion, so it sets the dim end here).
  # zero_means_zero keeps a level of 0 dark: duty 100 %, the driver off.
  - platform: ledc
    pin: GPIO4
    id: gpio_backlight_pwm
    frequency: ${BACKLIGHT_FREQUENCY}
    min_power: 0.52
    max_power: 1.0
    zero_means_zero: true
    inverted: true
  # The panel's setup lines, parked before the setup goes out: select high (idle), data and clock low (ESPHome issue
  # #11748). The SPI bus claims its lines before the expander starts, and the expander starts with every line an input,
  # so after a cold start the setup never reached the panel: the backlight lit a black screen, while a restart that
  # kept the expander powered drew fine. These outputs start after the expander and before the display. They replace
  # the `esphome: on_boot:` step of the community configuration, which a board file may not have
  # (tools/check_packages.py): a list there replaced the core's whole boot block (firmware 0.3.9 and before).
  - platform: gpio
    id: lcd_select_idle
    pin:
      pca9554: expander
      number: 0
      allow_other_uses: true
    inverted: true
  - platform: gpio
    id: lcd_data_idle
    pin:
      pca9554: expander
      number: 1
      allow_other_uses: true
  - platform: gpio
    id: lcd_clock_idle
    pin:
      pca9554: expander
      number: 2
      allow_other_uses: true

# The GT911 has no reset or interrupt line wired to anything the firmware drives; it reports pixels of the panel.
touchscreen:
  - platform: gt911
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    update_interval: 20ms

# ESPHome's generic ST7701S model brings the panel's init sequence; the pins and timings are this board's. ESPHome's
# WAVESHARE-4-480X480 model is the older board without the "B" and has other pins. The values are those of the
# community configuration that runs this board with ESPHome (github.com/alaltitov/Waveshare-ESP32-S3-Touch-LCD-4B),
# which matches Waveshare's own pin table; they have not been seen on the glass of a board here yet.
display:
  - platform: mipi_rgb
    model: ST7701S
    id: my_display
    spi_id: lcd
    cs_pin:
      pca9554: expander
      number: 0
      allow_other_uses: true
    data_rate: 1MHz
    dimensions:
      width: ${PANEL_W}
      height: ${PANEL_H}
    de_pin: GPIO17
    pclk_pin: GPIO9
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_frequency: 16MHz
    pclk_inverted: false
    hsync_pulse_width: 10
    hsync_back_porch: 10
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 10
    vsync_front_porch: 10
    pixel_mode: 18bit
    color_order: RGB
    invert_colors: true
    data_pins:
      red: [GPIO10, GPIO11, GPIO12, GPIO13, GPIO14]
      green: [GPIO21, GPIO8, GPIO18, GPIO45, GPIO38, GPIO39]
      blue: [GPIO40, GPIO41, GPIO42, GPIO2, GPIO1]
    update_interval: never
    auto_clear_enabled: false

# ESP Screens - the compact look: every size of the shared tree for a small screen that includes this file, where
# the standard look (looks/standard.yaml) would leave too little room: tighter gaps, smaller letters, a lighter top bar.
#
# A size is written as it was drawn on a 143 dpi screen (the 2.8-inch CYD) and scaled by the board's own
# density, DISPLAY_DPI, so a tile, a letter and a key keep their size in millimetres on any glass
# (docs/RESPONSIVE.md). ESPHome does the sum when it reads the file: `${ (40 * LOOK_SCALE) | round | int }` is
# 40 px at 143 dpi. The board file can still state any of these names itself, and its value wins; do that
# only for a size that was measured on the glass, and say so next to it.
#
# To change a size on every board that has this look, change the number here. docs/PROFILES.md says how the
# files of a screen fit together.
substitutions:
  LOOK: "compact"
  LOOK_SCALE: ${ (DISPLAY_DPI | float) / 143 }

  # The page: where the tiles start, the top bar, and the strip whose hold opens the settings
  SCROLL_Y: ${ (40 * LOOK_SCALE | float) | round | int }
  HEADER_Y: ${ (14 * LOOK_SCALE | float) | round | int }
  HEADER_INSET: ${ (11 * LOOK_SCALE | float) | round | int }   # the room name and the clock from the glass edge
  SETTINGS_HOLD_DRIFT_PX: ${ (24 * LOOK_SCALE | float) | round | int }
  # The tile grid around the cells (not scaled: the grid of each board was chosen with these)
  GRID_MARGIN: "9"
  GRID_GAP_X: "8"
  GRID_GAP_Y: "4"

  # Tiles
  TILE_RADIUS: ${ (18 * LOOK_SCALE | float) | round | int }    # corner of a tile
  TILE_PAD: ${ (8 * LOOK_SCALE | float) | round | int }       # inside a tile
  TILE_ICON_SIZE: ${ (36 * LOOK_SCALE | float) | round | int } # the icon circle

  # The page bar under the tiles
  PAGE_BAR_H: ${ (36 * LOOK_SCALE | float) | round | int }
  PAGE_NUMBER_W: ${ (104 * LOOK_SCALE | float) | round | int }     # the dots in the middle
  PAGE_CHEVRON_INSET: ${ (14 * LOOK_SCALE | float) | round | int } # the chevrons from the outer edge

  # Cards: the round keys and the brightness card
  CARD_KEY_X: ${ (10 * LOOK_SCALE | float) | round | int }     # a card's round key from the side
  CARD_KEY_Y: ${ (8 * LOOK_SCALE | float) | round | int }     # from the top
  CARD_KEY_SIZE: ${ (40 * LOOK_SCALE | float) | round | int }  # its diameter
  COLOR_TITLE_W: ${ (210 * LOOK_SCALE | float) | round | int } # the colour card's title
  COLOR_TITLE_Y: ${ (21 * LOOK_SCALE | float) | round | int }

  # The alert (HA action show_alert): its sizes are worked out on the glass (screen_alert::layout, firmware 0.2.103+);
  # what is left here is how much text it takes, which ESP Screens checks before it sends an alert.
  ALERT_TITLE_MAX: "48"       # bytes; the label ends one line with an ellipsis
  ALERT_BUTTON_MAX: "12"      # bytes on the OK button
  ALERT_SUBTITLE_MAX: "160"   # bytes; wraps over the rows the card has

  # Font sizes (points = pixels); never below 8
  FONT_TIME_SIZE: ${ [8, (18 * LOOK_SCALE | float) | round | int] | max }         # the clock in the top bar
  FONT_HEADLINE_SIZE: ${ [8, (18 * LOOK_SCALE | float) | round | int] | max }     # card titles
  FONT_WATCH_VALUE_SIZE: ${ [8, (22 * LOOK_SCALE | float) | round | int] | max }
  FONT_CLOCK_DIGITS_SIZE: ${ [8, (24 * LOOK_SCALE | float) | round | int] | max }
  FONT_SETPOINT_SIZE: ${ [8, (40 * LOOK_SCALE | float) | round | int] | max }     # the climate card's setpoint
  FONT_LABEL_SIZE: ${ [8, (11 * LOOK_SCALE | float) | round | int] | max }        # tile titles
  FONT_SUBLABEL_SIZE: ${ [8, (11 * LOOK_SCALE | float) | round | int] | max }     # tile values and small text
  FONT_SUBLABEL_BIG_SIZE: ${ [8, (14 * LOOK_SCALE | float) | round | int] | max } # the top bar and settings rows
  FONT_ICON_SIZE: ${ [8, (28 * LOOK_SCALE | float) | round | int] | max }         # tile icons
  FONT_ICON_MINI_SIZE: ${ [8, (18 * LOOK_SCALE | float) | round | int] | max }    # the top bar and card keys
  FONT_ICON_HOME_SIZE: ${ [8, (25 * LOOK_SCALE | float) | round | int] | max }    # the home key in the top bar
  FONT_ICON_BIG_SIZE: ${ [8, (40 * LOOK_SCALE | float) | round | int] | max }     # full-page tiles
  FONT_WATCH_ICON_SIZE: ${ [8, (12 * LOOK_SCALE | float) | round | int] | max }
  # The starting screen's Tessera lockup: the mosaic mark beside the name, as on the website (firmware 0.3.8+)
  FONT_BRAND_SIZE: ${ [8, (30 * LOOK_SCALE | float) | round | int] | max }
  BRAND_MARK_SIZE: ${ [8, (30 * 1.1 * LOOK_SCALE | float) | round | int] | max }
  LVGL_DEFAULT_FONT: "sublabel_big"   # LVGL's default font: every label names its own, so this only keeps Montserrat out of the build
  EFFECTS_ROW_FONT: "sublabel_big"    # the effects page's rows

  # The touch test page (a bench build's first page: CALIBRATION_ON_BOOT)
  TOUCH_TEST_TITLE_FONT: "sublabel"
  TOUCH_TEST_TITLE_Y: "65"
  TOUCH_TEST_INSET: "10"          # the corner crosses from the edge
  TOUCH_TEST_SIZE: "20"           # a cross

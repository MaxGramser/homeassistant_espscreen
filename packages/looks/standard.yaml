# ESP Screens - the standard look: every size of the shared tree, for a board that includes this file.
#
# A size is written as it was drawn on a 170 dpi screen (the 4-inch Guition) and scaled by the board's own
# density, DISPLAY_DPI, so a tile, a letter and a key keep their size in millimetres on any glass
# (docs/RESPONSIVE.md). ESPHome does the sum when it reads the file: `${ (72 * LOOK_SCALE) | round | int }` is
# 72 px at 170 dpi. The board file can still state any of these names itself, and its value wins; do that
# only for a size that was measured on the glass, and say so next to it.
#
# To change a size on every board that has this look, change the number here. docs/PROFILES.md says how the
# files of a screen fit together.
substitutions:
  LOOK: "standard"
  LOOK_SCALE: ${ (DISPLAY_DPI | float) / 170 }

  # The page: where the tiles start, the top bar, and the strip whose hold opens the settings
  SCROLL_Y: ${ (72 * LOOK_SCALE | float) | round | int }
  HEADER_Y: ${ (22 * LOOK_SCALE | float) | round | int }
  HEADER_INSET: ${ (16 * LOOK_SCALE | float) | round | int }   # the room name and the clock from the glass edge
  SETTINGS_HOLD_DRIFT_PX: ${ (32 * LOOK_SCALE | float) | round | int }
  # The tile grid around the cells (not scaled: the grid of each board was chosen with these)
  GRID_MARGIN: "16"
  GRID_GAP_X: "12"
  GRID_GAP_Y: "12"

  # Tiles
  TILE_RADIUS: ${ (22 * LOOK_SCALE | float) | round | int }    # corner of a tile
  TILE_PAD: ${ (12 * LOOK_SCALE | float) | round | int }       # inside a tile
  TILE_ICON_SIZE: ${ (54 * LOOK_SCALE | float) | round | int } # the icon circle

  # The page bar under the tiles
  PAGE_BAR_H: ${ (60 * LOOK_SCALE | float) | round | int }
  PAGE_NUMBER_W: ${ (160 * LOOK_SCALE | float) | round | int }     # the dots in the middle
  PAGE_CHEVRON_INSET: ${ (24 * LOOK_SCALE | float) | round | int } # the chevrons from the outer edge

  # Cards: the round keys and the brightness card
  CARD_KEY_X: ${ (16 * LOOK_SCALE | float) | round | int }     # a card's round key from the side
  CARD_KEY_Y: ${ (16 * LOOK_SCALE | float) | round | int }     # from the top
  CARD_KEY_SIZE: ${ (60 * LOOK_SCALE | float) | round | int }  # its diameter
  COLOR_TITLE_W: ${ (310 * LOOK_SCALE | float) | round | int } # the colour card's title
  COLOR_TITLE_Y: ${ (35 * LOOK_SCALE | float) | round | int }

  # The alert (HA action show_alert): its sizes are worked out on the glass (screen_alert::layout, firmware 0.2.103+);
  # what is left here is how much text it takes, which ESP Screens checks before it sends an alert.
  ALERT_TITLE_MAX: "64"       # bytes; the label ends one line with an ellipsis
  ALERT_BUTTON_MAX: "16"      # bytes on the OK button
  ALERT_SUBTITLE_MAX: "240"   # bytes; wraps over the rows the card has

  # Font sizes (points = pixels); never below 8
  FONT_TIME_SIZE: ${ [8, (27 * LOOK_SCALE | float) | round | int] | max }         # the clock in the top bar
  FONT_HEADLINE_SIZE: ${ [8, (27 * LOOK_SCALE | float) | round | int] | max }     # card titles
  FONT_WATCH_VALUE_SIZE: ${ [8, (38 * LOOK_SCALE | float) | round | int] | max }
  FONT_CLOCK_DIGITS_SIZE: ${ [8, (48 * LOOK_SCALE | float) | round | int] | max }
  FONT_SETPOINT_SIZE: ${ [8, (64 * LOOK_SCALE | float) | round | int] | max }     # the climate card's setpoint
  FONT_LABEL_SIZE: ${ [8, (18 * LOOK_SCALE | float) | round | int] | max }        # tile titles
  FONT_SUBLABEL_SIZE: ${ [8, (16 * LOOK_SCALE | float) | round | int] | max }     # tile values and small text
  FONT_SUBLABEL_BIG_SIZE: ${ [8, (21 * LOOK_SCALE | float) | round | int] | max } # the top bar and settings rows
  FONT_ICON_SIZE: ${ [8, (42 * LOOK_SCALE | float) | round | int] | max }         # tile icons
  FONT_ICON_MINI_SIZE: ${ [8, (26 * LOOK_SCALE | float) | round | int] | max }    # the top bar and card keys
  FONT_ICON_HOME_SIZE: ${ [8, (34 * LOOK_SCALE | float) | round | int] | max }    # the home key in the top bar
  FONT_ICON_BIG_SIZE: ${ [8, (64 * LOOK_SCALE | float) | round | int] | max }     # full-page tiles
  FONT_WATCH_ICON_SIZE: ${ [8, (18 * LOOK_SCALE | float) | round | int] | max }
  # The starting screen's Tessera lockup: the mosaic mark beside the name, as on the website (firmware 0.3.8+)
  FONT_BRAND_SIZE: ${ [8, (46 * LOOK_SCALE | float) | round | int] | max }
  BRAND_MARK_SIZE: ${ [8, (46 * 1.1 * LOOK_SCALE | float) | round | int] | max }
  LVGL_DEFAULT_FONT: "sublabel"   # LVGL's default font: every label names its own, so this only keeps Montserrat out of the build
  EFFECTS_ROW_FONT: "sublabel"    # the effects page's rows

  # The touch test page (a bench build's first page: CALIBRATION_ON_BOOT)
  TOUCH_TEST_TITLE_FONT: "headline"
  TOUCH_TEST_TITLE_Y: "110"
  TOUCH_TEST_INSET: "12"          # the corner crosses from the edge
  TOUCH_TEST_SIZE: "24"           # a cross

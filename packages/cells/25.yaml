                  width: 1
                  height: 1
                  styles: style_tile
                  scrollable: false
                  scrollbar_mode: 'OFF'
                  widgets:
                    - obj:
                        id: tile1_icon_circle
                        width: ${TILE_ICON_SIZE}
                        height: ${TILE_ICON_SIZE}
                        styles: style_icon_circle
                        clickable: false

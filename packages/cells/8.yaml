############################################################
# ESP Screens - the cards of a grid of 8 cells.
#
# Written by tools/generate_cells.py; do not edit. A board includes the file for its own number of cells
# (GRID_COLS x GRID_ROWS) and the shared tree in packages/core.yaml places them: the container `tile_scroll`
# is an LVGL grid and runtime_tiles::place_page gives every card its cell and span. A card carries no
# coordinate, only the size its board's grid gives it; its circle, name and state are placed by the runtime
# on the cell it got (runtime_tiles::head_row), so a board states the icon's size and nothing else of the head.
############################################################
substitutions:
  # The shared boot lambda hands the cards to the runtime with this line (packages/core.yaml).
  BIND_CELLS: |-
    runtime_tiles::bind(0, id(tile1), id(t1_title), id(t1_value), id(tile1_icon_circle), id(tile1_icon_lbl));
    runtime_tiles::bind(1, id(tile2), id(t2_title), id(t2_value), id(tile2_icon_circle), id(tile2_icon_lbl));
    runtime_tiles::bind(2, id(tile3), id(t3_title), id(t3_value), id(tile3_icon_circle), id(tile3_icon_lbl));
    runtime_tiles::bind(3, id(tile4), id(t4_title), id(t4_value), id(tile4_icon_circle), id(tile4_icon_lbl));
    runtime_tiles::bind(4, id(tile5), id(t5_title), id(t5_value), id(tile5_icon_circle), id(tile5_icon_lbl));
    runtime_tiles::bind(5, id(tile6), id(t6_title), id(t6_value), id(tile6_icon_circle), id(tile6_icon_lbl));
    runtime_tiles::bind(6, id(tile7), id(t7_title), id(t7_value), id(tile7_icon_circle), id(tile7_icon_lbl));
    runtime_tiles::bind(7, id(tile8), id(t8_title), id(t8_value), id(tile8_icon_circle), id(tile8_icon_lbl));

lvgl:
  pages:
    - id: !extend home_page
      widgets:
        - obj:
            id: !extend tile_scroll
            widgets:
              # ---------- CARD 1 ----------
              - obj:
                  id: tile1
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  # A seed: runtime_tiles::bind puts the card in a cell of the grid and LVGL stretches it to
                  # that cell, whichever way the glass hangs (firmware 0.2.92+).
                  width: 1
                  height: 1
                  styles: style_tile
                  scrollable: false
                  scrollbar_mode: 'OFF'
                  widgets:
                    - obj:
                        id: tile1_icon_circle
                        width: ${TILE_ICON_SIZE}
                        height: ${TILE_ICON_SIZE}
                        styles: style_icon_circle
                        clickable: false
                        scrollable: false
                        scrollbar_mode: 'OFF'
                        widgets:
                          - label:
                              id: tile1_icon_lbl
                              align: CENTER
                              text_font: materialdesign_icons
                              text: "\U000F002A"
                              clickable: false
                    - label:
                        id: t1_title
                        text: "Tile 1"
                        styles: style_title
                        clickable: false
                    - label:
                        id: t1_value
                        text: "—"
                        styles: style_value
                        clickable: false

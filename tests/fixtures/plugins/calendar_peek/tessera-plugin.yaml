# A plugin for the app's tests: asks Home Assistant for a calendar's events through the app.
id: calendar_peek
version: 1.0.0
api: "0.1"
icon: calendar
topics: [calendar]
maintainer: someone
license: MIT
permissions:
  ha_commands: ["call_service:calendar.get_events"]
tiles:
  - id: next
    name: tile
    domains: [calendar]
    attributes: [message, start_time]
    sizes: { min: 1x1, max: 2x1 }
    memory: 400
settings:
  - { key: peek_in_bar, label: tile }
  - { key: peek_days, label: tile }

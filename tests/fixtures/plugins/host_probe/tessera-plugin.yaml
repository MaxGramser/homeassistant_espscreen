# A plugin for the host render (tools/render/run.py --plugin, docs/TESTING.md): it writes every moment of the plugin
# API to the log, so the harness reads the life of a tile, a card, a tap action, a bar item and the plugin's own moments
# on the real firmware built for this computer. It is never on a screen, and never in the index.
id: host_probe
version: 1.0.0
api: "0.13"
icon: puzzle-outline
topics: [tech]
maintainer: tessera
license: MIT
permissions:
  ha_commands: ["call_service:calendar.get_events"]
  # The action of several fields of any JSON type its tile sends on a tap (plugin API 0.12).
  home_assistant_actions: [music_assistant.play_media]
tiles:
  - id: probe
    name: tile
    sizes: { min: 1x1, max: 2x2 }
    memory: 300
    # A place for a picture (plugin API 0.10), whose address the harness sends in the data (`picture`).
    pictures: 2
    options:
      - { id: word, kind: text, label: word, default: "Probe" }
      # Lists (plugin API 0.12): several texts, and several picks of a choice, each {value, label}.
      - { id: words, kind: text, multiple: 3, label: words }
      - id: picks
        kind: choice
        multiple: 3
        label: picks
        choices: [{ value: "1", label: one }, { value: "2", label: two }, { value: "3", label: three }]
cards:
  # A place for a picture on the card (plugin API 0.13), whose address the card sets itself.
  - { id: detail, name: card, pictures: 1 }
  # A card that closes itself (or opens another) from its own calls, as the message from the harness says.
  - { id: closer, name: closer }
tap_actions:
  - { id: open, label: open, domains: [sensor] }
bar_items:
  - { id: mark, label: mark, example: mark }

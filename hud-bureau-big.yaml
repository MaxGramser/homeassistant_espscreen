esphome:
  name: hud-bureau-big
  friendly_name: HUD Bureau BIG
  platformio_options:
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # From https://github.com/esphome/home-assistant-voice-pe/blob/dev/home-assistant-voice.yaml
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32_S3_BOX_BOARD: "y"
      # CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y" # TLS1.3 support isn't enabled by default in IDF 5.1.5

substitutions:
  devicename: hud-bureau-big
  name: Hud Bureau Big
  name_id: hud_bureau_big
  printer_connected_id: binary_sensor.anet_a8_connected
  printer_printing_id: binary_sensor.anet_a8_printing
  printer_status_id: sensor.anet_a8_print_status
  printer_hot_end_id: sensor.anet_a8_tool_0_temperature
  printer_bed_id: sensor.anet_a8_bed_temperature
  printer_progress_percent_id: sensor.anet_a8_print_progress
  printer_time_left_id: sensor.anet_a8_print_time_left_friendly
  printer_print_time_id: sensor.anet_a8_print_time_friendly
  heater_id: climate.bureau
  cover_id: cover.volet_bureau_volet
  temp_bureau_id: sensor.bureau_temperature
  hum_bureau_id: sensor.bureau_humidite
  temp_ext_id: sensor.aqara_exterieur_temperature
  hum_ext_id: sensor.aqara_exterieur_humidite
  download_id: sensor.opnsense_home_wan_in_rate_average
  upload_id: sensor.opnsense_home_wan_out_rate_average
  ping_id: sensor.opnsense_gateway_wan_dhcp_delay
  lost_id: sensor.opnsense_gateway_wan_dhcp_loss
  qbit_download_id: sensor.qbittorrent_vitesse_de_telechargement
  qbit_upload_id: sensor.qbittorrent_vitesse_de_telechargement_montant
  jellyfin_play_id: sensor.jellyfin_clients_actifs
  weather_id: weather.buzy
  weather_forcast_1_max: sensor.buzy_forcasts_1_max_temp
  weather_forcast_1_min: sensor.buzy_forcasts_1_min_temp
  block_deep_sleep_id: binary_sensor.amd_pred_monitor
  wake_word_triggered_sound_file: "https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac"
  timer_finished_sound_file: "https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac"
packages:
  common: !include .common.yaml
  base_sensor: !include .base_sensors.yaml

api:
  encryption:
    key: "dQV41NkqMbLOZrPAYD8QARiYZc+QRDhK3xcyT/1pMtU="

logger:
  hardware_uart: UART0
  level: DEBUG

psram:
  mode: octal
  speed: 80MHz

font: !include includes/hud_bureau_big/font.yml

color: !include includes/hud_bureau_big/color.yml

display:
  - platform: mipi_rgb
    model: rpi
    id: screen
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    dimensions:
      width: 800
      height: 480
    # reset_pin:
    #   number: 3
    de_pin:
      number: 42
    hsync_pin:
      number: 40
    vsync_pin:
      number: 41
    pclk_pin:
      number: 39
    pclk_frequency: 16MHz
    hsync_pulse_width: 48
    hsync_back_porch: 32
    hsync_front_porch: 16
    vsync_pulse_width: 2
    vsync_back_porch: 23
    vsync_front_porch: 7

    data_pins:
      red:
        - 7
        - 17
        - 18
        - 3
        - 46
      green:
        - 9
        - 10
        - 11
        - 12
        - 13
        - 14
      blue:
        - 21
        - 47
        - 48
        - 45
        - 38

i2c:
  sda: 15
  scl: 16
  scan: true
  id: bus_a

touchscreen:
  platform: gt911
  id: main_touchscreen
  address: 0x5D
  # interrupt_pin: 38

lvgl:
  id: my_lvgl
  displays:
    - screen
  touchscreens:
    - main_touchscreen
  disp_bg_color: 0x000000
  pages: !include_dir_list /config/esphome/includes/hud_bureau_big/lgvl/
  buffer_size: 7%
  theme:
    spinner:
      arc_color: background
    label:
      text_color: 0xFFFFFF
    button:
      bg_color: background
  on_idle:
    - timeout: 30s
      then:
        - if:
            condition:
              not:
                lvgl.page.is_showing: connecting_page
            then:
              - lvgl.page.show:
                  id: idle
                  animation: FADE_OUT
                  time: 1s
              - if:
                  condition:
                    light.is_on: ${name_id}_backlight
                  then:
                    - light.turn_on:
                        id: ${name_id}_backlight
                        brightness: 50%

binary_sensor: !include_dir_merge_list includes/hud_bureau_big/binary_sensors

sensor: !include includes/hud_bureau_big/sensor.yml

text_sensor: !include includes/hud_bureau_big/text_sensor.yml


globals:
  - id: is_timer_active
    type: bool
    restore_value: false
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: false

output:
  - platform: template
    type: float
    id: backlight_pwm
    write_action:
      then:
        - lambda: |-
            uint8_t value = static_cast<uint8_t>(245.0f * (1.0f - state));
            const uint8_t data[1] = { value };
            id(bus_a).write(0x30, data, 1);

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: "${name_id}_backlight"
    restore_mode: ALWAYS_ON
    effects:
      - flicker:
          name: "Horror Flicker"
          alpha: 75%
          intensity: 10%


time:
  - id: homeassistant_time
    platform: homeassistant
    timezone: Europe/Paris
    on_time_sync:
      then:
        - lvgl.label.update:
            id: lvgl_idle_hour
            text:
              time_format: "%H:%M"
              time: !lambda return id(homeassistant_time).now();
        - lvgl.label.update:
            id: lvgl_idle_date
            text:
              time_format: "%d %B %Y"
              time: !lambda return id(homeassistant_time).now();

    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: lvgl_idle_hour
              text:
                time_format: "%H:%M"
                time: !lambda return id(homeassistant_time).now();
          - lvgl.label.update:
              id: lvgl_idle_date
              text:
                time_format: "%d %B %Y"
                time: !lambda return id(homeassistant_time).now();
      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn

      - hours: 1
        minutes: 30
        seconds: 0
        then:
          - light.turn_off:
              id: ${name_id}_backlight

      - hours: 8
        minutes: 0
        seconds: 0
        then:
          - light.turn_on:
              id: ${name_id}_backlight
              brightness: 50%

debug:
  update_interval: 5s

mapping:
  - id: weather_icon
    from: string
    to: string
    entries:
      clear-night: "\U000F0594" # mdi-weather-night
      cloudy: "\U000F0590" # mdi-weather-cloudy
      exceptional: "\U000F0F2F" # mdi-weather-cloudy-alert
      fog: "\U000F0591" # mdi-weather-fog
      hail: "\U000F0592" # mdi-weather-hail
      lightning: "\U000F0593" # mdi-weather-lightning
      lightning-rainy: "\U000F067E" # mdi-weather-lightning-rainy
      partlycloudy: "\U000F0595" # mdi-weather-partly-cloudy
      pouring: "\U000F0596" # mdi-weather-pouring
      rainy: "\U000F0597" # mdi-weather-rainy
      snowy: "\U000F0598" # mdi-weather-snowy
      snowy-rainy: "\U000F067F" # mdi-weather-snowy-rainy
      sunny: "\U000F0599" # mdi-weather-sunny
      windy: "\U000F059D" # mdi-weather-windy
      windy-variant: "\U000F059E" # mdi-weather-windy-variant
      sunny-off: "\U000F14E4" # mdi-weather-sunny-off

i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: 19
  - id: i2s_speaker
    i2s_lrclk_pin: 6
    i2s_bclk_pin: 5


speaker:
  - id: main_speaker
    platform: i2s_audio
    dac_type: external
    i2s_dout_pin: 4
    channel: mono
    num_channels: 1
    i2s_audio_id: i2s_speaker
    sample_rate: 48000
    # bits_per_sample: 32bit
    buffer_duration: 50ms
    
      
  - platform: mixer
    id: mixer_speaker_id
    output_speaker: main_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input
        
  - platform: resampler
    id: media_spk_resampling_input
    num_channels: 1
    output_speaker: media_spk_mixer_input
    
  - platform: resampler
    id: announcement_spk_resampling_input
    num_channels: 1
    output_speaker: announcement_spk_mixer_input
    # buffer_duration: 100ms
    # sample_rate: 48000
    # bits_per_sample: 16

microphone:
  - platform: i2s_audio
    adc_type: external
    i2s_din_pin: 20
    i2s_audio_id: i2s_mic
    id: main_mic
    channel: left
    pdm: true


button:
  - platform: template
    name: Start voice assistant
    on_press:
      - if:
          condition: voice_assistant.is_running
          then:
            - voice_assistant.stop:
          else:
            - voice_assistant.start:
    
media_player:
  - platform: speaker
    name: Media Player
    id: media
    buffer_size: 25000
    files: 
      - id: wake_word_triggered_sound
        file: ${wake_word_triggered_sound_file}
      - id: timer_finished_sound
        file: ${timer_finished_sound_file}
    media_pipeline:
      format: FLAC
      speaker: media_spk_resampling_input
      num_channels: 1
    announcement_pipeline:
      format: FLAC
      speaker: announcement_spk_resampling_input
      num_channels: 1
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      if:
        condition:
          and:
            - switch.is_off: timer_ringing
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_spk_mixer_input
              decibel_reduction: 0
              duration: 1.0s
    on_turn_on:
      then:
        - switch.turn_on: internal_speaker_amp
    on_turn_off:
      then:
        - switch.turn_off: internal_speaker_amp

voice_assistant:
  id: va
  microphone: main_mic
  media_player: media
  micro_wake_word: mww
  use_wake_word: False
  on_client_connected: 
    then:
      - micro_wake_word.start: 
  on_start:
    - lvgl.page.show:
        id: assist
        animation: FADE_OUT
        time: 0.5s
    - light.turn_on:
        id: ${name_id}_backlight
        brightness: 100%
    - mixer_speaker.apply_ducking:
        id: media_spk_mixer_input
        decibel_reduction: 20  # Number of dB quieter; higher implies more quiet, 0 implies full volume
        duration: 0.0s         # The duration of the transition (default is no transition)

  on_listening:
    - lvgl.widget.show: assist_spinner_listening
    - lvgl.widget.hide: assist_spinner
    - lvgl.spinner.update:
        id: assist_spinner_listening
        indicator:
          arc_color: "ha_blue"
  on_stt_vad_start:
    - lvgl.widget.show: assist_spinner_listening
    - lvgl.widget.hide: assist_spinner
    - lvgl.spinner.update:
        id: assist_spinner_listening
        indicator:
          arc_color: "green"
  on_stt_vad_end:
    - lvgl.widget.show: assist_spinner
    - lvgl.widget.hide: assist_spinner_listening
    - lvgl.spinner.update:
        id: assist_spinner
        indicator:
          arc_color: "accent"
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: "return !x.empty();"
        then:
          - lvgl.widget.show: assist_spinner_listening
          - lvgl.widget.hide: assist_spinner
          - lvgl.spinner.update:
              id: assist_spinner_listening
              indicator:
                arc_color: "green"
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_start:
    - lvgl.widget.show: assist_spinner_listening
    - lvgl.widget.hide: assist_spinner
    - lvgl.spinner.update:
        id: assist_spinner_listening
        indicator:
          arc_color: "green"
    - script.execute: activate_stop_word_once
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - lvgl.page.show:
        id: idle
        animation: FADE_OUT
        time: 0.5s
    - light.turn_on:
        id: ${name_id}_backlight
        brightness: 50%
    - mixer_speaker.apply_ducking:
        id: media_spk_mixer_input
        decibel_reduction: 0
        duration: 1.0s
  on_timer_finished:
    - switch.turn_on: timer_ringing
  on_timer_started:
    - script.execute: control_timer_display
  on_timer_cancelled:
    - script.execute: control_timer_display
  on_timer_updated:
    - script.execute: control_timer_display
  on_timer_tick:
    - script.execute: control_timer_display
        
micro_wake_word:
  microphone:
    microphone: main_mic
  id: mww
  vad:
  stop_after_detection: false
  models:
    - model: okay_nabu
      id: okay_nabu_model
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  on_wake_word_detected:
    then:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
          else:
            - if:
                condition:
                  media_player.is_announcing:
                then:
                  - media_player.stop:
                      announcement: true
                # Start the voice assistant and play the wake sound, if enabled
                else:
                  - script.execute:
                      id: play_sound
                      priority: true
                      sound_file:  !lambda return const_cast<audio::AudioFile*>(id(wake_word_triggered_sound));
                  - delay: 300ms
                  - voice_assistant.start:
                      wake_word: !lambda return wake_word;
switch:
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

  - platform: template
    id: internal_speaker_amp
    optimistic: true
    internal: true
    entity_category: "config"
    on_turn_on: 
      then:
        - lambda: |-
            const uint8_t data[1] = { 248 };
            id(bus_a).write(0x30, data, 1);
    on_turn_off: 
      then:
        - lambda: |-
            const uint8_t data[1] = { 249 };
            id(bus_a).write(0x30, data, 1);

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      # Disable stop wake word
      - micro_wake_word.disable_model: stop
      - script.execute: disable_repeat
      # Stop any current annoucement (ie: stop the timer ring mid playback)
      - if:
          condition:
            media_player.is_announcing:
          then:
            media_player.stop:
              announcement: true
      # Set back ducking ratio to zero
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 0
          duration: 1.0s
      - script.execute: control_timer_display
      - light.turn_on:
          id: ${name_id}_backlight
          brightness: 50%
      - lvgl.page.show: idle

    on_turn_on:
      # Duck audio
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 20
          duration: 0.0s
      # Enable stop wake word
      - micro_wake_word.enable_model: stop
      - lvgl.page.show: timer_ring
      - light.turn_on:
          id: ${name_id}_backlight
          brightness: 100%
      # Ring timer
      - script.execute: ring_timer
      # If 15 minutes have passed and the timer is still ringing, stop it.
      - delay: 15min
      - switch.turn_off: timer_ringing
      - script.execute: control_timer_display

script:
  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file:  !lambda return const_cast<audio::AudioFile*>(id(timer_finished_sound));

  # Script executed when the timer is ringing, to repeat the timer finished sound.
  - id: enable_repeat_one
    then:
      # Turn on the repeat mode and pause for 500 ms between playlist items/repeats
      - lambda: |-
            id(media)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
            id(media)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 500);

  # Script execute when the timer is done ringing, to disable repeat mode.
  - id: disable_repeat
    then:
      # Turn off the repeat mode and pause for 0 ms between playlist items/repeats
      - lambda: |-
            id(media)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
              .set_announcement(true)
              .perform();
            id(media)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);

  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: media
                announcement: true
      - lambda: |
          if ( (id(media).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(media)->play_file(sound_file, true, false);
          }

  - id: activate_stop_word_once
    then:
      - delay: 1s
      # Enable stop wake word
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

  # Script used to check if a timer is active (Stored in global is_timer_active)
  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
            }
          }
          id(is_timer_active) = output;

  # Script used to fetch the first active timer (Stored in global first_active_timer)
  - id: fetch_first_active_timer
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(first_active_timer) = output_timer;

  
  - id: control_timer_display
    then:
      - script.execute:  check_if_timers_active
      - if:
          condition: 
            lambda: "return id(is_timer_active);"
          then:
            - script.execute: fetch_first_active_timer
            - lvgl.label.update:
                id: lvgl_idle_timer_left
                text: !lambda |
                  const voice_assistant::Timer timer = id(first_active_timer);
                  const int h = timer.seconds_left/3600;
                  const int m =  (timer.seconds_left%3600)/60;
                  const int s  = (timer.seconds_left%3600)%60;
                  if(h > 0) {
                    return esphome::str_sprintf("%d:%d:%d", h, m, s);
                  } else {
                    return esphome::str_sprintf("%02d:%02d", m, s);
                  }
            - lvgl.widget.hide: weather_container
            - lvgl.widget.show: timer_container
          else: 
            - lvgl.widget.show: weather_container
            - lvgl.widget.hide: timer_container

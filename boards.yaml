# The boards ESP Screens ships, in the order New screen offers them (docs/ADDING_A_BOARD.md).
#
# One entry per board, keyed by the word ESP Screens knows it by (the BOARD_ID its firmware reports, and the name of
# packages/<key>.yaml, the entry a screen installed from ESP Screens builds from over GitHub, and of checkout/<key>.yaml,
# the one a build from a clone of this repository uses). An entry says only what
# the hardware files cannot: what the board is called, what is printed on it, how far it has been tried, and the
# choices someone makes when a screen of it is built. Everything else ESP Screens shows about a board is worked out
# from its file under packages/boards/ by tools/generate_board_shapes.py, into screen_manager/app/boards.json: the
# glass and its size in inches, the grid lying down and standing up, the touch controller, and what it can do
# (camera pictures, dimming, standby, a touch calibration on the first start).
#
#   file      the board file under packages/boards/
#   name      what people call the board; New screen shows it with its size in inches
#   model     what is printed on the board or its box, to tell it from its neighbours
#   status    stable (tried on the glass by the project), new (tried, few screens out there yet) or experimental
#             (built and rendered, not yet tried on the hardware)
#   choices   optional: a substitution the board file offers for a part that differs between boards sold under the same
#             name, with the values someone may pick when the screen is built. The first is the board file's own
#             default and writes nothing; another is written into the screen's own YAML. Only values that people with
#             that board confirmed work belong here.

cyd:
  file: cyd-2432s028.yaml
  name: CYD
  model: ESP32-2432S028
  status: stable
  choices:
    # Some of these boards carry an ST7789V display controller instead of the ILI9341 (GitHub #6).
    DISPLAY_MODEL: [ILI9341, ST7789V]


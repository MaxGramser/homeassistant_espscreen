name: Tessera Screen Manager
version: "0.4.19"
slug: esp_screen_manager
description: "Tessera: touch screens for Home Assistant. Choose tiles for your ESP32 screens, 2.8 to 10.1 inch, without reflashing."
url: https://tessera-maxgramser.on-forge.com
arch: [aarch64, amd64]
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
# Camera images for Guition screens (docs/CAMERA.md): the screens load them from this port on the LAN.
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Camera images for the screens (keep 8098)
panel_icon: mdi:view-grid
panel_title: Tessera
panel_admin: true
options: {}
schema: {}

map:
  - homeassistant_config:rw
uart: true
usb: true
# Reproducible compiler/download caches (firmware.py build_env); retain screens.json and user configuration.
backup_exclude:
  - '*/build/'
  - '*/esphome/'
  - '*/idf/'
  - '*/platformio/'

name: Tessera Screen Manager
version: "0.4.93"
slug: esp_screen_manager
description: "Tessera: touch screens for Home Assistant. Choose tiles for your ESP32 screens, 2.8 to 10.1 inch, without reflashing."
url: https://tessera-maxgramser.on-forge.com
arch: [aarch64, amd64]
startup: application
boot: auto
homeassistant_api: true
# A troubleshooting report (docs/REPORTS.md) reads Home Assistant's own log from the Supervisor (/core/logs): the
# homeassistant role is the lowest that gives it, and takes nothing off the app's security rating.
hassio_api: true
hassio_role: homeassistant
ingress: true
ingress_port: 8099
# Camera images for Guition screens (docs/CAMERA.md): the screens load them from this port on the LAN.
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Camera images and album covers for the screens
# With Home Assistant's Watchdog switch on (the app's Info page; off until someone turns it on) the Supervisor starts
# the app again when it stops unexpectedly, and with this address also when it stops answering: the one address the
# app answers from anywhere (server.py guard, the same as Docker's health check).
watchdog: http://[HOST]:[PORT:8099]/health
panel_icon: mdi:view-grid
panel_title: Tessera
panel_admin: true
options: {}
schema: {}

map:
  - homeassistant_config:rw
uart: true
usb: true
# Reproducible compiler/download caches (firmware.py build_env); retain screens.json and user configuration.
backup_exclude:
  - '*/build/'
  - '*/esphome/'
  - '*/idf/'
  - '*/platformio/'

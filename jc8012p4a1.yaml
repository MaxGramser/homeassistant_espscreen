# ESP Screens - Guition ESP32-P4 JC8012P4A1 board profile: 10.1-inch 1280x800 MIPI-DSI + GSL3680.
# Source profile for packages/jc8012p4a1.yaml. The screen gets its tiles from ESP Screen Manager.
substitutions:
  SCREEN_FIRMWARE_VERSION: "0.2.63"
  # 0: no drift limit; LVGL decides, releasing inside the tile is a tap, leaving it is not
  # (like iOS). The CYD keeps a limit because its resistive panel jumps.
  TOUCH_MOVE_LIMIT_PX: "0"
  # The GSL3680 is capacitive and reports a stable contact.
  TOUCH_MIN_PRESS_MS: "20"
  # Page swipe starts in this band along the left or right edge (about 5 mm) and needs
  # this much travel inward (about 6 mm); a swipe from the middle of the screen does nothing.
  EDGE_SWIPE_BAND_PX: "32"
  EDGE_SWIPE_TRAVEL_PX: "40"
  DASHBOARD_INBOX_INTERNAL: "false"
  DEVICE_NAME: "guition-new"
  DEVICE_FRIENDLY_NAME: "My Guition"
  CALIBRATION_ON_BOOT: "false"
  ROOM_NAME: "Choose tiles in HA"                  # shown top left until ESP Screens sends the screen name

  ## DIM settings
  AUTO_DIM: "true"                                 # true = enable auto dimming
  AUTO_DIM_TIMEOUT: "600"                           # seconds after last touch
  MAX_BRIGHTNESS: "100"                            # backlight brightness in percent
  DIM_BRIGHTNESS: "20"                             # dimmed backlight brightness in percent
  NIGHT_MODE: "true"                               # true = use separate dim level at night
  NIGHT_START_HOUR: "22"                           # 0-23
  NIGHT_END_HOUR: "7"                              # 0-23
  NIGHT_DIM_BRIGHTNESS: "10"                       # backlight brightness in percent at night

  DISPLAY_W: "1280"
  DISPLAY_H: "800"
  LVGL_ROTATION: "90"
  RUNTIME_ROTATION_OFFSET: "90"
  TOUCH_SWAP_XY: "false"
  TOUCH_MIRROR_X: "true"
  TOUCH_MIRROR_Y: "false"
  GRID_COL1_X: "16"
  GRID_COL2_X: "646"
  GRID_ROW1_Y: "0"
  GRID_ROW2_Y: "145"
  GRID_ROW3_Y: "290"
  GRID_ROW4_Y: "435"
  GRID_ROW5_Y: "580"
  SCROLL_Y: "72"
  SCROLL_H: "700"
  TILE_W: "618"
  TILE_H: "132"
  HEADER_Y: "22"
  # Holding the top bar opens the settings page (0.2.44+). The two edge bands stay clear: a swipe
  # that starts up there still changes the page.
  SETTINGS_HOLD_X: "${EDGE_SWIPE_BAND_PX}"
  SETTINGS_HOLD_W: "416"
  SETTINGS_HOLD_DRIFT_PX: "32"

  # Alert overlay (HA action show_alert), 480x480: one card centred on LVGL's top layer.
  ALERT_CARD_W: "1100"
  ALERT_CARD_H: "520"
  ALERT_ICON_X: "26"
  ALERT_ICON_Y: "22"
  ALERT_TEXT_X: "90"
  ALERT_TEXT_W: "900"
  ALERT_TITLE_Y: "26"
  ALERT_TITLE_H: "32"         # one line of headline; a DOT label only ends in an ellipsis with a height
  ALERT_SUBTITLE_Y: "68"
  ALERT_SUBTITLE_H: "150"
  ALERT_BUTTON_W: "150"
  ALERT_BUTTON_H: "60"
  ALERT_BUTTON_INSET: "22"
  ALERT_TITLE_MAX: "64"       # bytes; the label ends one line with an ellipsis
  ALERT_BUTTON_MAX: "16"      # bytes on the OK button
  ALERT_SUBTITLE_MAX: "240"   # bytes; wraps over the rows the card has
  # An alert with a camera image (firmware 0.2.57+): the image across the top of a taller card, the words under it.
  ALERT_CARD_H_IMAGE: "700"
  ALERT_IMAGE_INSET: "14"
  ALERT_IMAGE_SHIFT: "236"      # the icon, title and subtitle move down by the image and a gap
  ALERT_SUBTITLE_H_IMAGE: "62"  # two lines between the title and the button
  # Camera images (firmware 0.2.57+): the boxes ESP Screen Manager sizes a snapshot for (camera_feed.BOXES).
  CAMERA_FULL_W: "1280"
  CAMERA_FULL_H: "800"
  CAMERA_THUMB_W: "900"
  CAMERA_THUMB_H: "506"
  OVERLAY_SLIDER_W: "144"
  OVERLAY_SLIDER_H: "300"
  OVERLAY_ICON_Y: "148"
  TILE_ICON_X: "0"
  TILE_ICON_Y: "12"
  TILE_TITLE_X: "64"
  TILE_TITLE_Y: "17"
  TILE_VALUE_X: "64"
  TILE_VALUE_Y: "45"

# ============================================================
# No need to edit below this line.
# All configuration is done via the substitutions above.
# Credentials are managed in secrets.yaml (see secrets.yaml.example).
# The Material Design Icons font is included at fonts/materialdesignicons-webfont.ttf (Apache 2.0).
# Source: https://github.com/Templarian/MaterialDesign-Webfont
# ============================================================
external_components:
  - source:
      type: local
      path: components
    components: [smart_display, mipi_dsi, gsl3680]

esphome:
  min_version: 2026.6.2
  project:
    name: maxgramser.esp_screen
    version: "${SCREEN_FIRMWARE_VERSION}"
  platformio_options:
    build_flags:
      - -DLV_USE_SNAPSHOT=1
      - -DLV_USE_SWITCH=1
  includes:
    - <esphome/components/smart_display/cyd_ui.h>
    - <esphome/components/smart_display/light_controls.h>
    - <esphome/components/smart_display/guition_diagnostics.h>
    - <esphome/components/smart_display/alert_overlay.h>
    - <esphome/components/smart_display/settings_screen.h>
  name: ${DEVICE_NAME}
  friendly_name: ${DEVICE_FRIENDLY_NAME}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          cyd::touch_guard.configure(${TOUCH_MOVE_LIMIT_PX}, ${TOUCH_MIN_PRESS_MS});
          cyd::edge_swipe.configure(${DISPLAY_W}, ${DISPLAY_H}, ${EDGE_SWIPE_BAND_PX}, ${EDGE_SWIPE_TRAVEL_PX});
          // The page and the tile container take no presses: the theme's pressed style would
          // otherwise repaint nearly the whole screen twice per touch in the empty edge band,
          // starving the touch polling for the whole length of a quick swipe.
          lv_obj_remove_flag(id(home_page)->obj, LV_OBJ_FLAG_CLICKABLE);
          lv_obj_remove_flag(id(tile_scroll), LV_OBJ_FLAG_CLICKABLE);
          // A stray GT911 contact at exactly (0, 0) never reaches LVGL (cyd::GhostTouch): as the last
          // sample of a drag it sent a slider to its end on release. LVGL still reads ESPHome's callback.
          if (auto *indev = lv_indev_get_next(nullptr)) {
            static lv_indev_read_cb_t esphome_read = nullptr;
            static const lv_indev_read_cb_t filtered = [](lv_indev_t *input, lv_indev_data_t *data) {
              esphome_read(input, data);
              int32_t ghost_x = 0, ghost_y = 0;
              id(screen_lvgl).rotate_coordinates(ghost_x, ghost_y);
              const unsigned dropped = cyd::ghost_touch.dropped();
              const auto read = cyd::ghost_touch.filter({data->state == LV_INDEV_STATE_PRESSED, (int) data->point.x, (int) data->point.y}, ghost_x, ghost_y);
              if (cyd::ghost_touch.dropped() != dropped) ESP_LOGI("touch", "GT911 stray contact at (0,0) ignored");
              data->state = read.pressed ? LV_INDEV_STATE_PRESSED : LV_INDEV_STATE_RELEASED;
              data->point.x = read.x;
              data->point.y = read.y;
            };
            if (lv_indev_get_read_cb(indev) != filtered) {
              esphome_read = lv_indev_get_read_cb(indev);
              lv_indev_set_read_cb(indev, filtered);
            }
          }
          id(last_touch_ms) = millis();
          id(last_use_ms) = millis();
          id(display_dimmed) = false;
      - lambda: |-
          auto &settings = screen_settings::current;
          settings.standby_enabled = std::string("${AUTO_DIM}") == "true";
          settings.standby_seconds = atoi("${AUTO_DIM_TIMEOUT}");
          settings.brightness = atoi("${MAX_BRIGHTNESS}");
          settings.standby_brightness = atoi("${DIM_BRIGHTNESS}");
          settings.night_enabled = std::string("${NIGHT_MODE}") == "true";
          settings.night_start = atoi("${NIGHT_START_HOUR}") * 60;
          settings.night_end = atoi("${NIGHT_END_HOUR}") * 60;
          settings.night_brightness = atoi("${NIGHT_DIM_BRIGHTNESS}");
          runtime_tiles::watch_font = id(headline)->get_lv_font();
          runtime_tiles::watch_value_font = id(watch_value)->get_lv_font();
          runtime_tiles::watch_icon_font = id(watch_icon)->get_lv_font();
          runtime_tiles::clock_font = id(clock_digits)->get_lv_font();
          runtime_tiles::now_time = []() { return id(homeassistant_time).now(); };
          runtime_tiles::screen_awake = []() { return !id(display_dimmed); };
          runtime_tiles::mini_icon_font = id(materialdesign_icons_mini)->get_lv_font();
          runtime_tiles::big_icon_font = id(materialdesign_icons_big)->get_lv_font();
          runtime_tiles::control_font = id(sublabel_big)->get_lv_font();
          runtime_tiles::small_font = id(sublabel)->get_lv_font();
          // Top bar (0.2.32+): values in the text font, icons in the small icon font; the clock
          // label lends its margin and drawing order and stays hidden in runtime mode.
          runtime_tiles::header_text_font = id(sublabel_big)->get_lv_font();
          runtime_tiles::header_icon_font = id(materialdesign_icons_mini)->get_lv_font();
          runtime_tiles::time_label = id(lbl_time);
          runtime_tiles::enabled = true;
          runtime_tiles::rotation_supported = true;
          runtime_tiles::load_settings();
          // Colours (firmware 0.2.54+): the styles of this profile take their colours from theme.h. The list runs now,
          // in the look the screen saved, before anything is drawn, and again after every change of look.
          theme::paints = []() {
            using theme::Paint;
            for (auto *style : {id(style_room), id(style_time), id(style_title), id(style_value_big), id(paint_ink)}) theme::fill(style, Paint::ink);
            theme::fill(id(style_page), Paint::page);
            theme::fill(id(style_tile), Paint::card);
            theme::fill(id(style_icon_circle), Paint::accent_tint);
            theme::fill(id(style_value), Paint::muted);
            theme::fill(id(paint_page_soft), Paint::page_soft);
            theme::fill(id(paint_page_pressed), Paint::page_pressed);
            theme::fill(id(paint_card), Paint::card);
            theme::fill(id(paint_raised), Paint::raised);
            theme::fill(id(paint_key), Paint::key);
            theme::fill(id(paint_key_pressed), Paint::key_pressed);
            theme::fill(id(paint_track), Paint::track);
            theme::fill(id(paint_ink_soft), Paint::ink_soft);
            theme::fill(id(paint_muted), Paint::muted);
            theme::fill(id(paint_subtle), Paint::subtle);
            theme::fill(id(paint_slate), Paint::slate);
            theme::fill(id(paint_scrim), Paint::scrim);
            theme::fill(id(paint_veil), Paint::veil);
            theme::fill(id(paint_accent_tint), Paint::accent_tint);
            theme::fill(id(paint_accent_bright), Paint::accent_bright);
            theme::fill(id(paint_button_dark), Paint::button_dark);
            theme::fill(id(paint_button_dark_pressed), Paint::button_dark_pressed);
            theme::fill(id(paint_camera), Paint::camera);
          };
          theme::paints();
          theme::set_dark(settings_screen::dark_mode != 0);
          runtime_tiles::settings_changed = []() { id(apply_screen_settings).execute(); };
          runtime_tiles::dismiss = []() {
            runtime_tiles::hide_detail();
            runtime_tiles::camera_close();
            id(active_entity).clear();
            lv_obj_add_flag(id(brightness_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(color_detail_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(climate_detail_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(climate_mode_overlay), LV_OBJ_FLAG_HIDDEN);
          };
          runtime_tiles::layout_changed = []() { id(show_tile_page).execute(); };
          // Camera images (firmware 0.2.57+): the two online_images and the alert's frame.
          // set_url() forgets the ETag, so it is only called for a new link: an unchanged picture then answers 304.
          runtime_tiles::camera_full.load = [](const std::string &url) {
            static std::string current;
            if (url != current) { id(camera_image).set_url(url); current = url; }
            id(camera_image).update();
          };
          runtime_tiles::camera_full.release = []() { id(camera_image).release(); };
          runtime_tiles::camera_full.source = []() { return id(camera_image).get_lv_image_dsc(); };
          runtime_tiles::camera_thumb.load = [](const std::string &url) {
            static std::string current;
            if (url != current) { id(alert_image).set_url(url); current = url; }
            id(alert_image).update();
          };
          runtime_tiles::camera_thumb.release = []() { id(alert_image).release(); };
          runtime_tiles::camera_thumb.source = []() { return id(alert_image).get_lv_image_dsc(); };
          runtime_tiles::alert_frame = id(alert_image_frame);
          runtime_tiles::alert_frame_icon = id(alert_image_icon);
          runtime_tiles::alert_room = [](bool image) {
            const int shift = image ? ${ALERT_IMAGE_SHIFT} : 0;
            lv_obj_set_height(id(alert_card), image ? ${ALERT_CARD_H_IMAGE} : ${ALERT_CARD_H});
            lv_obj_set_y(id(alert_icon), ${ALERT_ICON_Y} + shift);
            lv_obj_set_y(id(alert_title), ${ALERT_TITLE_Y} + shift);
            lv_obj_set_y(id(alert_subtitle), ${ALERT_SUBTITLE_Y} + shift);
            lv_obj_set_height(id(alert_subtitle), image ? ${ALERT_SUBTITLE_H_IMAGE} : ${ALERT_SUBTITLE_H});
          };
          runtime_tiles::refresh = []() { if (!id(ui_refresh).is_running()) id(ui_refresh).execute(); };
          runtime_tiles::bind(0, id(tile1), id(t1_title), id(t1_value), id(tile1_icon_circle), id(tile1_icon_lbl));
          runtime_tiles::bind(1, id(tile2), id(t2_title), id(t2_value), id(tile2_icon_circle), id(tile2_icon_lbl));
          runtime_tiles::bind(2, id(tile3), id(t3_title), id(t3_value), id(tile3_icon_circle), id(tile3_icon_lbl));
          runtime_tiles::bind(3, id(tile4), id(t4_title), id(t4_value), id(tile4_icon_circle), id(tile4_icon_lbl));
          runtime_tiles::bind(4, id(tile5), id(t5_title), id(t5_value), id(tile5_icon_circle), id(tile5_icon_lbl));
          runtime_tiles::bind(5, id(tile6), id(t6_title), id(t6_value), id(tile6_icon_circle), id(tile6_icon_lbl));
          runtime_tiles::bind(6, id(tile7), id(t7_title), id(t7_value), id(tile7_icon_circle), id(tile7_icon_lbl));
          runtime_tiles::bind(7, id(tile8), id(t8_title), id(t8_value), id(tile8_icon_circle), id(tile8_icon_lbl));
          runtime_tiles::bind(8, id(tile9), id(t9_title), id(t9_value), id(tile9_icon_circle), id(tile9_icon_lbl));
          runtime_tiles::bind(9, id(tile10), id(t10_title), id(t10_value), id(tile10_icon_circle), id(tile10_icon_lbl));
          runtime_tiles::detail = [](runtime_tiles::Tile &t) {
            light_controls::fallback = light_controls::State{};
            light_controls::fallback.hue = t.hue;
            light_controls::fallback.kelvin = t.kelvin;
            light_controls::fallback.minimum = t.min_kelvin;
            light_controls::fallback.maximum = t.max_kelvin;
            id(active_climate_fan_modes) = t.extra().fan_modes; id(active_climate_fan_mode) = t.extra().fan_mode;
            id(active_climate_swing_modes) = t.extra().swing_modes; id(active_climate_swing_mode) = t.extra().swing_mode;
            id(active_climate_action) = t.extra().hvac_action;
            id(open_value_overlay).execute(t.name, t.entity, t.domain(), "auto", t.active(), 0,
              t.brightness, t.percentage, t.position, runtime_tiles::icon_for(t),
              "Off", "On", t.modes,
              t.current, t.target, t.humidity, t.state, t.extra().hvac_modes,
              std::to_string(t.minimum), std::to_string(t.maximum), std::to_string(t.step));
          };
          runtime_tiles::detail_update = [](runtime_tiles::Tile &t) {
            if (id(active_entity) != t.entity || id(touch_down)) return;
            if (t.domain() == "climate" && !lv_obj_has_flag(id(climate_detail_overlay), LV_OBJ_FLAG_HIDDEN)) {
              if (id(climate_edit_pending) && millis() - id(climate_edit_ms) < 3000) return;
              id(climate_edit_pending) = false;
              id(active_climate_mode) = t.state;
              id(active_climate_action) = t.extra().hvac_action;
              id(active_climate_supported_modes) = t.extra().hvac_modes;
              id(active_climate_fan_modes) = t.extra().fan_modes; id(active_climate_fan_mode) = t.extra().fan_mode;
              id(active_climate_swing_modes) = t.extra().swing_modes; id(active_climate_swing_mode) = t.extra().swing_mode;
              id(active_climate_current) = t.current;
              id(active_climate_humidity) = std::isfinite(t.humidity) ? (int) lround(t.humidity) : -1;
              if (std::isfinite(t.target)) {
                id(active_climate_target_x10) = cyd::quantize_temperature(lround(t.target * 10), id(active_climate_min_x10), id(active_climate_max_x10), id(active_climate_step_x10));
                id(active_climate_target_known) = true;
              }
              id(climate_card_refresh).execute();
            }
          };
      - lambda: |-
          light_controls::setup(id(color_detail_overlay), id(sublabel)->get_lv_font(), atoi("${DISPLAY_W}"), atoi("${DISPLAY_H}"), id(materialdesign_icons_mini)->get_lv_font());
          light_controls::commits[0] = [](int value) { id(set_light_hue).execute(value); };
          light_controls::commits[1] = [](int value) { id(set_light_color_temperature).execute(value); };
          light_controls::commits[2] = [](int value) { id(color_brightness_commit).execute(value); };
          climate_card::look.card = id(climate_settings_card);
          climate_card::look.font = id(label)->get_lv_font();
          climate_card::look.icon_font = id(materialdesign_icons_mini)->get_lv_font();
          climate_card::choose = [](char kind, int index) {
            if (kind == 'f') id(set_climate_fan_mode).execute(index);
            else id(set_climate_swing_mode).execute(index);
          };
      # The settings page the screen opens on its own (0.2.44+): the same values ESP Screen Manager
      # writes, reachable by holding the top bar. Fonts and hooks only; the page itself is built
      # when it opens and thrown away when it closes, so it costs nothing while it is closed.
      - lambda: |-
          if (!runtime_tiles::enabled) return;
          settings_screen::title_font = id(headline)->get_lv_font();
          settings_screen::row_font = id(sublabel_big)->get_lv_font();
          settings_screen::icon_font = id(materialdesign_icons_mini)->get_lv_font();
          settings_screen::store = []() { runtime_tiles::persist_settings(); };
          settings_screen::apply = []() { id(apply_screen_settings).execute(); };
          settings_screen::report = [](const char *key, int32_t value) { runtime_tiles::setting_event(key, value); };
          settings_screen::name_text = []() { return std::string("${DEVICE_FRIENDLY_NAME}"); };
          settings_screen::address_text = []() { return id(wifi_ip).state.empty() ? std::string("No network") : id(wifi_ip).state; };
          settings_screen::firmware_text = []() { return std::string("${SCREEN_FIRMWARE_VERSION}"); };
          settings_screen::link_text = []() { return std::string(esphome::api_is_connected() ? "Connected" : "Not connected"); };
          settings_screen::restart_device = []() { ESP_LOGI("settings", "restart from the screen"); App.safe_reboot(); };
          // A dimmed screen, a calibration or an alert owns the glass; the page waits.
          settings_screen::may_open = []() {
            return runtime_tiles::enabled && !id(display_dimmed) && !id(calibration_active) && !id(alert_active) && !runtime_tiles::camera_visible();
          };
          settings_screen::drift = []() { return cyd::touch_guard.distance(); };
          settings_screen::before_open = []() { id(close_cards).execute(); };
          settings_screen::hold_limit = ${SETTINGS_HOLD_DRIFT_PX};
          settings_screen::tap_limit = ${TOUCH_MOVE_LIMIT_PX};
          // What a change of look draws again, now that everything is bound: the tiles, the top bar and an open card,
          // the colour card, the settings page, an alert and the climate cards.
          theme::redraw = []() {
            runtime_tiles::restyle();
            light_controls::restyle();
            settings_screen::restyle();
            if (id(alert_active)) lv_obj_set_style_bg_color(id(alert_card), lv_color_hex(theme::surface(id(alert_card_color))), LV_PART_MAIN);
            if (!lv_obj_has_flag(id(climate_detail_overlay), LV_OBJ_FLAG_HIDDEN)) id(climate_card_refresh).execute();
            if (!lv_obj_has_flag(id(climate_mode_overlay), LV_OBJ_FLAG_HIDDEN)) id(open_climate_mode_picker).execute();
          };
          // Under the cards: brightness_overlay is the first of them on the page, so the back button and
          // the action at the top right of a card keep their taps.
          settings_screen::attach_hold(id(home_page)->obj, ${SETTINGS_HOLD_X}, 0, ${SETTINGS_HOLD_W}, ${SCROLL_Y}, id(brightness_overlay));
      - light.turn_on:
          id: back_light
          brightness: !lambda "return screen_settings::current.brightness / 100.0f;"
      - script.execute: show_tile_page
      - lambda: 'if (!id(ui_refresh).is_running()) id(ui_refresh).execute();'
      - if:
          condition:
            lambda: 'return std::string("${CALIBRATION_ON_BOOT}") == "true";'
          then:
            - lambda: 'id(calibration_active) = true;'
            - lvgl.page.show: touch_cal_page
            - lambda: |-
                lv_obj_invalidate(id(touch_cal_page)->obj);
                lv_refr_now(nullptr);
                ESP_LOGI("ui_diag", "GT911 touch test ready; no tile actions");


esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  engineering_sample: true
  framework:
    type: esp-idf
    version: recommended
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "20"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_SPI_FLASH_YIELD_DURING_ERASE: "n"
      CONFIG_ESP_HOSTED_USE_MEMPOOL: "n"
      CONFIG_ESP_HOSTED_DFLT_TASK_FROM_SPIRAM: "y"
      CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS: "1"

psram:
  mode: hex
  speed: 200MHz

esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  sdio_frequency: 40MHz

logger:
  tx_buffer_size: 2048
  hardware_uart: UART0
  # Set to DEBUG or VERBOSE temporarily for diagnosis. Note: ESPHome logs
  # its configuration lines at CONFIG level, which are invisible at INFO.
  level: DEBUG
  logs:
    sensor: WARN
    text_sensor: WARN
    gsl3680: WARN
    homeassistant.sensor: WARN
    homeassistant.text_sensor: WARN


# Credentials are loaded from secrets.yaml — copy secrets.yaml.example to secrets.yaml and fill in your values.
api:
  actions:
    - action: ui_snapshot
      then:
        - script.execute: capture_ui_snapshot
    - action: touch_diagnostics
      then:
        - lambda: 'id(calibration_active) = true;'
        - script.execute: wake_display
        - lvgl.page.show: touch_cal_page
        - lambda: |-
            lv_obj_invalidate(id(touch_cal_page)->obj);
            lv_refr_now(nullptr);
            ESP_LOGI("ui_diag", "calibration page active=%d", lv_screen_active() == id(touch_cal_page)->obj);
    - action: end_touch_diagnostics
      then:
        - lambda: 'id(calibration_active) = false;'
        - lvgl.page.show: home_page
    - action: ui_state
      then:
        - lambda: |-
            const auto &cfg = screen_settings::current;
            ESP_LOGI("ui_diag", "settings standby=%d timeout=%d brightness=%d dim=%d night=%d start=%d end=%d night_dim=%d clock=%d clock24=%d home=%d idle_ms=%u use_idle_ms=%u dimmed=%d",
              cfg.standby_enabled, cfg.standby_seconds, cfg.brightness, cfg.standby_brightness,
              cfg.night_enabled, cfg.night_start, cfg.night_end, cfg.night_brightness,
              cfg.show_clock, cfg.clock_24h, cfg.home_on_standby,
              (unsigned)(millis() - id(last_touch_ms)), (unsigned)(millis() - id(last_use_ms)), id(display_dimmed));
            ESP_LOGI("ui_diag", "navigation page=%d runtime_detail=%d", id(tile_page),
              runtime_tiles::detail_root && !lv_obj_has_flag(runtime_tiles::detail_root, LV_OBJ_FLAG_HIDDEN));
            ESP_LOGI("ui_diag", "rotation=%u actual=%u", (unsigned)runtime_tiles::rotation, (unsigned)id(screen_lvgl).get_rotation());
            lv_area_t nav, grid;
            lv_obj_update_layout(id(home_page)->obj);
            lv_obj_get_coords(id(page_next), &nav);
            lv_obj_get_coords(id(tile_scroll), &grid);
            ESP_LOGI("ui_diag", "home=%d calibration=%d grid=%d,%d,%d,%d next=%d,%d,%d,%d",
                lv_screen_active() == id(home_page)->obj, lv_screen_active() == id(touch_cal_page)->obj,
                grid.x1, grid.y1, grid.x2, grid.y2, nav.x1, nav.y1, nav.x2, nav.y2);
    - action: preview_runtime_card
      variables:
        index: int
      then:
        - lambda: |-
            if (index < 0) { runtime_tiles::hide_detail(); if (runtime_tiles::dismiss) runtime_tiles::dismiss(); return; }
            if (runtime_tiles::enabled && index < (int)runtime_tiles::model.count) {
              runtime_tiles::active_index = index;
              auto &tile = runtime_tiles::model.tiles[index];
              auto domain = tile.domain();
              // Lights, fans and climate open the board's own card, like a long press does; covers (firmware 0.2.50+)
              // open the runtime card, as a tap does.
              if ((domain == "light" || domain == "fan" || domain == "climate") && runtime_tiles::detail) {
                tile.begin(millis(), true);
                runtime_tiles::detail(tile);
                return;
              }
              runtime_tiles::show_detail(index);
            }
    # A camera full screen from Home Assistant (firmware 0.2.57+), as a tap on its tile opens it; an empty entity closes
    # it. Only a camera on the screen's tiles or in a recent alert gets an image from ESP Screens.
    - action: preview_camera
      variables:
        entity: string
      then:
        - lambda: |-
            if (entity.empty()) { runtime_tiles::camera_close(); return; }
            id(last_use_ms) = millis();
            id(wake_display).execute();
            std::string name = entity;
            for (size_t i = 0; i < runtime_tiles::model.count; ++i)
              if (runtime_tiles::model.tiles[i].entity == entity) { name = runtime_tiles::model.tiles[i].name; break; }
            runtime_tiles::camera_open(entity, name);
    # The settings page from Home Assistant: `page` 0 is its menu, 1-4 open a group straight away
    # (Brightness, Night, Screen, This screen) and a negative page closes it and goes back to page 1.
    # Handy for support ("look at Screen -> Rotation") and for the render tests.
    - action: open_settings
      variables:
        page: int
      then:
        - lambda: |-
            if (page < 0) { id(go_home).execute(); return; }
            // Opened for someone to look at: Back to page 1 counts from now, as after a touch.
            id(last_use_ms) = millis();
            id(wake_display).execute();
            settings_screen::open((uint8_t) page);
            ESP_LOGI("settings", "page %d open from Home Assistant", page);

    # Diagnostics: the climate mode picker and the busy sheet of a tile, without touching the glass or HA.
    - action: preview_climate_picker
      then:
        - script.execute: open_climate_mode_picker
    - action: preview_busy
      variables:
        index: int
      then:
        - lambda: |-
            if (runtime_tiles::enabled && index >= 0 && index < (int)runtime_tiles::model.count) {
              runtime_tiles::model.tiles[index].begin(millis());
              if (runtime_tiles::refresh) runtime_tiles::refresh();
            }
    - action: light_controls_preview
      then:
        - script.execute: light_controls_preview
    - action: ui_self_test
      then:
        - script.execute: ui_self_test
    # Home Assistant automations: esphome.<device>_show_alert puts a card over the whole
    # screen (README, "Alert from an automation"); dismiss_alert removes it again.
    - action: show_alert
      variables:
        title: string
        subtitle: string
        icon: string
        color: string
        button_text: string
        timeout: int
        flash: bool
      then:
        - script.execute:
            id: alert_show
            title: !lambda 'return title;'
            subtitle: !lambda 'return subtitle;'
            icon: !lambda 'return icon;'
            color: !lambda 'return color;'
            button_text: !lambda 'return button_text;'
            timeout: !lambda 'return timeout;'
            flash: !lambda 'return flash;'
    - action: dismiss_alert
      then:
        - script.execute:
            id: alert_dismiss
            reason: "remote"
    # ESP Screen Manager 0.2.39+ hands a whole tile message over in one call instead of
    # base64 chunks in the text inbox; the inbox keeps showing the result.
    # Firmware 0.2.49+ also answers a caller that asks for it (app 0.2.57+ does for its pings): the same
    # status as the inbox, plus the revision of the layout on the screen. A call without a call id
    # (older apps) gets no answer, so ESPHome has nothing to warn about.
    - action: screen_message
      supports_response: optional
      variables:
        message: string
      then:
        - lambda: 'id(dashboard_inbox).publish_state(runtime_tiles::receive(message));'
        - if:
            condition:
              lambda: 'return call_id != 0;'
            then:
              - api.respond:
                  data: !lambda |-
                    root["status"] = id(dashboard_inbox).state;
                    root["rev"] = runtime_tiles::layout_rev;
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains-powered panel: no modem sleep, so HA updates and OTA arrive without beacon latency.
  power_save_mode: none
  ap:
    ssid: "Smartdisplay Fallback Hotspot"
    password: !secret ap_password

captive_portal:

# Camera images (firmware 0.2.57+): ESP Screen Manager serves each image already sized for this screen, as an uncompressed
# BMP on its own port on the LAN (screen_manager/app/camera_feed.py). ESPHome decodes a BMP piece by piece as it arrives,
# 4 KB per loop, where a JPEG of the full screen held the loop for 0.6 s; touch and drawing keep their turn. One image full
# screen and one in an alert's frame; runtime_tiles.h decides when they load and frees them when they close. Plain HTTP
# on the LAN, no certificates.
http_request:
  timeout: 4s
  verify_ssl: false

# The top-level online_image form that ESPHome 2026.6.2 (min_version) knows; 2026.7+ still reads it and suggests
# `image: - platform: online_image`, which this profile can use once min_version reaches 2026.7.
online_image:
  - id: camera_image
    url: "http://127.0.0.1/camera.bmp"  # set when a camera opens
    format: BMP
    type: RGB565
    buffer_size: 4096
    on_download_finished:
      - lambda: 'runtime_tiles::camera_loaded(false, cached);'
    on_error:
      - lambda: 'runtime_tiles::camera_failed(false);'
  - id: alert_image
    url: "http://127.0.0.1/camera.bmp"  # set when an alert brings an image
    format: BMP
    type: RGB565
    buffer_size: 4096
    on_download_finished:
      - lambda: 'runtime_tiles::camera_loaded(true, cached);'
    on_error:
      - lambda: 'runtime_tiles::camera_failed(true);'

interval:
  - interval: 250ms
    then:
      - lambda: |-
          runtime_tiles::tick();
          runtime_tiles::camera_tick();
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(climate_edit_pending) && !id(touch_down) && millis() - id(climate_edit_ms) >= 3000;'
          then:
            # The edit window is over: show what Home Assistant reports now. A closed card has
            # nothing to show, and a flag left set would redraw every tile each second.
            - lambda: |-
                if (lv_obj_has_flag(id(climate_detail_overlay), LV_OBJ_FLAG_HIDDEN)) { id(climate_edit_pending) = false; return; }
                if (!runtime_tiles::enabled) { if (!id(ui_refresh).is_running()) id(ui_refresh).execute(); return; }
                // Runtime tiles: a state that arrived during the window was held back.
                id(climate_edit_pending) = false;
                if (runtime_tiles::detail_update && runtime_tiles::active_index >= 0 &&
                    runtime_tiles::active_index < (int) runtime_tiles::model.count)
                  runtime_tiles::detail_update(runtime_tiles::model.tiles[runtime_tiles::active_index]);
      - if:
          condition:
            lambda: |-
              if (!screen_settings::current.standby_enabled) return false;
              if (id(display_dimmed) || id(touch_down) || id(calibration_active) || id(alert_active)) return false;
              return (millis() - id(last_touch_ms)) > (screen_settings::current.standby_seconds * 1000UL);
          then:
            - script.execute: dim_display
      - script.execute: back_to_page_1_when_due

time:
  - platform: homeassistant
    id: homeassistant_time
    # Refresh immediately on time sync; do not wait for an HA entity update.
    update_interval: 60s
    on_time_sync:
      then:
        - script.execute: apply_screen_settings
        - lambda: 'if (!id(ui_refresh).is_running()) id(ui_refresh).execute();'
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: apply_screen_settings
          - lambda: 'if (!id(ui_refresh).is_running()) id(ui_refresh).execute();'

globals:
  # Alert overlay (HA action show_alert): standby waits while one is up.
  - id: alert_active
    type: bool
    initial_value: 'false'
  - id: alert_title_text
    type: std::string
  # The alert's colour as the automation named it (a swatch's light value, 0 for the normal card).
  - id: alert_card_color
    type: uint32_t
    initial_value: '0'
  - id: alert_timeout_seconds
    type: int
    initial_value: '0'
  - id: alert_flash_requested
    type: bool
    initial_value: 'false'
  - id: rendered_frames
    type: uint32_t
    initial_value: '0'
  - id: calibration_active
    type: bool
    initial_value: 'false'
  - id: tile_page
    type: int
    initial_value: '0'
  - id: touch_down
    type: bool
    initial_value: 'false'
  - id: climate_edit_ms
    type: uint32_t
    initial_value: '0'
  - id: climate_edit_pending
    type: bool
    initial_value: 'false'
  - id: active_entity
    type: std::string
    restore_value: no

  - id: active_control_kind
    type: std::string
    restore_value: no

  - id: active_value_suffix
    type: std::string
    restore_value: no

  # Two clocks. last_touch_ms is the standby time: a touch, Wake, an alert ending and Auto standby on restart it.
  # last_use_ms is Back to page 1 (firmware 0.2.56+): only a touch, or Home Assistant opening the settings page.
  - id: last_touch_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_use_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Debounce for do_tile_action: protects against repeated events from
  # multiple separate press/release cycles for one physical touch (noise in
  # the resistive layer), causing the same HA action to fire multiple times
  # within a few hundred ms (observed: script.ambient_morning 6x in 8s).
  - id: last_action_entity
    type: std::string
    restore_value: no

  - id: last_action_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: display_dimmed
    type: bool
    restore_value: no
    initial_value: 'false'

  # Sleep from Home Assistant (0.2.45+): standby that also holds with Auto standby off,
  # until a tap, Wake or an alert wakes the screen.
  - id: sleep_requested
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: active_label_off
    type: std::string
    restore_value: no

  - id: active_label_on
    type: std::string
    restore_value: no

  - id: active_title
    type: std::string
    restore_value: no

  - id: active_icon_text
    type: std::string
    restore_value: no

  - id: active_brightness_pct
    type: int
    restore_value: no
    initial_value: '100'

  - id: active_supports_color
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: active_supports_temperature
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: active_color_detail_tab
    type: int
    restore_value: no
    initial_value: '0'

  - id: active_climate_current_x10
    type: int
    restore_value: no
    initial_value: '0'

  - id: active_climate_target_x10
    type: int
    restore_value: no
    initial_value: '200'

  - id: active_climate_humidity
    type: int
    restore_value: no
    initial_value: '-1'

  - id: active_climate_min_x10
    type: int
    restore_value: no
    initial_value: '50'

  - id: active_climate_max_x10
    type: int
    restore_value: no
    initial_value: '300'

  - id: active_climate_step_x10
    type: int
    restore_value: no
    initial_value: '5'

  - id: active_climate_mode
    type: std::string
    restore_value: no

  - id: active_climate_power_on
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: active_climate_fan_modes
    type: std::string
    restore_value: no

  - id: active_climate_fan_mode
    type: std::string
    restore_value: no

  - id: active_climate_swing_modes
    type: std::string
    restore_value: no

  - id: active_climate_swing_mode
    type: std::string
    restore_value: no

  - id: active_climate_supported_modes
    type: std::string
    restore_value: no

  # Room temperature (NAN when unknown), what the device does (hvac_action, runtime tiles only),
  # and whether Home Assistant reported a setpoint at all (heat_cool ranges do not).
  - id: active_climate_current
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: active_climate_action
    type: std::string
    restore_value: no

  - id: active_climate_target_known
    type: bool
    restore_value: no
    initial_value: 'false'


script:
  - id: capture_ui_snapshot
    mode: single
    then:
      - lambda: guition::snapshot_begin();
      - repeat:
          count: 240
          then:
            - lambda: guition::snapshot_next_row();
            - delay: 100ms
  # Render every overlay and both pages repeatedly without controlling devices.
  - id: ui_self_test
    mode: single
    then:
      - logger.log: "UI_TEST START: page/overlay render stress, no HA actions"
      - lambda: 'ESP_LOGI("ui_test", "Light sliders: %s", light_controls::self_test() ? "PASS" : "FAIL");'
      - lambda: 'id(calibration_active) = false;'
      - lvgl.page.show: home_page
      - script.execute: wake_display
      - repeat:
          count: 10
          then:
            - lambda: |-
                id(last_touch_ms) = millis();
                id(last_use_ms) = millis();
                static unsigned test_page=0;
                id(tile_page) = runtime_tiles::enabled ? test_page++ % runtime_tiles::page_count() : 1;
            - script.execute: show_tile_page
            - delay: 300ms
            - lambda: |-
                lv_obj_update_layout(id(tile_scroll));
                const int count = runtime_tiles::model.count;
                // Wide cards take two slots, so visibility follows the runtime packing.
                const bool paginated = runtime_tiles::enabled ? runtime_tiles::page_count() > 1 : count > 6;
                lv_obj_t* tiles[] = {id(tile1), id(tile2), id(tile3), id(tile4), id(tile5),
                                     id(tile6), id(tile7), id(tile8), id(tile9), id(tile10)};
                bool ok = guition::check_geometry(id(home_page)->obj);
                for (int i = 0; i < 10; ++i) {
                  bool visible = runtime_tiles::enabled ? i<6 && runtime_tiles::widgets[i].index<runtime_tiles::model.count : i < count && (paginated ? i >= 6 : i < 6);
                  ok = ok && (lv_obj_has_flag(tiles[i], LV_OBJ_FLAG_HIDDEN) != visible);
                }
                for (lv_obj_t* control : {id(page_prev), id(page_next), id(page_number)})
                  ok = ok && (lv_obj_has_flag(control, LV_OBJ_FLAG_HIDDEN) != paginated);
                lv_area_t nav, grid;
                lv_obj_get_coords(id(page_next), &nav);
                lv_obj_get_coords(id(tile_scroll), &grid);
                ok = ok && (!paginated || grid.y2 < nav.y1);
                if(runtime_tiles::enabled)ok = runtime_tiles::check_tile_geometry() && ok;
                ESP_LOGI("ui_test", "page_check=%s count=%d heap=%u frames=%u grid_bottom=%d nav_top=%d", ok ? "PASS" : "FAIL", count, (unsigned) esp_get_free_heap_size(), (unsigned) id(rendered_frames), grid.y2, nav.y1);
                id(tile_page) = 0;
            - script.execute: show_tile_page
            - delay: 150ms
            - lvgl.widget.show: brightness_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(brightness_overlay));
            - lvgl.widget.hide: brightness_overlay
            - lvgl.widget.show: color_detail_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(color_detail_overlay));
            - lvgl.widget.hide: color_detail_overlay
            - lvgl.widget.show: climate_detail_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(climate_detail_overlay));
            - lvgl.widget.hide: climate_detail_overlay
            - lvgl.widget.show: climate_mode_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(climate_mode_overlay));
            - lvgl.widget.hide: climate_mode_overlay
            - lvgl.widget.show: alert_overlay
            - delay: 150ms
            - lvgl.widget.hide: alert_overlay
      - lambda: 'if (!id(ui_refresh).is_running()) id(ui_refresh).execute();'
      - logger.log: "UI_TEST COMPLETE"

  - id: show_tile_page
    then:
      - lambda: |-
          if(runtime_tiles::enabled){
            runtime_tiles::show_page(id(tile_page),id(page_prev),id(page_next),id(page_number));
            return;
          }
          lv_obj_t* tiles[] = {id(tile1), id(tile2), id(tile3), id(tile4), id(tile5),
                               id(tile6), id(tile7), id(tile8), id(tile9), id(tile10)};
          const int rows[] = {${GRID_ROW1_Y}, ${GRID_ROW2_Y}, ${GRID_ROW3_Y}};
          const int count = runtime_tiles::model.count;
          const bool paginated = count > 6;
          if (!paginated) id(tile_page) = 0;
          for (lv_obj_t* control : {id(page_prev), id(page_next), id(page_number)}) {
            if (paginated) lv_obj_clear_flag(control, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(control, LV_OBJ_FLAG_HIDDEN);
          }
          for (int i = 0; i < 10; ++i) {
            bool visible = i < count && (id(tile_page) == 0 ? i < 6 : i >= 6);
            if (visible) {
              lv_obj_set_y(tiles[i], rows[(i < 6 ? i : i - 6) / 2]);
              lv_obj_clear_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            }
          }
          lv_label_set_text(id(page_number), id(tile_page) == 0 ? "1 / 2" : "2 / 2");
          if (id(tile_page) == 0) {
            lv_obj_add_state(id(page_prev), LV_STATE_DISABLED);
            lv_obj_clear_state(id(page_next), LV_STATE_DISABLED);
          } else {
            lv_obj_clear_state(id(page_prev), LV_STATE_DISABLED);
            lv_obj_add_state(id(page_next), LV_STATE_DISABLED);
          }

  # Runtime changes do not count as touches and do not reset the idle timer.
  - id: apply_screen_settings
    mode: restart
    then:
      - lambda: |-
          const auto &settings = screen_settings::current;
          // Dark mode (firmware 0.2.54+): a look the screen already has costs nothing.
          theme::set_dark(settings_screen::dark_mode != 0);
          const auto requested_rotation = (runtime_tiles::rotation + ${RUNTIME_ROTATION_OFFSET}) % 360;
          if(runtime_tiles::enabled && static_cast<unsigned>(id(screen_lvgl).get_rotation())!=requested_rotation){
            cyd::touch_guard.consume();
            if(lv_indev_get_act())lv_indev_wait_release(lv_indev_get_act());
            id(screen_lvgl).set_rotation(static_cast<esphome::display::DisplayRotation>(requested_rotation));
          }
          // Auto standby off wakes the screen, but not out of a Sleep pressed in Home Assistant.
          if (id(display_dimmed) && !settings.standby_enabled && !id(sleep_requested)) {
            id(display_dimmed) = false;
          }
          auto now = id(homeassistant_time).now();
          const int minute = now.is_valid() ? now.hour * 60 + now.minute : -1;
          const int level = id(display_dimmed) ? settings.dim_level(minute) : settings.brightness;
          // Standby dims slowly (ESPHome's transition); waking is quick.
          id(set_backlight).execute(level, id(display_dimmed) ? 1500 : 300);
          if (id(display_dimmed)) { lv_obj_clear_flag(id(dim_wake_overlay), LV_OBJ_FLAG_HIDDEN); lv_obj_move_foreground(id(dim_wake_overlay)); }
          else lv_obj_add_flag(id(dim_wake_overlay), LV_OBJ_FLAG_HIDDEN);
          // The setting numbers and times only publish a changed value (HA keeps identical states anyway); the
          // switches publish their own changes. An open settings page shows a change from Home Assistant too.
          // A number without a state publishes too: a night brightness of 0 equals the number's initial state and
          // stayed "unknown" in Home Assistant before firmware 0.2.50.
          for (auto [entity, value] : {std::make_pair(id(setting_brightness), settings.brightness),
                                       std::make_pair(id(setting_standby_brightness), settings.standby_brightness),
                                       std::make_pair(id(setting_night_brightness), settings.night_brightness),
                                       std::make_pair(id(setting_standby_seconds), settings.standby_seconds),
                                       std::make_pair(id(setting_auto_home_seconds), settings_screen::auto_home_seconds)}) {
            if (!entity->has_state() || entity->state != value) entity->publish_state(value);
          }
          for (auto [entity, minutes] : {std::make_pair(id(setting_night_start), settings.night_start), std::make_pair(id(setting_night_end), settings.night_end)}) {
            if (!entity->has_state() || entity->hour * 60 + entity->minute != minutes) entity->update();
          }
          const auto shown_rotation = id(setting_rotation)->active_index();
          if (!id(setting_rotation)->has_state() || !shown_rotation.has_value() || *shown_rotation != (size_t) (settings_screen::rotation / 90)) id(setting_rotation)->update();
          settings_screen::refresh();
          if (!id(ui_refresh).is_running()) id(ui_refresh).execute();

  # Every card closes through runtime_tiles::dismiss (set in on_boot): the runtime detail card, the light,
  # colour and climate overlays, and active_entity, which the swipe guard reads.
  - id: close_cards
    then:
      - lambda: 'if (runtime_tiles::dismiss) runtime_tiles::dismiss();'

  # Everything back to the overview: the settings page, every card and the first page of tiles.
  # Used by standby, by the "Back to page 1" timeout and by the Home Assistant action.
  - id: go_home
    then:
      - lambda: 'settings_screen::close();'
      - script.execute: close_cards
      - lambda: 'id(tile_page) = 0;'
      - script.execute: show_tile_page

  # Back to page 1 by itself (0.2.44+). A card, a settings page or a second page left open keeps
  # showing what someone looked at minutes ago; after this long the screen is a screen again.
  # Independent of standby, which may be off or much later; paused while the screen is in standby.
  # The time runs from the last touch (last_use_ms, firmware 0.2.56+): Wake, an alert or Auto standby
  # light the screen and restart the standby time, but nobody used a page. Checked every second and by Wake.
  - id: back_to_page_1_when_due
    then:
      - if:
          condition:
            lambda: |-
              if (!runtime_tiles::auto_home || id(touch_down) || id(calibration_active) || id(alert_active)) return false;
              if (id(display_dimmed)) return false;
              bool away = settings_screen::visible() || runtime_tiles::camera_visible() || !id(active_entity).empty() || id(tile_page) != 0 ||
                          (runtime_tiles::detail_root && !lv_obj_has_flag(runtime_tiles::detail_root, LV_OBJ_FLAG_HIDDEN));
              return away && (millis() - id(last_use_ms)) > (uint32_t) runtime_tiles::auto_home_seconds * 1000UL;
          then:
            - script.execute: go_home

  # ---------- ALERT (HA action show_alert) ----------
  # The screen wakes, keeps its normal brightness and shows the card until OK or the
  # timeout (0: until OK); the standby interval waits on alert_active. A new alert
  # replaces the current one; every ending reports itself as esphome.screen_alert.
  - id: alert_show
    mode: restart
    parameters:
      title: string
      subtitle: string
      icon: string
      color: string
      button_text: string
      timeout: int
      flash: bool
    then:
      - lambda: |-
          if (id(alert_active)) id(alert_report).execute("replaced");
          // An alert is the one thing that outranks the settings page, so that closes first.
          settings_screen::close();
          // An open camera closes; the card makes room for an image the app announced for this alert.
          runtime_tiles::alert_prepare();
          const auto alert = screen_alert::make(title, subtitle, icon, color, button_text, timeout, flash, ${ALERT_TITLE_MAX}, ${ALERT_SUBTITLE_MAX}, ${ALERT_BUTTON_MAX});
          id(alert_active) = true;
          id(alert_title_text) = alert.title;
          id(alert_timeout_seconds) = alert.timeout_seconds;
          id(alert_flash_requested) = alert.flash;
          lv_label_set_text(id(alert_icon), alert.icon.c_str());
          lv_label_set_text(id(alert_title), alert.title.c_str());
          lv_label_set_text(id(alert_subtitle), alert.subtitle.c_str());
          lv_label_set_text(id(alert_ok_label), alert.button.c_str());
          id(alert_card_color) = alert.color;
          lv_obj_set_style_bg_color(id(alert_card), lv_color_hex(theme::surface(alert.color)), LV_PART_MAIN);
          ESP_LOGI("alert", "show \"%s\" timeout=%d flash=%d", alert.title.c_str(), alert.timeout_seconds, (int) alert.flash);
      - script.execute: wake_display
      - lvgl.widget.show: alert_overlay
      - script.stop: alert_timeout
      - if:
          condition:
            lambda: 'return id(alert_flash_requested);'
          then:
            - script.execute: alert_flash
      - if:
          condition:
            lambda: 'return id(alert_timeout_seconds) > 0;'
          then:
            - script.execute:
                id: alert_timeout
                seconds: !lambda 'return id(alert_timeout_seconds);'

  - id: alert_dismiss
    parameters:
      reason: string
    then:
      - if:
          condition:
            lambda: 'return id(alert_active);'
          then:
            - lambda: |-
                id(alert_active) = false;
                id(last_touch_ms) = millis();
                runtime_tiles::alert_clear();
                ESP_LOGI("alert", "dismissed: %s", reason.c_str());
            - lvgl.widget.hide: alert_overlay
            - script.stop: alert_timeout
            - script.stop: alert_flash
            - lambda: 'id(set_backlight).execute(screen_settings::current.brightness, 80);'
            - script.execute:
                id: alert_report
                action: !lambda 'return reason;'

  # Four backlight blinks when the alert arrives; the screen then stays on as usual.
  - id: alert_flash
    mode: restart
    then:
      - repeat:
          count: 4
          then:
            - lambda: 'id(set_backlight).execute(0, 60);'
            - delay: 140ms
            - lambda: 'id(set_backlight).execute(screen_settings::current.brightness, 60);'
            - delay: 180ms

  - id: alert_timeout
    mode: restart
    parameters:
      seconds: int
    then:
      - delay: !lambda 'return static_cast<uint32_t>(seconds) * 1000UL;'
      - script.execute:
          id: alert_dismiss
          reason: "timeout"

  # Home Assistant adds device_id; action is ok, timeout, replaced or remote.
  - id: alert_report
    parameters:
      action: string
    then:
      - homeassistant.event:
          event: esphome.screen_alert
          data:
            action: !lambda 'return action;'
            title: !lambda 'return id(alert_title_text);'
            screen: !lambda 'return App.get_name();'

  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          id(last_touch_ms) = millis();
          id(display_dimmed) = false;
          id(sleep_requested) = false;
          // Almost instant brightness-up. ESPHome's default is 1s, and that feels sluggish
          // when you touch the screen and are waiting on light.
          id(set_backlight).execute(screen_settings::current.brightness, 80);
      - lvgl.widget.hide: dim_wake_overlay
      - script.execute: close_cards

  # One owner for the backlight level, through ESPHome's own light transition (firmware 0.2.57+). Firmware 0.2.13-0.2.56
  # stepped the duty with the LEDC hardware fader by reaching into ESPHome's LEDC output, which ESPHome 2026.8 made final;
  # a new call interrupts the running transition from where it is, as ESPHome does for any light.
  - id: set_backlight
    mode: restart
    parameters:
      level: int
      ms: int
    then:
      - lambda: id(back_light).turn_on().set_transition_length(ms).set_brightness(level / 100.0f).perform();

  # Standby: the standby time ran out (the 1 s interval checks Auto standby) or Sleep was pressed.
  # The settings page and every card close; with "also on standby" the screen goes back to page 1 too.
  - id: dim_display
    mode: restart
    then:
      - lambda: |-
          id(display_dimmed) = true;
          id(apply_screen_settings).execute();
      - if:
          condition:
            lambda: 'return screen_settings::current.home_on_standby;'
          then:
            - script.execute: go_home
          else:
            - lambda: 'settings_screen::close();'
            - script.execute: close_cards

  # A -/+ tap on the climate card: the number follows at once, the call waits for the last tap.
  # Holding a key steps three times a second.
  - id: climate_adjust_target
    parameters:
      direction: int
      held: bool
    then:
      - lambda: |-
          if (held && millis() - id(climate_edit_ms) < 300) return;
          int step_x10 = std::max(5, id(active_climate_step_x10));
          int next = cyd::quantize_temperature(id(active_climate_target_x10) + direction * step_x10,
                                               id(active_climate_min_x10), id(active_climate_max_x10), step_x10);
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
          if (next == id(active_climate_target_x10) && id(active_climate_target_known)) return;
          id(active_climate_target_x10) = next;
          id(active_climate_target_known) = true;
          id(climate_card_refresh).execute();
          id(climate_target_send).execute(id(active_entity), next / 10.0f);

  # One set_temperature for a series of taps: every tap restarts the wait with the newest value.
  # Entity and value travel along, so leaving the card right after a tap still sends it.
  - id: climate_target_send
    mode: restart
    parameters:
      entity: string
      value: float
    then:
      - delay: 700ms
      - if:
          condition:
            lambda: 'return runtime_tiles::fresh() && !entity.empty();'
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: !lambda "return entity;"
                  temperature: !lambda "return value;"

  # Draws the climate card from the active_climate_* globals: status line, setpoint, -/+ and mode keys.
  - id: climate_card_refresh
    then:
      - lambda: |-
          auto lower = [](std::string v) {
            for (char &c : v) { if (c >= 'A' && c <= 'Z') c = (char)(c - 'A' + 'a'); }
            return v;
          };
          std::string mode = lower(id(active_climate_mode));
          bool off = mode == "off" || mode.empty() || mode == "unknown" || mode == "unavailable";
          // What the device does (Heating), else its mode (Heat); then the room.
          std::string status = off ? std::string("Off") : std::string(tile_controls::climate_action_text(lower(id(active_climate_action))));
          if (status.empty()) status = tile_controls::climate_mode_text(mode);
          char part[32];
          if (std::isfinite(id(active_climate_current))) { snprintf(part, sizeof(part), " · Now %.1f°", id(active_climate_current)); status += part; }
          if (id(active_climate_humidity) >= 0) { snprintf(part, sizeof(part), " · %d%%", id(active_climate_humidity)); status += part; }
          lv_label_set_text(id(climate_current_label), status.c_str());

          int target = id(active_climate_target_x10);
          std::string value = id(active_climate_target_known)
              ? tile_controls::format_value(target / 10.0f, id(active_climate_step_x10) / 10.0f, "°") : std::string("--");
          lv_label_set_text(id(climate_target_label), value.c_str());
          lv_obj_set_style_text_color(id(climate_target_label), theme::color(off ? theme::OFF : theme::INK), LV_PART_MAIN);
          auto enable = [](lv_obj_t *key, bool on) {
            if (on) lv_obj_remove_state(key, LV_STATE_DISABLED); else lv_obj_add_state(key, LV_STATE_DISABLED);
          };
          enable(id(climate_minus_button), !id(active_climate_target_known) || target > id(active_climate_min_x10));
          enable(id(climate_plus_button), !id(active_climate_target_known) || target < id(active_climate_max_x10));

          // One key per supported mode, in Home Assistant's order. Fan and swing add "more"; with it
          // five mode keys fit, and when a sixth mode is in use it takes the last place.
          std::string supported = lower(id(active_climate_supported_modes));
          auto has = [&](const char *m) {
            return supported.find(std::string("\"") + m + "\"") != std::string::npos ||
                   supported.find(std::string("'") + m + "'") != std::string::npos;
          };
          struct Key { lv_obj_t *obj; const char *mode; };
          const Key keys[] = {{id(cmkey_auto), "auto"}, {id(cmkey_heat_cool), "heat_cool"}, {id(cmkey_heat), "heat"},
                              {id(cmkey_cool), "cool"}, {id(cmkey_dry), "dry"}, {id(cmkey_fan_only), "fan_only"}};
          // The Guition shows fan and swing on their own card below, so no "more" key.
          bool more = false;
          const Key *visible[6];
          unsigned count = 0, room = more ? 5 : 6;
          for (const auto &k : keys) if (has(k.mode)) visible[count++] = &k;
          if (count > room) {
            for (unsigned i = room; i < count; ++i) if (mode == visible[i]->mode) visible[room - 1] = visible[i];
            count = room;
          }
          for (const auto &k : keys) {
            bool show = false;
            for (unsigned i = 0; i < count; ++i) show = show || visible[i] == &k;
            if (show) lv_obj_remove_flag(k.obj, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(k.obj, LV_OBJ_FLAG_HIDDEN);
            bool selected = show && !off && mode == k.mode;
            uint32_t color = tile_controls::mode_color(k.mode);
            lv_obj_set_style_bg_color(k.obj, selected ? lv_color_hex(color) : theme::color(theme::CARD), LV_PART_MAIN);
            lv_obj_set_style_border_color(k.obj, selected ? lv_color_hex(color) : theme::color(theme::LINE), LV_PART_MAIN);
            lv_obj_set_style_text_color(lv_obj_get_child(k.obj, 0), theme::color(selected ? theme::ON_ACCENT : theme::SLATE), LV_PART_MAIN);
          }
          if (more) lv_obj_remove_flag(id(cmkey_more), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(cmkey_more), LV_OBJ_FLAG_HIDDEN);
          // One mode is no choice: the power key already turns it on and off.
          const bool show_keys = count > 1 || more;
          if (show_keys) lv_obj_remove_flag(id(climate_mode_keys), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(climate_mode_keys), LV_OBJ_FLAG_HIDDEN);

          // Fan and swing rows, in the entity's own names and order.
          climate_card::Row settings[2];
          int rows = 0;
          if (!cyd::list_item(id(active_climate_fan_modes), 0).empty())
            settings[rows++] = {'f', "\U000F0210", id(active_climate_fan_modes), id(active_climate_fan_mode)};
          if (!cyd::list_item(id(active_climate_swing_modes), 0).empty())
            settings[rows++] = {'s', "\U000F1C91", id(active_climate_swing_modes), id(active_climate_swing_mode)};
          // One layout per card: the setpoint gives room to the mode keys and the settings below it,
          // and a card with nothing below keeps the setpoint centred.
          static int laid_out = -1;
          if (laid_out != rows * 2 + show_keys) {
            laid_out = rows * 2 + show_keys;
            struct Layout { int status, card_y, card_h, key, number_y, caption_y, modes_y, modes_h, settings_y, edge, row_h, gap; };
            static const Layout layouts[6] = {
              // no mode keys: 0, 1, 2 rows
              {92, 180, 200, 116, -14, 46, 0, 0, 0, 14, 48, 10},
              {92, 140, 200, 116, -14, 46, 0, 0, 364, 14, 48, 10},
              {90, 130, 180, 108, -12, 42, 0, 0, 330, 14, 46, 10},
              // mode keys: 0, 1, 2 rows
              {92, 136, 200, 116, -14, 46, 364, 76, 0, 14, 48, 10},
              {90, 126, 170, 108, -12, 42, 312, 68, 394, 12, 44, 8},
              {86, 118, 140, 96, -10, 36, 270, 60, 342, 12, 42, 8},
            };
            const Layout &l = layouts[(show_keys ? 3 : 0) + rows];
            lv_obj_set_y(id(climate_current_label), l.status);
            lv_obj_set_y(id(climate_setpoint_card), l.card_y);
            lv_obj_set_height(id(climate_setpoint_card), l.card_h);
            for (lv_obj_t *button : {id(climate_minus_button), id(climate_plus_button)}) {
              lv_obj_set_size(button, l.key, l.key);
              lv_obj_set_style_radius(button, l.key / 2, LV_PART_MAIN);
            }
            lv_obj_set_y(id(climate_target_label), l.number_y);
            lv_obj_set_y(id(climate_set_label), l.caption_y);
            if (show_keys) {
              lv_obj_set_y(id(climate_mode_keys), l.modes_y);
              lv_obj_set_height(id(climate_mode_keys), l.modes_h);
              for (lv_obj_t *mode_key : {id(cmkey_auto), id(cmkey_heat_cool), id(cmkey_heat), id(cmkey_cool), id(cmkey_dry), id(cmkey_fan_only), id(cmkey_more)}) {
                lv_obj_set_height(mode_key, l.modes_h);
                lv_obj_set_style_radius(mode_key, l.modes_h / 2, LV_PART_MAIN);
              }
            }
            lv_obj_set_y(id(climate_settings_card), l.settings_y);
            climate_card::look.edge = l.edge;
            climate_card::look.row_h = l.row_h;
            climate_card::look.gap = l.gap;
          }
          climate_card::show(settings, rows);
          id(climate_power_refresh).execute();

  # Opens the mode picker. Hides modes the entity doesn't support and marks
  # the current one, so you see where you stand before you pick something.
  # Opens the vacuum controls and remembers which entity it concerns.

  # A standalone command: start, pause, stop or return_to_base.

  # Suction power is a separate axis, apart from start/stop.

  - id: open_climate_mode_picker
    mode: restart
    then:
      - lambda: |-
          auto lower = [](std::string v) {
            for (char &c : v) { if (c >= 'A' && c <= 'Z') c = (char)(c - 'A' + 'a'); }
            return v;
          };
          std::string supported = lower(id(active_climate_supported_modes));
          std::string current = lower(id(active_climate_mode));

          auto has = [&](const char* m) {
            std::string mode(m);
            if (supported.empty() || supported == "unknown" || supported == "unavailable") return false;
            return supported.find("'" + mode + "'") != std::string::npos ||
                   supported.find("\"" + mode + "\"") != std::string::npos;
          };
          auto apply = [&](lv_obj_t* btn, const char* m) {
            if (has(m)) lv_obj_clear_flag(btn, LV_OBJ_FLAG_HIDDEN);
            else        lv_obj_add_flag(btn, LV_OBJ_FLAG_HIDDEN);
            bool selected = (current == std::string(m));
            lv_obj_set_style_bg_color(btn, theme::color(selected ? theme::ACCENT_BRIGHT : theme::CARD), LV_PART_MAIN);
            lv_obj_set_style_text_color(lv_obj_get_child(btn, 0), theme::color(selected ? theme::ON_ACCENT : theme::INK), LV_PART_MAIN);
          };
          apply(id(cmode_off), "off");
          apply(id(cmode_heat), "heat");
          apply(id(cmode_cool), "cool");
          apply(id(cmode_heat_cool), "heat_cool");
          apply(id(cmode_auto), "auto");
          apply(id(cmode_dry), "dry");
          apply(id(cmode_fan_only), "fan_only");
          // Fan and swing rows: the entity's own mode names, at most four each, as Home Assistant reports them.
          auto pretty = [](std::string raw) { if (!raw.empty() && raw[0] >= 'a' && raw[0] <= 'z') raw[0] = (char)(raw[0] - 'a' + 'A'); return raw; };
          auto fill = [&](lv_obj_t *title, lv_obj_t *chips[4], const std::string &modes, const std::string &current_mode) {
            unsigned shown = 0;
            for (unsigned i = 0; i < 4; ++i) {
              std::string raw = cyd::list_item(modes, i);
              if (raw.empty()) { lv_obj_add_flag(chips[i], LV_OBJ_FLAG_HIDDEN); continue; }
              lv_obj_clear_flag(chips[i], LV_OBJ_FLAG_HIDDEN); ++shown;
              lv_label_set_text(lv_obj_get_child(chips[i], 0), pretty(raw).c_str());
              lv_obj_set_style_bg_color(chips[i], theme::color(raw == current_mode ? theme::ACCENT_BRIGHT : theme::CARD), LV_PART_MAIN);
              lv_obj_set_style_text_color(lv_obj_get_child(chips[i], 0), theme::color(raw == current_mode ? theme::ON_ACCENT : theme::INK), LV_PART_MAIN);
            }
            if (shown) lv_obj_clear_flag(title, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(title, LV_OBJ_FLAG_HIDDEN);
          };
          lv_obj_t *fan_chips[4] = {id(cfan_0), id(cfan_1), id(cfan_2), id(cfan_3)};
          lv_obj_t *swing_chips[4] = {id(cswing_0), id(cswing_1), id(cswing_2), id(cswing_3)};
          fill(id(cfan_title), fan_chips, id(active_climate_fan_modes), id(active_climate_fan_mode));
          fill(id(cswing_title), swing_chips, id(active_climate_swing_modes), id(active_climate_swing_mode));
      - lvgl.widget.show: climate_mode_overlay

  # Sets exactly one mode. No intermediate steps, so no unwanted
  # commands to the heat pump along the way.
  # Fan and swing modes from the picker: one call with the entity's own mode name.
  - id: set_climate_fan_mode
    mode: restart
    parameters:
      index: int
    then:
      - lambda: |-
          id(active_climate_fan_mode) = cyd::list_item(id(active_climate_fan_modes), index);
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
          id(climate_card_refresh).execute();
      - lvgl.widget.hide: climate_mode_overlay
      - if:
          condition:
            lambda: 'return runtime_tiles::fresh() && !id(active_climate_fan_mode).empty();'
          then:
            - homeassistant.action:
                action: climate.set_fan_mode
                data:
                  entity_id: !lambda "return id(active_entity);"
                  fan_mode: !lambda "return id(active_climate_fan_mode);"
  - id: set_climate_swing_mode
    mode: restart
    parameters:
      index: int
    then:
      - lambda: |-
          id(active_climate_swing_mode) = cyd::list_item(id(active_climate_swing_modes), index);
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
          id(climate_card_refresh).execute();
      - lvgl.widget.hide: climate_mode_overlay
      - if:
          condition:
            lambda: 'return runtime_tiles::fresh() && !id(active_climate_swing_mode).empty();'
          then:
            - homeassistant.action:
                action: climate.set_swing_mode
                data:
                  entity_id: !lambda "return id(active_entity);"
                  swing_mode: !lambda "return id(active_climate_swing_mode);"

  # Quick on/off in the climate card; climate.turn_on restores the last mode in Home Assistant.
  - id: climate_power_toggle
    mode: restart
    then:
      - lambda: |-
          std::string mode = id(active_climate_mode);
          for (char &c : mode) if (c >= 'A' && c <= 'Z') c = (char)(c - 'A' + 'a');
          id(active_climate_power_on) = mode == "off" || mode.empty() || mode == "unknown";
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
          if (!id(active_climate_power_on)) id(active_climate_mode) = "off";
          id(climate_card_refresh).execute();
      - if:
          condition:
            lambda: 'return runtime_tiles::fresh() && id(active_climate_power_on);'
          then:
            - homeassistant.action:
                action: climate.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
      - if:
          condition:
            lambda: 'return runtime_tiles::fresh() && !id(active_climate_power_on);'
          then:
            - homeassistant.action:
                action: climate.turn_off
                data:
                  entity_id: !lambda "return id(active_entity);"

  # The power key lights up while the device runs in any mode.
  - id: climate_power_refresh
    mode: restart
    then:
      - lambda: |-
          std::string mode = id(active_climate_mode);
          for (char &c : mode) if (c >= 'A' && c <= 'Z') c = (char)(c - 'A' + 'a');
          bool on = !(mode == "off" || mode.empty() || mode == "unknown" || mode == "unavailable");
          if (id(climate_edit_pending)) on = id(active_climate_power_on);
          lv_obj_set_style_bg_color(id(climate_power_button), theme::color(on ? theme::ACCENT_TINT : theme::KEY), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(climate_power_icon), theme::color(on ? theme::ACCENT_ICON : theme::ICON_OFF), LV_PART_MAIN);

  - id: set_climate_mode
    mode: restart
    parameters:
      mode: string
    then:
      - lambda: |-
          id(climate_edit_ms) = millis();
          id(climate_edit_pending) = true;
          id(active_climate_mode) = mode;
          // The action line would still say what the old mode did.
          id(active_climate_action).clear();
          id(active_climate_power_on) = mode != "off";
          id(climate_card_refresh).execute();
      - lvgl.widget.hide: climate_mode_overlay
      - if:
          condition:
            lambda: 'return runtime_tiles::fresh();'
          then:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: !lambda "return id(active_entity);"
                  hvac_mode: !lambda "return id(active_climate_mode);"

  # Isolated 40-second preview; every light commit is suppressed in the helper.
  - id: light_controls_preview
    mode: single
    then:
      - script.execute: wake_display
      - lambda: |-
          light_controls::demo = true;
          light_controls::fallback.minimum = 2000;
          light_controls::fallback.maximum = 6500;
          light_controls::fallback.kelvin = 3000;
          light_controls::fallback.hue = 200;
          light_controls::open("diagnostic", true, true, 75);
          lv_label_set_text(id(color_detail_title), "Example lamp");
      - lvgl.widget.hide: color_close_button
      - lvgl.widget.show: color_detail_overlay
      - delay: 40s
      - lvgl.widget.hide: color_detail_overlay
      - lvgl.widget.show: color_close_button
      - lambda: 'light_controls::demo = false; light_controls::fallback = light_controls::State{};'

  - id: open_color_detail
    mode: restart
    then:
      - lambda: |-
          lv_label_set_text(id(color_detail_title), id(active_title).c_str());
          light_controls::open(id(active_entity), id(active_supports_color), id(active_supports_temperature), id(active_brightness_pct));
      - lvgl.widget.hide: brightness_overlay
      - lvgl.widget.show: color_detail_overlay

  - id: color_brightness_commit
    parameters:
      value: int
    then:
      - lambda: 'id(active_brightness_pct) = value;'
      - if:
          condition:
            lambda: 'return runtime_tiles::fresh() && id(active_entity).rfind("light.", 0) == 0;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
                  brightness_pct: !lambda "return value;"

  - id: set_light_hue
    parameters:
      value: int
    then:
      - if:
          condition:
            lambda: 'return runtime_tiles::fresh() && id(active_supports_color) && id(active_entity).rfind("light.", 0) == 0;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
                data_template:
                  hs_color: "{{ [hue | int, 100] }}"
                variables:
                  hue: !lambda "return light_controls::clamp(value, 0, 360);"

  - id: set_light_color_temperature
    parameters:
      kelvin: int
    then:
      - if:
          condition:
            lambda: 'return runtime_tiles::fresh() && id(active_supports_temperature) && id(active_entity).rfind("light.", 0) == 0 && light_controls::active->temperature_ready();'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
                  color_temp_kelvin: !lambda "return light_controls::clamp(kelvin, light_controls::active->minimum, light_controls::active->maximum);"

  - id: slider_preview
    parameters:
      value: int
    then:
      - lambda: |-
          char buf[20];
          snprintf(buf, sizeof(buf), "%d%s", value, id(active_value_suffix).c_str());
          lv_label_set_text(id(overlay_value), buf);
          int pct = value;
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          std::string value_text;

          if (id(active_control_kind) == "cover_position") {
            std::string closed_label = id(active_label_off).c_str();
            std::string open_label = id(active_label_on).c_str();

            if (pct <= 0) {
              value_text = closed_label;
            } else if (pct >= 100) {
              value_text = open_label;
            } else {
              char buf[40];
              snprintf(buf, sizeof(buf), "%s - %d%%", open_label.c_str(), pct);
              value_text = buf;
            }
          } else {
            if (pct <= 0) {
              value_text = id(active_label_off).c_str();
            } else {
              char buf[20];
              snprintf(buf, sizeof(buf), "%d%s", pct, id(active_value_suffix).c_str());
              value_text = buf;
            }
          }

          lv_label_set_text(id(overlay_value), value_text.c_str());


  - id: slider_commit
    parameters:
      value: int
    then:
      - if:
          condition:
            lambda: |-
              return id(active_control_kind) == "light_brightness";
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda "return id(active_entity);"
                  brightness_pct: !lambda "return value;"
          else:
            - if:
                condition:
                  lambda: |-
                    return id(active_control_kind) == "fan_percentage";
                then:
                  - if:
                      condition:
                        lambda: "return value <= 0;"
                      then:
                        - homeassistant.action:
                            action: fan.turn_off
                            data:
                              entity_id: !lambda "return id(active_entity);"
                      else:
                        - homeassistant.action:
                            action: fan.turn_on
                            data:
                              entity_id: !lambda "return id(active_entity);"
                        - delay: 150ms
                        - homeassistant.action:
                            action: fan.set_percentage
                            data:
                              entity_id: !lambda "return id(active_entity);"
                              percentage: !lambda "return value;"
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(active_control_kind) == "cover_position";
                      then:
                        - homeassistant.action:
                            action: cover.set_cover_position
                            data:
                              entity_id: !lambda "return id(active_entity);"
                              position: !lambda "return value;"

  # ----------------------------------------------------------
  # do_tile_action
  #
  # Centralized handler for executing Home Assistant actions
  # triggered by tile taps.
  #
  # Parameters
  # - tile_type: light | fan | switch | scene | script | cover
  # - tap_action: auto | toggle | activate | fan_toggle_preset
  # - service: optional Home Assistant service override
  # - entity_id: target entity
  # - param_key / param_val: optional parameters for custom services
  # - was_on: previous entity state (pass false for longpress actions)
  #
  # Behavior
  #
  # toggle
  #   -> toggles the entity
  #   light.toggle / fan.toggle / switch.toggle / cover.open_cover|close_cover (based on was_on)
  #
  # activate
  #   -> activates entity
  #   scene.turn_on / script.turn_on / light.turn_on / fan.turn_on / cover.open_cover
  #
  # auto
  #   -> resolves automatically based on tile_type:
  #        light/switch/fan/cover -> toggle
  #        scene/script           -> activate
  #
  # fan_toggle_preset
  #   -> if fan was ON: fan.turn_off
  #   -> if fan was OFF:
  #        fan.turn_on
  #        wait 150ms
  #        fan.set_preset_mode(param_val)
  #
  # Custom service
  #   If "service" is set, it will be called directly.
  #   param_key / param_val may be used for parameters
  #   like preset_mode, brightness_pct, percentage, etc.
  # ----------------------------------------------------------

  - id: open_value_overlay
    parameters:
      title: string
      entity: string
      tile_type: string
      longpress_mode: string
      was_on: bool
      off_value: int
      brightness_value: float
      percentage_value: float
      position_value: float
      icon_text: string
      label_off: string
      label_on: string
      supported_color_modes: string
      climate_current_temperature: float
      climate_target_temperature: float
      climate_humidity: float
      climate_mode: string
      climate_supported_modes: string
      climate_min_temp: string
      climate_max_temp: string
      climate_step: string
    then:
      - lambda: |-
          std::string mode = longpress_mode;
          auto contains_mode = [](const std::string& modes, const std::string& needle) {
            return modes.find(needle) != std::string::npos;
          };
          if (mode == "auto") {
            if (tile_type == "light") mode = "brightness";
            else if (tile_type == "fan") mode = "percentage";
            else if (tile_type == "cover") mode = "cover_position";
            else if (tile_type == "climate") mode = "climate_temperature";
            else mode = "none";
          }

          if (mode == "none") return;

          id(active_entity) = entity;
          id(active_value_suffix) = " %";
          id(active_label_off) = label_off;
          id(active_label_on) = label_on;
          id(active_title) = title;
          id(active_icon_text) = icon_text;
          id(active_supports_color) = false;
          id(active_supports_temperature) = false;
          lv_obj_add_flag(id(overlay_color_button), LV_OBJ_FLAG_HIDDEN);

          if (mode == "climate_temperature") {
            auto to_x10 = [](float value, int fallback) -> int {
              if (isnan(value)) return fallback;
              return (int) lround(value * 10.0f);
            };
            auto parse_x10 = [](const std::string& value, int fallback) -> int {
              if (value.empty()) return fallback;
              return (int) lround(atof(value.c_str()) * 10.0f);
            };
            id(climate_edit_pending) = false;
            id(active_control_kind) = "climate_temperature";
            id(active_climate_min_x10) = parse_x10(climate_min_temp, 50);
            id(active_climate_max_x10) = parse_x10(climate_max_temp, 300);
            id(active_climate_step_x10) = parse_x10(climate_step, 5);
            if (id(active_climate_step_x10) < 5) id(active_climate_step_x10) = 5;
            if (id(active_climate_max_x10) <= id(active_climate_min_x10)) {
              id(active_climate_min_x10) = 50;
              id(active_climate_max_x10) = 300;
            }

            id(active_climate_current_x10) = to_x10(climate_current_temperature, 0);
            id(active_climate_current) = climate_current_temperature;
            id(active_climate_target_known) = !isnan(climate_target_temperature);
            int fallback_target = isnan(climate_current_temperature) ? 200 : id(active_climate_current_x10);
            id(active_climate_target_x10) = to_x10(climate_target_temperature, fallback_target);
            if (id(active_climate_target_x10) < id(active_climate_min_x10)) id(active_climate_target_x10) = id(active_climate_min_x10);
            if (id(active_climate_target_x10) > id(active_climate_max_x10)) id(active_climate_target_x10) = id(active_climate_max_x10);
            id(active_climate_target_x10) = id(active_climate_min_x10) + (int) lround((id(active_climate_target_x10) - id(active_climate_min_x10)) / (float) id(active_climate_step_x10)) * id(active_climate_step_x10);
            if (id(active_climate_target_x10) < id(active_climate_min_x10)) id(active_climate_target_x10) = id(active_climate_min_x10);
            if (id(active_climate_target_x10) > id(active_climate_max_x10)) id(active_climate_target_x10) = id(active_climate_max_x10);
            id(active_climate_humidity) = isnan(climate_humidity) ? -1 : (int) lround(climate_humidity);
            id(active_climate_mode) = climate_mode.empty() ? std::string("Auto") : climate_mode;
            id(active_climate_supported_modes) = climate_supported_modes;

            lv_label_set_text(id(climate_detail_title), title.c_str());
            id(climate_card_refresh).execute();

            lv_obj_add_flag(id(brightness_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_detail_overlay), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          int pct = off_value;

          if (mode == "brightness") {
            id(active_control_kind) = "light_brightness";
            if (was_on) {
              if (isnan(brightness_value)) pct = 100;
              else pct = (int) lround((brightness_value / 255.0f) * 100.0f);
            }
          } else if (mode == "percentage") {
            id(active_control_kind) = "fan_percentage";
            if (was_on) {
              if (isnan(percentage_value)) pct = 0;
              else pct = (int) lround(percentage_value);
            }
          } else if (mode == "cover_position") {
            id(active_control_kind) = "cover_position";
            if (isnan(position_value)) pct = was_on ? 100 : 0;
            else pct = (int) lround(position_value);
          } else {
            return;
          }

          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          id(active_brightness_pct) = pct;

          if (tile_type == "light") {
            id(active_supports_color) =
              contains_mode(supported_color_modes, "hs") ||
              contains_mode(supported_color_modes, "rgb") ||
              contains_mode(supported_color_modes, "rgbw") ||
              contains_mode(supported_color_modes, "rgbww") ||
              contains_mode(supported_color_modes, "xy");
            id(active_supports_temperature) = contains_mode(supported_color_modes, "color_temp");

            if (id(active_supports_color) || id(active_supports_temperature)) {
              lv_obj_clear_flag(id(overlay_color_button), LV_OBJ_FLAG_HIDDEN);
            }
          }

          // Track and fill are the pale blue and blue paints of overlay_slider.
          lv_obj_set_style_bg_opa(id(overlay_slider), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_set_style_radius(id(overlay_slider), 28, LV_PART_MAIN);
          lv_obj_set_style_radius(id(overlay_slider), 0, LV_PART_INDICATOR);

          lv_label_set_text(id(overlay_title), title.c_str());
          lv_label_set_text(id(overlay_icon), icon_text.c_str());
          lv_slider_set_value(id(overlay_slider), pct, LV_ANIM_OFF);

          std::string value_text;

          if (tile_type == "cover") {
            if (pct <= 0) {
              value_text = label_off;
            } else if (pct >= 100) {
              value_text = label_on;
            } else {
              char buf[40];
              snprintf(buf, sizeof(buf), "%s - %d%%", label_on.c_str(), pct);
              value_text = buf;
            }
          } else {
            if (pct <= 0) {
              value_text = label_off;
            } else {
              char buf[20];
              snprintf(buf, sizeof(buf), "%d%s", pct, id(active_value_suffix).c_str());
              value_text = buf;
            }
          }

          lv_label_set_text(id(overlay_value), value_text.c_str());

          lv_obj_set_style_bg_opa(id(overlay_slider), LV_OPA_COVER, LV_PART_INDICATOR);

      - if:
          condition:
            lambda: 'return id(active_control_kind) != "climate_temperature";'
          then:
            - if:
                condition:
                  lambda: 'return id(active_supports_color) || id(active_supports_temperature);'
                then:
                  - script.execute: open_color_detail
                else:
                  - lvgl.widget.show: brightness_overlay

  # UI refresh (values + time + styles) + render
  - id: ui_refresh
    mode: single
    then:
      - delay: 100ms
      - lambda: |-
          if (runtime_tiles::enabled) {
            // The name and the top bar (clock included) draw together.
            runtime_tiles::render(id(lbl_room));
            return;
          }

# HA blueprint transport; never publishes the JSON command as an HA state.
text:
  - platform: smart_display
    id: dashboard_inbox
    name: "Tile settings"
    internal: ${DASHBOARD_INBOX_INTERNAL}

button:
  # Wake and Sleep for Home Assistant automations (0.2.45+). Wake is light, not a tap (0.2.56+): it
  # lights a dimmed screen and counts the standby time from now, while Back to page 1 keeps counting
  # from the last touch, so Wake on every motion no longer holds a card or page 2 up. Sleep is the
  # standby time running out, right away and also with Auto standby off; it holds until a tap, Wake
  # or an alert, and closes an alert that is up. Neither saves anything, so an automation may press
  # them on every motion. No entity_category: they are controls, not settings.
  - platform: template
    id: wake_button
    name: "Wake"
    icon: "mdi:gesture-tap"
    on_press:
      - lambda: 'ESP_LOGI("standby", "Wake from Home Assistant, screen %s", id(display_dimmed) ? "in standby" : "on");'
      - if:
          condition:
            lambda: 'return id(display_dimmed);'
          then:
            - script.execute: wake_display
            # A page whose time ran out during standby: light up on page 1, not on the old page first.
            - script.execute: back_to_page_1_when_due
          else:
            - lambda: 'id(last_touch_ms) = millis();'
  - platform: template
    id: sleep_button
    name: "Sleep"
    icon: "mdi:power-sleep"
    on_press:
      - if:
          condition:
            lambda: 'return id(calibration_active);'
          then:
            - lambda: 'ESP_LOGI("standby", "Sleep from Home Assistant ignored: touch calibration is running");'
          else:
            - lambda: |-
                ESP_LOGI("standby", "Sleep from Home Assistant");
                id(sleep_requested) = true;
            - script.execute:
                id: alert_dismiss
                reason: "remote"
            - script.execute: dim_display

number:
  # Firmware 0.2.49+: every number goes through settings_screen::set(), like the settings page, so a value the
  # screen already has writes and reports nothing (an automation may set it on every light change).
  - platform: template
    id: setting_brightness
    name: "Normal brightness"
    entity_category: config
    min_value: 5
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    update_interval: never
    lambda: return screen_settings::current.brightness;
    set_action:
      - lambda: 'settings_screen::set("brightness", (int32_t) lround(x));'
  - platform: template
    id: setting_standby_brightness
    name: "Standby brightness"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    update_interval: never
    lambda: return screen_settings::current.standby_brightness;
    set_action:
      - lambda: 'settings_screen::set("standby_brightness", (int32_t) lround(x));'
  - platform: template
    id: setting_night_brightness
    name: "Night brightness"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    update_interval: never
    lambda: return screen_settings::current.night_brightness;
    set_action:
      - lambda: 'settings_screen::set("night_brightness", (int32_t) lround(x));'
  - platform: template
    id: setting_standby_seconds
    name: "Standby after"
    entity_category: config
    min_value: 60
    max_value: 86400
    step: 60
    unit_of_measurement: "s"
    update_interval: never
    lambda: return screen_settings::current.standby_seconds;
    set_action:
      - lambda: 'settings_screen::set("standby_seconds", (int32_t) lround(x));'
  - platform: template
    id: setting_auto_home_seconds
    name: "Back to page 1 after"
    icon: "mdi:timer-outline"
    entity_category: config
    min_value: 30
    max_value: 3600
    step: 30
    mode: box
    unit_of_measurement: "s"
    update_interval: never
    lambda: return settings_screen::auto_home_seconds;
    set_action:
      - lambda: 'settings_screen::set("auto_home_seconds", (int32_t) lround(x));'

# Make memory visible: this board has no PSRAM, so the free heap determines
# how much UI still fits. Also shows up as an entity in Home Assistant.
debug:
  # Heap figures every five minutes: enough to spot a leak, few recorder rows.
  update_interval: 300s

sensor:
  - platform: debug
    free:
      name: "Heap Free"
      id: heap_free
      on_value:
        - lambda: 'ESP_LOGI("health", "free_heap=%.0f", x);'
    fragmentation:
      name: "Heap Fragmentation"
    block:
      name: "Heap Largest Block"
      on_value:
        - lambda: 'ESP_LOGI("health", "largest_block=%.0f", x);'
    # The lowest free heap since boot: what the busiest moment (boot sync, a swipe) left over.
    min_free:
      name: "Heap Minimum Free"
      on_value:
        - lambda: 'ESP_LOGI("health", "min_free=%.0f", x);'
  - platform: wifi_signal
    name: "Wifi Signal"
    update_interval: 600s

  # When the screen booted, as a timestamp: one value per boot instead of a new recorder
  # row every 15 s. A new entity on purpose: Home Assistant keeps the old Uptime's unit
  # "s" in its registry and would refuse a timestamp under that name.
  - platform: uptime
    type: timestamp
    name: "Last boot"
    id: boot_time


binary_sensor:
  - platform: status
    name: "Node Status"
    id: system_status

# ----------------------------------------------------------
# Text sensors
#
# smartdisplay_action:
# - Main touch event channel exported to Home Assistant
# - On short tap, publishes one of:
#     tile1_press / tile2_press / tile3_press / tile4_press / tile5_press / tile6_press
# - The value is reset shortly after publishing
#
# tile*_preset:
# - Mirrors the Home Assistant preset_mode attribute for each tile entity
# - Used by the UI to display fan presets when applicable
# ----------------------------------------------------------
text_sensor:
  - platform: template
    name: "JC8012P4A1 screen type"
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {"jc8012p4a1"};'
  - platform: template
    name: "Screen firmware"
    entity_category: diagnostic
    lambda: 'return {"${SCREEN_FIRMWARE_VERSION}"};'
    update_interval: 60s
  # ESP Screen Manager matches the screen to its YAML profile and OTA address.
  - platform: template
    name: "Device name"
    entity_category: diagnostic
    lambda: 'return {"${DEVICE_NAME}"};'
    update_interval: 60s
  - platform: wifi_info
    ip_address:
      # `id` so the settings page on the screen can show the same address (0.2.44+).
      id: wifi_ip
      name: "IP address"
      entity_category: diagnostic

switch:
  - platform: restart
    name: "Restart"
  # The screen settings as Home Assistant entities (firmware 0.2.49+, Auto standby since 0.2.41). The screen
  # owns them: the settings page, these entities and ESP Screens all change them through
  # settings_screen::set(), which saves, applies and reports a real change only. The saved values keep
  # their preference records. A template switch reads its lambda every loop and publishes a change itself;
  # the numbers and times are published by apply_screen_settings. Auto standby off wakes a screen the
  # standby time dimmed (a Sleep holds until a tap, Wake or an alert); on counts the standby time from that
  # moment. Nothing runs at boot: every switch follows the saved setting.
  - platform: template
    id: setting_auto_standby
    name: "Auto standby"
    icon: "mdi:sleep"
    entity_category: config
    restore_mode: DISABLED
    lambda: return screen_settings::current.standby_enabled;
    turn_on_action:
      - lambda: |-
          id(last_touch_ms) = millis();
          settings_screen::set("standby_enabled", 1);
    turn_off_action:
      - lambda: 'settings_screen::set("standby_enabled", 0);'
  - platform: template
    id: setting_night_mode
    name: "Night mode"
    icon: "mdi:weather-night"
    entity_category: config
    restore_mode: DISABLED
    lambda: return screen_settings::current.night_enabled;
    turn_on_action:
      - lambda: 'settings_screen::set("night_enabled", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("night_enabled", 0);'
  # The dark look for a screen beside a bed (firmware 0.2.54+): black page, graphite cards, soft white text.
  - platform: template
    id: setting_dark_mode
    name: "Dark mode"
    icon: "mdi:theme-light-dark"
    entity_category: config
    restore_mode: DISABLED
    lambda: return settings_screen::dark_mode != 0;
    turn_on_action:
      - lambda: 'settings_screen::set("dark_mode", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("dark_mode", 0);'
  - platform: template
    id: setting_clock_24h
    name: "24-hour clock"
    icon: "mdi:clock-outline"
    entity_category: config
    restore_mode: DISABLED
    lambda: return screen_settings::current.clock_24h;
    turn_on_action:
      - lambda: 'settings_screen::set("clock_24h", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("clock_24h", 0);'
  - platform: template
    id: setting_auto_home
    name: "Back to page 1"
    icon: "mdi:home-import-outline"
    entity_category: config
    restore_mode: DISABLED
    lambda: return settings_screen::auto_home != 0;
    turn_on_action:
      - lambda: 'settings_screen::set("auto_home", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("auto_home", 0);'
  - platform: template
    id: setting_home_on_standby
    name: "Back to page 1 on standby"
    icon: "mdi:home-import-outline"
    entity_category: config
    restore_mode: DISABLED
    lambda: return screen_settings::current.home_on_standby;
    turn_on_action:
      - lambda: 'settings_screen::set("home_on_standby", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("home_on_standby", 0);'
  - platform: template
    id: setting_swipe_pages
    name: "Swipe between pages"
    icon: "mdi:gesture-swipe-horizontal"
    entity_category: config
    restore_mode: DISABLED
    lambda: return settings_screen::swipe_pages != 0;
    turn_on_action:
      - lambda: 'settings_screen::set("swipe_pages", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("swipe_pages", 0);'

# Night hours as Home Assistant times (firmware 0.2.49+); the screen keeps minutes since midnight.
datetime:
  - platform: template
    type: time
    id: setting_night_start
    name: "Night starts"
    icon: "mdi:weather-sunset-down"
    entity_category: config
    update_interval: never
    lambda: |-
      ESPTime time{};
      time.hour = screen_settings::current.night_start / 60;
      time.minute = screen_settings::current.night_start % 60;
      return time;
    set_action:
      - lambda: 'settings_screen::set("night_start", x.hour * 60 + x.minute);'
  - platform: template
    type: time
    id: setting_night_end
    name: "Night ends"
    icon: "mdi:weather-sunset-up"
    entity_category: config
    update_interval: never
    lambda: |-
      ESPTime time{};
      time.hour = screen_settings::current.night_end / 60;
      time.minute = screen_settings::current.night_end % 60;
      return time;
    set_action:
      - lambda: 'settings_screen::set("night_end", x.hour * 60 + x.minute);'

# Rotation as a Home Assistant choice (firmware 0.2.49+). Only the Guition turns; the CYD keeps its orientation.
select:
  - platform: template
    id: setting_rotation
    name: "Rotation"
    icon: "mdi:screen-rotation"
    entity_category: config
    options: ["0°", "90°", "180°", "270°"]
    update_interval: never
    lambda: |-
      static const char *const names[] = {"0°", "90°", "180°", "270°"};
      return std::string(names[std::clamp<int32_t>(settings_screen::rotation, 0, 270) / 90]);
    set_action:
      - lambda: |-
          const std::string option(x.c_str(), x.size());
          settings_screen::set("rotation", atoi(option.c_str()));

# JC8012P4A1 uses an I2C GSL3680 controller and a four-lane MIPI-DSI panel.
i2c:
  - id: touch_bus
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz
    sda_pullup_enabled: false
    scl_pullup_enabled: false

output:
  - platform: ledc
    pin: GPIO23
    id: gpio_backlight_pwm

esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: true

light:
  # The firmware owns the backlight: brightness, standby, night and alerts set it, and the minute tick
  # restores it. Home Assistant uses the brightness numbers and the Wake and Sleep buttons (0.2.46+).
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Display Backlight"
    id: back_light
    internal: true
    restore_mode: ALWAYS_ON
    default_transition_length: 150ms

touchscreen:
  - platform: gsl3680
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    touch_timeout: 50ms
    transform:
      swap_xy: ${TOUCH_SWAP_XY}
      mirror_x: ${TOUCH_MIRROR_X}
      mirror_y: ${TOUCH_MIRROR_Y}
    on_touch:
      - lambda: |-
          id(last_touch_ms) = millis();
          id(last_use_ms) = millis();
          id(touch_down) = true;
          cyd::touch_guard.begin(millis(), touch.x, touch.y, touch.id);
          cyd::edge_swipe.begin(touch.x, touch.y, static_cast<int>(id(screen_lvgl).get_rotation()));
    on_release:
      - lambda: |-
          id(last_touch_ms) = millis();
          id(last_use_ms) = millis();
          id(touch_down) = false;
          cyd::edge_swipe.end();

# JC8012P4A1 800x1280 native MIPI-DSI panel, shown in landscape by LVGL.
display:
  - platform: mipi_dsi
    id: my_display
    model: JC8012P4A1
    dimensions: {width: 800, height: 1280}
    color_order: RGB
    reset_pin: GPIO27
    lanes: 2
    lane_bit_rate: 1Gbps
    pclk_frequency: 60MHz
    hsync_front_porch: 40
    hsync_pulse_width: 20
    hsync_back_porch: 20
    vsync_front_porch: 20
    vsync_pulse_width: 4
    vsync_back_porch: 8
    update_interval: never
    auto_clear_enabled: false


lvgl:
  id: screen_lvgl
  on_draw_start:
    - lambda: 'id(rendered_frames)++;'
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: ts_touch

  # S3 octal PSRAM holds RGB framebuffer and LVGL draw buffers.
  buffer_size: 25%

  # Direct local feedback on the WHOLE UI, not just the tiles.
  # A theme sets the style per widget type, so this covers all
  # buttons, tabs, sliders and the thermostat ring in one go. Non-clickable
  # widgets never enter the pressed state, so those stay untouched.
  theme:
    obj:
      pressed:
        # bg_opa and not opa: opa would also fade the icon and text. Styles that
        # make LVGL draw into a buffer of its own (opa_layered, rotation/scale,
        # clip_corner, a slider fill rounded less than its track) cost KB's per
        # redraw that the CYD's heap can't spare; tests/test_layer_free.py.
        bg_opa: 45%
    slider:
      knob:
        pressed:
          bg_opa: 65%
    arc:
      knob:
        pressed:
          bg_opa: 65%

  # LVGL owns the rotation (display + touch) since ESPHome 2026.4.
  rotation: ${LVGL_ROTATION}

  style_definitions:
    # The page behind the tiles and the cards: one colour from the theme (theme.h PAGE), no wallpaper and no
    # gradient, so a redraw is a plain fill.
    - id: style_page
      bg_opa: COVER
      border_width: 0
      radius: 0

    - id: style_tile
      bg_opa: COVER
      radius: 22
      border_width: 1
      border_opa: COVER
      pad_left: 12
      pad_right: 12
      pad_top: 12
      pad_bottom: 12
      shadow_width: 0
      shadow_opa: 40%

    - id: style_icon_circle
      bg_opa: COVER
      radius: 999
      border_width: 0

    - id: style_room
      text_font: headline
      text_opa: 100%

    - id: style_time
      text_font: time_label
      text_opa: 100%

    - id: style_title
      text_font: label
      text_opa: 100%

    - id: style_value
      text_font: sublabel
      text_opa: 100%

    - id: style_value_big
      text_font: sublabel_big
      text_opa: 80%

    # Paints: shared styles without a colour of their own. theme.h fills them (the list in on_boot, theme::paints)
    # and fills them again when Dark mode changes, so a widget names a paint where it used to write a colour.
    - id: paint_page_soft
    - id: paint_page_pressed
    - id: paint_card
    - id: paint_raised
    - id: paint_key
    - id: paint_key_pressed
    - id: paint_track
    - id: paint_ink
    - id: paint_ink_soft
    - id: paint_muted
    - id: paint_subtle
    - id: paint_slate
    - id: paint_scrim
    - id: paint_veil
    - id: paint_accent_tint
    - id: paint_accent_bright
    - id: paint_button_dark
    - id: paint_button_dark_pressed
    - id: paint_camera

  # ---------- ALERT OVERLAY (HA action show_alert) ----------
  # LVGL's top layer sits above every page, card and the dim overlay; the card
  # is filled by the alert_show script. Fixed positions, no layout engine.
  top_layer:
    widgets:
      - obj:
          id: alert_overlay
          x: 0
          y: 0
          width: ${DISPLAY_W}
          height: ${DISPLAY_H}
          hidden: true
          styles: paint_scrim
          bg_opa: 60%
          radius: 0
          border_width: 0
          pad_all: 0
          clickable: true
          scrollable: false
          scrollbar_mode: 'OFF'
          # Same look when pressed: a tap next to the card must not repaint the screen.
          pressed:
            bg_opa: 60%
          widgets:
            - obj:
                id: alert_card
                align: CENTER
                width: ${ALERT_CARD_W}
                height: ${ALERT_CARD_H}
                styles: paint_raised
                bg_opa: COVER
                radius: 18
                border_width: 1
                border_opa: COVER
                shadow_width: 0
                pad_all: 0
                clickable: false
                scrollable: false
                scrollbar_mode: 'OFF'
                widgets:
                  - label:
                      id: alert_icon
                      x: ${ALERT_ICON_X}
                      y: ${ALERT_ICON_Y}
                      text: "\U000F002A"
                      text_font: materialdesign_icons
                      clickable: false
                  - label:
                      id: alert_title
                      x: ${ALERT_TEXT_X}
                      y: ${ALERT_TITLE_Y}
                      width: ${ALERT_TEXT_W}
                      height: ${ALERT_TITLE_H}
                      long_mode: DOT
                      text: "Notification"
                      text_font: headline
                      clickable: false
                  - label:
                      id: alert_subtitle
                      x: ${ALERT_TEXT_X}
                      y: ${ALERT_SUBTITLE_Y}
                      width: ${ALERT_TEXT_W}
                      height: ${ALERT_SUBTITLE_H}
                      long_mode: WRAP
                      text: ""
                      text_font: sublabel_big
                      styles: paint_ink_soft
                      clickable: false
                  # The alert's camera image (firmware 0.2.57+) across the top of the card, shown when the app announced
                  # one; a tap opens the camera full screen over the alert. runtime_tiles.h puts the image in it.
                  - obj:
                      id: alert_image_frame
                      x: ${ALERT_IMAGE_INSET}
                      y: ${ALERT_IMAGE_INSET}
                      width: ${CAMERA_THUMB_W}
                      height: ${CAMERA_THUMB_H}
                      hidden: true
                      styles: paint_camera
                      bg_opa: COVER
                      radius: 0
                      border_width: 0
                      shadow_width: 0
                      pad_all: 0
                      clickable: true
                      scrollable: false
                      scrollbar_mode: 'OFF'
                      pressed:
                        bg_opa: COVER
                      on_click:
                        - if:
                            condition:
                              lambda: 'return cyd::touch_guard.accept(millis(), 14) && !runtime_tiles::alert_camera.empty();'
                            then:
                              - lambda: 'runtime_tiles::camera_open(runtime_tiles::alert_camera, id(alert_title_text));'
                      widgets:
                        - label:
                            id: alert_image_icon
                            align: CENTER
                            text: "\U000F07AE"
                            text_font: materialdesign_icons
                            clickable: false
                  - obj:
                      id: alert_ok
                      align: BOTTOM_RIGHT
                      x: -${ALERT_BUTTON_INSET}
                      y: -${ALERT_BUTTON_INSET}
                      width: ${ALERT_BUTTON_W}
                      height: ${ALERT_BUTTON_H}
                      radius: 999
                      styles: paint_button_dark
                      bg_opa: COVER
                      border_width: 0
                      shadow_width: 0
                      pad_all: 0
                      clickable: true
                      scrollable: false
                      pressed:
                        styles: paint_button_dark_pressed
                        bg_opa: COVER
                      on_click:
                        - if:
                            condition:
                              lambda: 'return cyd::touch_guard.accept(millis(), 13);'
                            then:
                              - script.execute:
                                  id: alert_dismiss
                                  reason: "ok"
                      widgets:
                        - label:
                            id: alert_ok_label
                            align: CENTER
                            text: "OK"
                            text_font: headline
                            clickable: false

  pages:
    - id: home_page
      styles: style_page
      pad_all: 0
      scrollable: false
      scrollbar_mode: 'OFF'
      widgets:
        # Never shown: it only makes ESPHome compile LVGL's spinner, which the busy sheet on a tile draws.
        - spinner:
            id: busy_spinner_seed
            hidden: true
            width: 2
            height: 2
            spin_time: 1s
            arc_length: 60deg
        # Never shown either: it makes ESPHome compile LVGL's image widget, which a camera image is drawn with.
        - image:
            id: camera_image_seed
            hidden: true
            src: alert_image
        - label:
            id: lbl_room
            x: 16
            y: ${HEADER_Y}
            text: "${ROOM_NAME}"
            styles: style_room

        # Enables LVGL's line widget for the runtime clock hands and sparklines.
        - line:
            id: runtime_line_enable
            hidden: true
            points:
              - 0, 0
              - 1, 1

        - label:
            id: lbl_time
            align: TOP_RIGHT
            x: -16
            y: ${HEADER_Y}
            text: ""
            styles: style_time

        # Six tiles on page 1, four on page 2. Fixed pages keep navigation predictable.

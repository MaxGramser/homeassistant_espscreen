# The commit a CI job compares with: on a push, the newest commit on the pushed branch where this same job of the CI
# workflow succeeded and that is an ancestor of this one, so commits whose run was cancelled or failed are still covered
# (a newer push replaces a queued run of the same concurrency group); a branch without such a run takes main's. A pull
# request compares with its base. A night or by-hand run, or no such commit, leaves `base` empty, and the caller then
# checks everything.
name: Last green commit
description: The commit to compare with, for tools/check.sh (CHECK_BASE)
inputs:
  job:
    description: the job's name as GitHub shows it, such as "checks" or "firmware (add-on)"
    required: true
outputs:
  base:
    description: a commit sha, or empty for "check everything"
    value: ${{ steps.find.outputs.base }}
runs:
  using: composite
  steps:
    - id: find
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JOB: ${{ inputs.job }}
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
      run: |
        base=""
        case "$EVENT" in
          pull_request) base="$PR_BASE" ;;
          push)
            # The newest completed CI runs on this branch, then on main; the first whose job of this name succeeded
            # and that is an ancestor of this commit.
            for branch in $(printf '%s\n' "$BRANCH" main | awk '!seen[$0]++'); do
              for run in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$branch&status=completed&per_page=30" \
                             --jq '.workflow_runs[].id'); do
                sha=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" \
                        --jq "[.jobs[] | select(.name == env.JOB and .conclusion == \"success\") | .head_sha][0] // empty")
                if [ -n "$sha" ] && git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then base="$sha"; break 2; fi
              done
            done
            ;;
        esac
        if [ -n "$base" ] && ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
          echo "::notice::$base is not an ancestor of this commit: checking everything"
          base=""
        fi
        echo "Compares with: ${base:-nothing, checks everything}"
        echo "base=$base" >> "$GITHUB_OUTPUT"

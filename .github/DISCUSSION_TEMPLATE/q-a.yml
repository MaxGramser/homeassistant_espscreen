body:
  - type: markdown
    attributes:
      value: |
        ## Conversations have moved to the Tessera website
        [Ask a question or start a conversation in Community](https://tessera-maxgramser.on-forge.com/community).
        [Request a feature or improvement on the wishlist](https://tessera-maxgramser.on-forge.com/wishlist), or [request a new ESP board or display](https://tessera-maxgramser.on-forge.com/wishlist?category=board).
        Search first and upvote an existing wish. More votes help decide what gets built. Sign in with GitHub to post, vote or reply.
        Existing GitHub threads link to their new home, including their earlier replies. Please continue there so the conversation stays in one place.
  - type: input
    id: website-thread
    attributes:
      label: Link to the website conversation
      description: Start or find the conversation on the website first. Use GitHub Issues only for bugs, and pull requests for code changes.
      placeholder: https://tessera-maxgramser.on-forge.com/community/...
    validations:
      required: true

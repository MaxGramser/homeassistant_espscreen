name: Question
description: Ask about setup, usage, or how something works.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check README.md, README_EXTENDED.md, and the guides under docs/ first, most setup questions
        are already answered there.
  - type: dropdown
    id: board
    attributes:
      label: Board
      description: Which board is this about, if any?
      options:
        - CYD (ESP32-2432S028)
        - Guition (ESP32-S3-4848S040)
        - Waveshare (ESP32-S3-Touch-LCD-4.3)
        - Guition (JC8012P4A1)
        - Guition (JC8012P4A1 V3)
        - Waveshare (ESP32-S3-Touch-LCD-7)
        - Waveshare (ESP32-S3-Touch-LCD-4B)
        - Waveshare (ESP32-S3-Touch-LCD-3.5)
        - Guition (JC1060P470)
        - Guition (JC1060P470 V2)
        - Hosyond (ESP32-32E E32R40T)
        - Other / not listed here
        - Not board-specific
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

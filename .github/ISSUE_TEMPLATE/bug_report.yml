name: Bug report (bugs only)
description: Report a reproducible problem in an existing screen, app or editor feature.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Only bug reports are reviewed on GitHub.** Feature requests, improvements and new board requests posted here will not be reviewed. They must go on the website. Questions and general discussions also belong on the website, not in GitHub Issues or Discussions.

        Use this form when existing functionality is broken. Please include the steps to reproduce it.

        **Want a feature or improvement?** Search the [wishlist](https://tessera-maxgramser.on-forge.com/wishlist) and upvote an existing wish before adding another.
        **Want a new ESP board or display?** Use [New boards on the wishlist](https://tessera-maxgramser.on-forge.com/wishlist?category=board), including the exact model and a product link. More votes help decide which boards get support. A single request does not guarantee support, and votes do not guarantee a release date.
        **Have a question?** Ask in [Community](https://tessera-maxgramser.on-forge.com/community). Sign in with your GitHub account to post, vote or reply.
  - type: dropdown
    id: board
    attributes:
      label: Board
      description: Which board is this about?
      options:
        - CYD (ESP32-2432S028)
        - CYD (ESP32-2432S028 ILI9342)
        - Guition (ESP32-S3-4848S040)
        - Waveshare (ESP32-S3-Touch-LCD-4.3)
        - Guition (JC8012P4A1)
        - Guition (JC8012P4A1 V3)
        - Waveshare (ESP32-S3-Touch-LCD-7)
        - Waveshare (ESP32-S3-Touch-LCD-4B)
        - Waveshare (ESP32-S3-Touch-LCD-3.5)
        - Guition (JC1060P470)
        - Guition (JC1060P470 V2)
        - Hosyond (ESP32-32E E32R40T)
        - Guition (JC3248W535)
        - Waveshare (ESP32-S3-Touch-LCD-7B)
        - Sunton (ESP32-8048S070)
        - Guition (JC8012P4A1 V2)
        - M5Stack Tab5 (Tab5 ST7121)
        - Waveshare (ESP32-S3-Touch-LCD-5)
        - Waveshare (ESP32-P4-86-Panel-ETH-2RO)
        - reTerminal D1001 (reTerminal D1001)
        - Other / not listed here
        - Not board-specific (add-on, editor, documentation)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How the screen was built
      description: A screen built from your own YAML or board files runs firmware that was never tested on that combination, so this changes where to look.
      options:
        - Installed and updated from Tessera Screen Manager
        - My own ESPHome YAML (ESPHome Device Builder, my own board files or a fork)
        - Not about a screen (add-on, editor, documentation)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Add-on and firmware version
      description: The version of Tessera Screen Manager in Home Assistant, and the firmware version shown on the screen's own Settings page (or in the ESPHome logs).
      placeholder: "e.g. add-on 0.3.19, firmware 0.3.9"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem you are seeing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order, right before the problem showed up?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or a photo of the screen
      description: Add-on logs, ESPHome logs, screenshots of the editor, or a photo of the physical screen. Drag and drop files here.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This reports broken existing functionality, not a feature, improvement or new board request.
          required: true
        - label: I checked the Tessera manual and troubleshooting guide
          required: true
        - label: I searched the existing issues and this has not already been reported
          required: true

name: New board or display support
description: Ask for a new ESP32 board or display to be supported.
title: "[Board]: "
labels: ["new board"]
body:
  - type: markdown
    attributes:
      value: |
        Read docs/ADDING_A_BOARD.md first, it explains what a new board needs (display driver,
        touch controller, resolution, and someone who can test on the real hardware).
  - type: input
    id: board-name
    attributes:
      label: Board or product name and model
      description: The exact name and model printed on the board or its listing.
      placeholder: "e.g. Guition ESP32-S3-4848S040"
    validations:
      required: true
  - type: input
    id: product-link
    attributes:
      label: Link to the product listing or datasheet
    validations:
      required: true
  - type: input
    id: display-controller
    attributes:
      label: Display controller and resolution, if known
      placeholder: "e.g. ST7701S RGB, 480x480"
    validations:
      required: false
  - type: input
    id: touch-controller
    attributes:
      label: Touch controller, if known
      placeholder: "e.g. GT911"
    validations:
      required: false
  - type: dropdown
    id: can-test
    attributes:
      label: Do you own this board and can test it?
      description: New boards only get supported once someone can confirm it actually works on the real hardware.
      options:
        - "Yes, I have it and can test"
        - "No, I do not have it yet"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Existing ESPHome config for this board, similar boards already supported, or other context.
    validations:
      required: false

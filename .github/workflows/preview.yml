# The browser's firmware preview (web/wasm) is the shared firmware compiled to WebAssembly, and the add-on ships the
# compiled file, so it has to be in the commit that goes out. Whenever the firmware sources move past the preview
# (web/wasm/generate_renderer_manifest.py --check), this rebuilds it with Emscripten, runs its tests, builds the editor
# and commits the result to the same branch: on dev, where the work goes, it follows every firmware change, so the
# release commit carries a current preview (docs/RELEASING.md, "Firmware preview"). Not on release-candidate:
# tools/release.py pushes that branch only to point the packages at it for the upgrade test, and it never comes back.
#
# The branch moves while this builds, so the three steps are three files, each with one thing to know:
# web/wasm/build.sh builds the preview, web/wasm/test.sh is the list of its tests (tools/check.sh runs the same file),
# and web/wasm/land.py puts the result on the head the branch has by then, or ends the run when the firmware sources
# changed meanwhile (tests/test_preview_land.py walks its cases).
name: Firmware preview

# The paths hold everything the preview is made from (the files generate_renderer_manifest.py reads): a push that
# makes the preview stale has to start a run, because a run that finds the firmware sources changed under it ends and
# leaves the work to that one. Wider costs little: a run that finds the preview current ends within a minute.
on:
  push:
    branches-ignore: [release-candidate]
    paths:
      - "packages/**"
      - "components/**"
      - "fonts/**"
      - "checkout/**"
      - "web/wasm/**"
      - "tools/profiles.py"
      - "boards.yaml"
      - "screen_manager/Dockerfile"
      - "screen_manager/app/boards.json"
      - "screen_manager/translations/*.json"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time on a branch, and a run that builds is never cancelled: a build takes longer than the time between
# two pushes on a busy day, so cancelled at each push none would finish. GitHub keeps one run waiting behind the
# running one, and a newer push takes that place (its default, `queue: single`): the run that follows is the newest.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Emscripten the committed preview was built with; raise it on purpose, not by accident.
  EMSDK_VERSION: "6.0.10"

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ESPHome
        run: |
          version=$(sed -n 's|^FROM ghcr.io/esphome/esphome:||p' screen_manager/Dockerfile)
          python -m pip install "esphome==$version" PyYAML jinja2
      - name: Is the preview current?
        id: stale
        run: |
          if python web/wasm/generate_renderer_manifest.py --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.stale.outputs.stale == 'true'
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      # generate_host_ui.py has ESPHome generate the UI for an SDL display, and ESPHome checks for sdl2-config.
      - name: SDL2
        if: steps.stale.outputs.stale == 'true'
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with: { command: "sdl2-config --version", packages: libsdl2-dev }
      - name: Emscripten
        if: steps.stale.outputs.stale == 'true'
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      # LVGL and ArduinoJson at their pinned versions (web/wasm/build.py downloads them into PREVIEW_CACHE).
      - uses: actions/cache@v4
        if: steps.stale.outputs.stale == 'true'
        with:
          path: .preview-cache
          key: preview-sources-${{ hashFiles('web/wasm/build.py') }}
      - uses: actions/setup-node@v4
        if: steps.stale.outputs.stale == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the preview
        if: steps.stale.outputs.stale == 'true'
        run: |
          # shellcheck source=/dev/null
          source ~/emsdk/emsdk_env.sh
          PYTHON=python PREVIEW_CACHE="$PWD/.preview-cache" sh web/wasm/build.sh
          PYTHON=python sh web/wasm/test.sh
      # On the head the branch has now, with the editor built on that head (web/wasm/land.py).
      # Every commit on main carries Max as its author (the repository's rule), this one too.
      - name: Land the rebuilt preview
        if: steps.stale.outputs.stale == 'true'
        run: |
          git config user.name "Max Gramser"
          git config user.email "maxgramser@gmail.com"
          python web/wasm/land.py "$GITHUB_REF_NAME"

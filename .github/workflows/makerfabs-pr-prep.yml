name: Makerfabs PR prep

on:
  push:
    branches: [feat/makerfabs43-pr]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/makerfabs43-pr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generator dependencies
        run: python -m pip install PyYAML Pillow fonttools jinja2
      - name: Generate repository artifacts
        run: |
          python tools/generate_entries.py
          python tools/generate_board_shapes.py
          python tools/generate_issue_templates.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/makerfabs43.yaml checkout/makerfabs43.yaml screen_manager/app/boards.json .github/ISSUE_TEMPLATE
          if git diff --cached --quiet; then
            echo 'Nothing generated changed'
            exit 0
          fi
          git commit -m 'Generate Makerfabs board artifacts'
          git push origin HEAD:feat/makerfabs43-pr

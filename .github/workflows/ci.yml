# The release checks of docs/RELEASING.md step 2 on every push and pull request to main (app 0.2.78). Both jobs run
# tools/check.sh, the same script a release runs on a laptop, so CI and a local run can't drift apart. The renders
# have a workflow of their own (render.yml), so a push does not wait up to two hours behind them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"      # every board, every night
  workflow_dispatch:          # the same, by hand

permissions:
  contents: read
  actions: read               # .github/actions/last-green reads which earlier runs succeeded

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history: the firmware number check compares with the commit before this push, or the pull request's
      # base (CHECK_BASE below, docs/BOARD_RELEASES.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/last-green
        id: base
        with:
          job: checks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # What the add-on image adds to ESPHome's (screen_manager/Dockerfile), Pillow for the camera tests (ESPHome
      # brings it in the image), fontTools for tools/generate_icons.py, and jinja2 for tools/profiles.py, which works
      # out the sizes a look computes the way ESPHome does (ESPHome brings it too).
      - name: Python packages
        run: python -m pip install 'aiohttp>=3.12,<4' PyYAML Pillow fonttools jinja2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: clang
        run: clang++ --version || (sudo apt-get update && sudo apt-get install -y clang)
      - name: tools/check.sh
        run: bash tools/check.sh
        env:
          PYTHON: python
          CXX: clang++
          CHECK_BASE: ${{ steps.base.outputs.base }}

  firmware:
    name: firmware (${{ matrix.esphome }})
    needs: checks
    runs-on: ubuntu-latest
    # Nine boards since 0.3.6: the add-on's ESPHome builds took just under 30 minutes and ran past it on a slow runner.
    # A build without its build folder (a source file added or removed) took 40 minutes for min_version on 09-26.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The ESPHome the add-on ships, and the oldest one the packages promise (`min_version` in packages/core.yaml):
        # every screen builds from main with whichever its owner has (docs/RELEASING.md, Compatibility 0.2.89).
        esphome: [add-on, min_version]
    steps:
      # The whole history, so the build can compare with the last commit it built (--affected below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/last-green
        id: base
        with:
          job: firmware (${{ matrix.esphome }})
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ESPHome version
        id: esphome
        run: |
          if [ "${{ matrix.esphome }}" = add-on ]; then
            version=$(sed -n 's|^FROM ghcr.io/esphome/esphome:||p' screen_manager/Dockerfile)
          else
            version=$(sed -n 's/^  min_version: //p' packages/core.yaml)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: ESPHome
        run: python -m pip install "esphome==${{ steps.esphome.outputs.version }}"
      # ESPHome 2026.7+ builds with ESP-IDF itself and reuses what it compiled before when ccache is on the PATH.
      - name: ccache
        run: ccache --version || (sudo apt-get update && sudo apt-get install -y ccache)
      # ESP-IDF, its tools and ccache's cache (ESPHome 2026.7+ keeps them in ~/.cache/esphome) and PlatformIO's
      # toolchains (ESPHome before 2026.7): any older copy of the same ESPHome will do.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: firmware-tools-${{ runner.os }}-esphome-${{ steps.esphome.outputs.version }}-${{ hashFiles('checkout/cyd.yaml', 'checkout/guition.yaml', 'packages/**', 'components/**') }}
          restore-keys: |
            firmware-tools-${{ runner.os }}-esphome-${{ steps.esphome.outputs.version }}-
      # The names of the files the builds compile. Before 2026.7 ESPHome builds through PlatformIO, which lists a
      # build's sources once: a build folder from before a .cpp was added links without it (undefined reference).
      - name: Source files
        id: sources
        run: echo "hash=$(git ls-files checkout packages components | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # The check builds (tools/check.sh builds under .esphome/check), reused only while the same files exist.
      - uses: actions/cache@v4
        with:
          path: .esphome/check
          key: firmware-build-${{ runner.os }}-esphome-${{ steps.esphome.outputs.version }}-${{ steps.sources.outputs.hash }}-${{ hashFiles('checkout/cyd.yaml', 'checkout/guition.yaml', 'packages/**', 'components/**') }}
          restore-keys: |
            firmware-build-${{ runner.os }}-esphome-${{ steps.esphome.outputs.version }}-${{ steps.sources.outputs.hash }}-
      # Only the boards that can have changed since the last commit this same build succeeded on
      # (tools/affected_boards.py --build-keys, docs/BOARD_RELEASES.md): a cancelled or failed run's commits are
      # included. Every board at night, by hand, or without such a commit.
      - name: tools/check.sh --firmware
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ] \
             || [ -z "$BASE" ]; then
            bash tools/check.sh --firmware
          else
            CHECK_BASE="$BASE" bash tools/check.sh --firmware --affected
          fi
        env:
          PYTHON: python
          BASE: ${{ steps.base.outputs.base }}

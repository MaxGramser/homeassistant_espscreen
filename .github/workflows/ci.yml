# The release checks of docs/RELEASING.md step 2 on every push and pull request to main (app 0.2.78). Both jobs run
# tools/check.sh, the same script a release runs on a laptop, so CI and a local run can't drift apart.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # What the add-on image adds to ESPHome's (screen_manager/Dockerfile), Pillow for the camera tests (ESPHome
      # brings it in the image), fontTools for tools/generate_icons.py, and jinja2 for tools/profiles.py, which works
      # out the sizes a look computes the way ESPHome does (ESPHome brings it too).
      - name: Python packages
        run: python -m pip install 'aiohttp>=3.12,<4' PyYAML Pillow fonttools jinja2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: clang
        run: clang++ --version || (sudo apt-get update && sudo apt-get install -y clang)
      - name: tools/check.sh
        run: bash tools/check.sh
        env:
          PYTHON: python
          CXX: clang++

  firmware:
    name: firmware (${{ matrix.esphome }})
    needs: checks
    runs-on: ubuntu-latest
    # Nine boards since 0.3.6: the add-on's ESPHome builds took just under 30 minutes and ran past it on a slow runner.
    # A build without its build folder (a source file added or removed) took 40 minutes for min_version on 09-26.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The ESPHome the add-on ships, and the oldest one the packages promise (`min_version` in packages/core.yaml):
        # every screen builds from main with whichever its owner has (docs/RELEASING.md, Compatibility 0.2.89).
        esphome: [add-on, min_version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ESPHome version
        id: esphome
        run: |
          if [ "${{ matrix.esphome }}" = add-on ]; then
            version=$(sed -n 's|^FROM ghcr.io/esphome/esphome:||p' screen_manager/Dockerfile)
          else
            version=$(sed -n 's/^  min_version: //p' packages/core.yaml)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: ESPHome
        run: python -m pip install "esphome==${{ steps.esphome.outputs.version }}"
      # ESPHome 2026.7+ builds with ESP-IDF itself and reuses what it compiled before when ccache is on the PATH.
      - name: ccache
        run: ccache --version || (sudo apt-get update && sudo apt-get install -y ccache)
      # ESP-IDF, its tools and ccache's cache (ESPHome 2026.7+ keeps them in ~/.cache/esphome) and PlatformIO's
      # toolchains (ESPHome before 2026.7): any older copy of the same ESPHome will do.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: firmware-tools-${{ runner.os }}-esphome-${{ steps.esphome.outputs.version }}-${{ hashFiles('checkout/cyd.yaml', 'checkout/guition.yaml', 'packages/**', 'components/**') }}
          restore-keys: |
            firmware-tools-${{ runner.os }}-esphome-${{ steps.esphome.outputs.version }}-
      # The names of the files the builds compile. Before 2026.7 ESPHome builds through PlatformIO, which lists a
      # build's sources once: a build folder from before a .cpp was added links without it (undefined reference).
      - name: Source files
        id: sources
        run: echo "hash=$(git ls-files checkout packages components | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # The check builds (tools/check.sh builds under .esphome/check), reused only while the same files exist.
      - uses: actions/cache@v4
        with:
          path: .esphome/check
          key: firmware-build-${{ runner.os }}-esphome-${{ steps.esphome.outputs.version }}-${{ steps.sources.outputs.hash }}-${{ hashFiles('checkout/cyd.yaml', 'checkout/guition.yaml', 'packages/**', 'components/**') }}
          restore-keys: |
            firmware-build-${{ runner.os }}-esphome-${{ steps.esphome.outputs.version }}-${{ steps.sources.outputs.hash }}-
      - name: tools/check.sh --firmware
        run: bash tools/check.sh --firmware
        env:
          PYTHON: python

  # Every board of the catalog built as a host program (tools/render/run.py), lying down and standing up: its own self
  # test has to pass (every page's cards and bar, and the geometry check that nothing falls outside its area), which
  # is how a board nobody here owns gets checked on every change. What each draws is compared with the commit before
  # (a push) or the branch it goes into (a pull request); the renders, a contact sheet and the differences are the
  # run's artifact, for a person to look at. A difference does not fail the run: a change to the screens makes one.
  render:
    name: render
    needs: checks
    runs-on: ubuntu-latest
    # Sixteen host variants since 0.3.6 take 53 to 54 minutes on a runner: room so a slow one does not stop a release.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: SDL2 and ccache
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ccache
      - name: ESPHome
        run: |
          version=$(sed -n 's|^FROM ghcr.io/esphome/esphome:||p' screen_manager/Dockerfile)
          python -m pip install "esphome==$version" 'aiohttp>=3.12,<4' PyYAML Pillow jinja2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
            .esphome/render/build/.esphome
          key: render-${{ runner.os }}-${{ hashFiles('screen_manager/Dockerfile') }}-${{ hashFiles('packages/**', 'components/**') }}
          restore-keys: |
            render-${{ runner.os }}-${{ hashFiles('screen_manager/Dockerfile') }}-
      - name: tools/check.sh --render
        run: bash tools/check.sh --render
        env:
          PYTHON: python
          RENDER_PYTHON: python
      - name: Renders of the commit this is compared with
        id: base
        if: always()
        continue-on-error: true
        run: |
          base=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          ESPHOME=esphome python tools/render/run.py --tree "$RUNNER_TEMP/base" --out .esphome/render/base \
            --work .esphome/render/build-base
      - name: What changed on the screens
        if: always()
        continue-on-error: true
        run: |
          boards=$(cd .esphome/render/out && ls -d */ | tr -d / | paste -sd, -)
          python tools/compare_renders.py .esphome/render/base .esphome/render/out --boards "$boards" --out .esphome/render/diffs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: |
            .esphome/render/out
            .esphome/render/base
            .esphome/render/diffs
          if-no-files-found: ignore

# ESP Screen Manager for Home Assistant Container (Docker), without the Supervisor.
# Guide: https://github.com/MaxGramser/homeassistant_espscreen/blob/main/docs/DOCKER.md
#
# Next to this file, create `ha_token` with a long-lived access token, then:
#   docker compose up -d --build

services:
  esp-screens:
    container_name: esp-screens
    build:
      # The same image as the Home Assistant app, built from the main branch.
      context: https://github.com/MaxGramser/homeassistant_espscreen.git#main:screen_manager
    restart: unless-stopped
    # A small init as process 1, like the Home Assistant app gets: it passes on docker stop and reaps finished builds.
    init: true
    # Home Assistant reaches the page on 127.0.0.1:8099, and .local names resolve.
    network_mode: host
    environment:
      SCREEN_DEV: "1"                    # outside the Supervisor: token from HA_TOKEN_FILE, page on 127.0.0.1 only
      HA_API: http://127.0.0.1:8123/api  # Home Assistant's address, ending in /api
      HA_TOKEN_FILE: /run/secrets/ha_token
      # Home Assistant on https with a self-signed certificate: put that certificate next to this file (docs/DOCKER.md).
      # HA_CA_FILE: /run/secrets/ha_cert
      # HA_VERIFY_SSL: "0"               # last resort: don't check Home Assistant's certificate at all
      # Home Assistant on another machine: its address, so its sidebar panel may open the page over the network.
      # SCREEN_INGRESS_FROM: 192.168.1.10
      ESPHOME_CONFIG: /config            # not /esphome: that holds the ESPHome CLI itself
      SCREEN_DATA: /data
    secrets:
      - ha_token
      # - ha_cert
    volumes:
      - ./esphome:/config                # device profiles and secrets.yaml; or your ESPHome Device Builder folder
      - ./data:/data                     # layouts, update settings and build caches
    healthcheck:
      # The image brings this check itself (screen_manager/Dockerfile); it stays here for a container built
      # from an older image. The app answers /health from inside the container, the page needs Home Assistant.
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8099/health"]
    # USB flashing (Linux only): connect the screen first, then uncomment and set its port.
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

secrets:
  ha_token:
    file: ./ha_token
  # ha_cert:
  #   file: ./ha_cert.pem

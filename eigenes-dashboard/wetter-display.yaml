# Wetter-Dashboard für das Guition ESP32-S3-4848S040 (480 x 480, ST7701S + GT911).
# Eigenständige ESPHome-Konfiguration mit LVGL, ohne Tessera. README.md erklärt die Einrichtung.
# Diese Datei schreibt werkzeuge/yaml_bauen.py; Änderungen am Aufbau dort machen, Einstellungen hier oben.
#
# Oben ein grünes Panel: Ort, Datum, Kalenderwoche, Temperatur, Sonnenauf- und -untergang, großes Wetterbild
# (nachts die Mondphase mit dem Wetter klein daneben), Hoch und Tief. Bei einer DWD-Warnung oder Vorwarnung wird das
# Bild kleiner und darunter steht ein Hinweis in der Farbe der Stufe. Darunter vier Kacheln (Wind mit Böen, Regen
# heute, Luftfeuchte, UV-Index), die Temperaturkurve der 5 Tage und der Regen der nächsten Stunden. Nachts (bis
# 30 Minuten vor Sonnenaufgang) ist alles dunkel. Ein Doppeltipp zeigt das Easter Egg "Hunderunde": wann man heute
# (ab 21 Uhr: morgen) trocken mit dem Hund rauskommt.

substitutions:
  name: wetter-display
  friendly_name: Wetter-Display
  ort: Sassenberg
  # die Wetter-Entität (DWD oder Met.no) und der Sensor aus home-assistant/wetter_display.yaml
  wetter_entity: weather.controlroom_sassenberg
  # UV-Index von der Integration OpenUV (die DWD-Integration liefert ihn nicht mehr)
  uv_entity: sensor.controlroom_openuv_aktueller_uv_index
  vorhersage_entity: sensor.display_wetter
  # Raumklima (zweite Seite): Platzhalter, bis die drei Sensoren gebaut sind
  co2_wohnzimmer: sensor.luft_wohnzimmer_co2
  temp_wohnzimmer: sensor.luft_wohnzimmer_temperatur
  feuchte_wohnzimmer: sensor.luft_wohnzimmer_luftfeuchte
  co2_schlafzimmer: sensor.luft_schlafzimmer_co2
  temp_schlafzimmer: sensor.luft_schlafzimmer_temperatur
  feuchte_schlafzimmer: sensor.luft_schlafzimmer_luftfeuchte
  co2_buero: sensor.luft_buero_co2
  temp_buero: sensor.luft_buero_temperatur
  feuchte_buero: sensor.luft_buero_luftfeuchte
  pm1_buero: sensor.luft_buero_pm1
  pm25_buero: sensor.luft_buero_pm2_5
  pm4_buero: sensor.luft_buero_pm4
  pm10_buero: sensor.luft_buero_pm10
  voc_buero: sensor.luft_buero_voc_index
  nox_buero: sensor.luft_buero_nox_index
  # Vorschläge für die Regler in Home Assistant (Gerät Wetter-Display, Konfiguration); dort einstellen:
  # Sekunden bis zum Wechsel zwischen Wetter und Raumklima
  seitenwechsel: "45"
  # Minuten, die das Display an bleibt, wenn man es im Nachtmodus mit einem Tippen weckt
  weckdauer: "10"
  # Millisekunden, in denen der zweite Tipp eines Doppeltipps kommen muss (so lange wartet ein einfaches Tippen)
  doppeltipp: "350"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.6.2
  includes:
    - wetter.h
  on_boot:
    priority: -100
    then:
      # im Nachtmodus (Schalter, den eine Automation in HA setzt) bleibt das Licht aus
      - if:
          condition:
            switch.is_off: nachtmodus
          then:
            - light.turn_on:
                id: hintergrundlicht
                brightness: !lambda return id(helligkeit);
      - script.execute: seite_weiter
      - script.execute: punkte_zeichnen
      - script.execute: warn_zeichnen

globals:
  # Helligkeit, die Wischen hoch/runter einstellt; bleibt über einen Neustart erhalten
  - {id: helligkeit, type: float, initial_value: "0.8"}
  # Seite festgehalten (langer Druck): kein automatischer Wechsel, das Schloss ist zu sehen
  - {id: seite_gehalten, type: bool, initial_value: "false"}
  # Gesten: Start- und letzter Punkt einer Berührung, ob der lange Druck schon ausgelöst hat
  - {id: t_x0, type: int, initial_value: "0"}
  - {id: t_y0, type: int, initial_value: "0"}
  - {id: t_x1, type: int, initial_value: "0"}
  - {id: t_y1, type: int, initial_value: "0"}
  - {id: t_lang, type: bool, initial_value: "false"}
  # Tag oder Nacht (helles oder dunkles Design); ob das Thema schon einmal gesetzt wurde
  - {id: ist_tag, type: bool, initial_value: "true"}
  - {id: thema_gesetzt, type: bool, initial_value: "false"}
  # Verbindung zu Home Assistant: seit wann sie fehlt (millis, 0 = verbunden), ob das angezeigt wird, ab wann (Uhrzeit)
  - {id: offline_seit, type: uint32_t, initial_value: "0"}
  - {id: offline_an, type: bool, initial_value: "false"}
  - {id: offline_text, type: std::string, initial_value: '""'}

number:
  # Einstellungen, die Home Assistant als Regler zeigt (Gerät Wetter-Display, Konfiguration)
  - platform: template
    id: nr_seitenwechsel
    name: Seitenwechsel
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 300
    step: 5
    initial_value: ${seitenwechsel}
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: seite_weiter
  - platform: template
    id: nr_weckdauer
    name: Weckdauer im Nachtmodus
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 60
    step: 1
    initial_value: ${weckdauer}
    optimistic: true
    restore_value: true
  - platform: template
    id: nr_helligkeit
    name: Helligkeit
    icon: mdi:brightness-6
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 10
    initial_value: 80
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(helligkeit) = x / 100.0f;
      - if:
          condition:
            lambda: return id(hintergrundlicht).remote_values.is_on();
          then:
            - light.turn_on:
                id: hintergrundlicht
                brightness: !lambda return id(helligkeit);
                transition_length: 200ms

  - platform: template
    id: nr_doppeltipp
    name: Doppeltipp-Zeit
    icon: mdi:gesture-double-tap
    entity_category: config
    unit_of_measurement: ms
    min_value: 200
    max_value: 800
    step: 50
    initial_value: ${doppeltipp}
    optimistic: true
    restore_value: true

button:
  - platform: restart
    name: Neustart

switch:
  # Nachtmodus: an = Licht aus, ein Tippen weckt das Display für ${weckdauer}. Wann es Nacht ist, entscheidet eine
  # Automation in Home Assistant (Beispiel in home-assistant/wetter_display.yaml).
  - platform: template
    id: nachtmodus
    name: Nachtmodus
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.stop: nacht_wecken
      - light.turn_off: hintergrundlicht
    on_turn_off:
      - script.stop: nacht_wecken
      - light.turn_on:
          id: hintergrundlicht
          brightness: !lambda return id(helligkeit);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
    sdkconfig_options:
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0

api:
  # ohne Home Assistant nicht neu starten, sondern weiter anzeigen (mit dem Hinweis "keine Verbindung")
  reboot_timeout: 0s
  encryption:
    key: !secret wetter_display_api_key

ota:
  - platform: esphome
    password: !secret wetter_display_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wetter-Display Setup"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: uhr_zeichnen
        - script.execute: tag_pruefen
        - script.execute: jetzt_zeichnen
    on_time:
      - seconds: 0
        then:
          - script.execute: uhr_zeichnen
          - script.execute: tag_pruefen
      - seconds: 0
        minutes: 0
        then:
          - script.execute: jetzt_zeichnen   # die Mondphase wechselt langsam: einmal pro Stunde reicht

script:
  # jede Minute: Datum, Kalenderwoche, "vor/in ... Std" bei der Sonne
  - id: uhr_zeichnen
    then:
      - lvgl.label.update:
          id: lbl_datum
          text: !lambda 'return wx::datum(id(ha_time).now());'
      - lvgl.label.update:
          id: lbl_kw
          text: !lambda 'return wx::kw(id(ha_time).now());'
      - lvgl.label.update:
          id: lbl_auf_wann
          text: !lambda 'return wx::wann(wx::part(id(wetter_sonne).state, 0), wx::part(id(wetter_sonne).state, 1), id(ha_time).now());'
      - lvgl.label.update:
          id: lbl_unter_wann
          text: !lambda 'return wx::wann(wx::part(id(wetter_sonne).state, 1), wx::part(id(wetter_sonne).state, 0), id(ha_time).now());'
  # das große Bild: am Tag das Wetter, nachts die Mondphase und das Wetter klein daneben; dazu die Panelfarbe
  - id: jetzt_zeichnen
    then:
      - lvgl.image.update:
          id: bild_jetzt
          src: !lambda |-
              auto c = id(wetter_zustand).state;
              if (!id(ist_tag) || c == "clear-night") {
                int m = id(ha_time).now().is_valid() ? wx::mondphase(id(ha_time).now().timestamp) : 4;
              if (m == 0) return id(img_mond_0);
              if (m == 1) return id(img_mond_1);
              if (m == 2) return id(img_mond_2);
              if (m == 3) return id(img_mond_3);
              if (m == 4) return id(img_mond_4);
              if (m == 5) return id(img_mond_5);
              if (m == 6) return id(img_mond_6);
                return id(img_mond_7);
              }
              if (c == "sunny") return id(img_tag_sunny);
              if (c == "partlycloudy") return id(img_tag_partlycloudy);
              if (c == "cloudy") return id(img_tag_cloudy);
              if (c == "fog") return id(img_tag_fog);
              if (c == "rainy") return id(img_tag_rainy);
              if (c == "pouring") return id(img_tag_pouring);
              if (c == "lightning") return id(img_tag_lightning);
              if (c == "lightning-rainy") return id(img_tag_lightning_rainy);
              if (c == "snowy") return id(img_tag_snowy);
              if (c == "snowy-rainy") return id(img_tag_snowy_rainy);
              if (c == "hail") return id(img_tag_hail);
              if (c == "windy") return id(img_tag_windy);
              if (c == "windy-variant") return id(img_tag_windy_variant);
              if (c == "exceptional") return id(img_tag_exceptional);
              return id(img_tag_cloudy);
      - lvgl.image.update:
          id: bild_klein
          src: !lambda |-
              auto a = wx::nacht_art(id(wetter_zustand).state);
              if (a == "wolke") return id(img_nacht_wolke);
              if (a == "fog") return id(img_nacht_fog);
              if (a == "rainy") return id(img_nacht_rainy);
              if (a == "pouring") return id(img_nacht_pouring);
              if (a == "lightning") return id(img_nacht_lightning);
              if (a == "lightning-rainy") return id(img_nacht_lightning_rainy);
              if (a == "snowy") return id(img_nacht_snowy);
              if (a == "snowy-rainy") return id(img_nacht_snowy_rainy);
              if (a == "hail") return id(img_nacht_hail);
              if (a == "windy") return id(img_nacht_windy);
              if (a == "windy-variant") return id(img_nacht_windy_variant);
              if (a == "exceptional") return id(img_nacht_exceptional);
              return id(img_nacht_wolke);
      - if:
          condition:
            lambda: |-
              return !id(ist_tag) && !wx::nacht_art(id(wetter_zustand).state).empty();
          then:
            - lvgl.widget.show: bild_klein
          else:
            - lvgl.widget.hide: bild_klein
      # UV-Index: OpenUV wird nur tagsüber abgefragt; nachts ist er 0
      - lvgl.label.update:
          id: lbl_uv
          text: !lambda 'return !id(ist_tag) ? std::string("0") : wx::percent(id(wetter_uv).state);'
      - lvgl.label.update:
          id: lbl_uv_text
          text: !lambda 'return wx::uv_text(!id(ist_tag) ? 0.0f : id(wetter_uv).state);'
          text_color: !lambda 'return wx::uv_color(!id(ist_tag) ? 0.0f : id(wetter_uv).state);'
  # die Temperaturkurve, ihre Punkte und Werte; läuft, wenn ein Tag neue Daten hat
  - id: kurve_zeichnen
    mode: restart
    then:
      - delay: 300ms  # die fünf Tage kommen kurz nacheinander: einmal zeichnen
      - lvgl.line.update:
          id: kurve
          points:
            - x: !lambda 'return wx::kurve_x(0);'
              y: !lambda 'return wx::kurve_y(0);'
            - x: !lambda 'return wx::kurve_x(1);'
              y: !lambda 'return wx::kurve_y(1);'
            - x: !lambda 'return wx::kurve_x(2);'
              y: !lambda 'return wx::kurve_y(2);'
            - x: !lambda 'return wx::kurve_x(3);'
              y: !lambda 'return wx::kurve_y(3);'
            - x: !lambda 'return wx::kurve_x(4);'
              y: !lambda 'return wx::kurve_y(4);'
            - x: !lambda 'return wx::kurve_x(5);'
              y: !lambda 'return wx::kurve_y(5);'
            - x: !lambda 'return wx::kurve_x(6);'
              y: !lambda 'return wx::kurve_y(6);'
            - x: !lambda 'return wx::kurve_x(7);'
              y: !lambda 'return wx::kurve_y(7);'
            - x: !lambda 'return wx::kurve_x(8);'
              y: !lambda 'return wx::kurve_y(8);'
            - x: !lambda 'return wx::kurve_x(9);'
              y: !lambda 'return wx::kurve_y(9);'
            - x: !lambda 'return wx::kurve_x(10);'
              y: !lambda 'return wx::kurve_y(10);'
            - x: !lambda 'return wx::kurve_x(11);'
              y: !lambda 'return wx::kurve_y(11);'
            - x: !lambda 'return wx::kurve_x(12);'
              y: !lambda 'return wx::kurve_y(12);'
            - x: !lambda 'return wx::kurve_x(13);'
              y: !lambda 'return wx::kurve_y(13);'
            - x: !lambda 'return wx::kurve_x(14);'
              y: !lambda 'return wx::kurve_y(14);'
            - x: !lambda 'return wx::kurve_x(15);'
              y: !lambda 'return wx::kurve_y(15);'
            - x: !lambda 'return wx::kurve_x(16);'
              y: !lambda 'return wx::kurve_y(16);'
            - x: !lambda 'return wx::kurve_x(17);'
              y: !lambda 'return wx::kurve_y(17);'
            - x: !lambda 'return wx::kurve_x(18);'
              y: !lambda 'return wx::kurve_y(18);'
            - x: !lambda 'return wx::kurve_x(19);'
              y: !lambda 'return wx::kurve_y(19);'
            - x: !lambda 'return wx::kurve_x(20);'
              y: !lambda 'return wx::kurve_y(20);'
            - x: !lambda 'return wx::kurve_x(21);'
              y: !lambda 'return wx::kurve_y(21);'
            - x: !lambda 'return wx::kurve_x(22);'
              y: !lambda 'return wx::kurve_y(22);'
            - x: !lambda 'return wx::kurve_x(23);'
              y: !lambda 'return wx::kurve_y(23);'
            - x: !lambda 'return wx::kurve_x(24);'
              y: !lambda 'return wx::kurve_y(24);'
            - x: !lambda 'return wx::kurve_x(25);'
              y: !lambda 'return wx::kurve_y(25);'
            - x: !lambda 'return wx::kurve_x(26);'
              y: !lambda 'return wx::kurve_y(26);'
            - x: !lambda 'return wx::kurve_x(27);'
              y: !lambda 'return wx::kurve_y(27);'
            - x: !lambda 'return wx::kurve_x(28);'
              y: !lambda 'return wx::kurve_y(28);'
            - x: !lambda 'return wx::kurve_x(29);'
              y: !lambda 'return wx::kurve_y(29);'
            - x: !lambda 'return wx::kurve_x(30);'
              y: !lambda 'return wx::kurve_y(30);'
            - x: !lambda 'return wx::kurve_x(31);'
              y: !lambda 'return wx::kurve_y(31);'
            - x: !lambda 'return wx::kurve_x(32);'
              y: !lambda 'return wx::kurve_y(32);'
      - lvgl.widget.update:
          id: punkt_0
          y: !lambda 'return wx::punkt_y(0) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_0
          y: !lambda 'return wx::punkt_y(0) - 28;'
      - lvgl.widget.update:
          id: punkt_1
          y: !lambda 'return wx::punkt_y(1) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_1
          y: !lambda 'return wx::punkt_y(1) - 28;'
      - lvgl.widget.update:
          id: punkt_2
          y: !lambda 'return wx::punkt_y(2) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_2
          y: !lambda 'return wx::punkt_y(2) - 28;'
      - lvgl.widget.update:
          id: punkt_3
          y: !lambda 'return wx::punkt_y(3) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_3
          y: !lambda 'return wx::punkt_y(3) - 28;'
      - lvgl.widget.update:
          id: punkt_4
          y: !lambda 'return wx::punkt_y(4) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_4
          y: !lambda 'return wx::punkt_y(4) - 28;'

  # nach der Zeit des Reglers "Seitenwechsel" zwischen Wetter und Raumklima wechseln; ein Tippen wechselt sofort und
  # startet die Zeit neu
  - id: seite_weiter
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) (id(nr_seitenwechsel).state * 1000);'
      - if:
          condition:
            lambda: return !id(seite_gehalten);
          then:
            - script.execute: seite_wechseln
            - script.execute: seite_weiter

  # die Seite Raumklima gibt es erst, wenn ein Raum einen CO2-Wert hat; bis dahin bleibt das Wetter stehen
  - id: seite_wechseln
    then:
      - if:
          condition:
            lambda: |-
              return wx::innen_da(id(co2_wohnzimmer).state, id(co2_schlafzimmer).state, id(co2_buero).state) ||
                     id(seite_innen)->is_showing();
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 400ms

  # Nachtmodus: nach der Weckdauer (Regler, Minuten) ohne Berührung geht das Licht wieder aus
  - id: nacht_wecken
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) (id(nr_weckdauer).state * 60000);'
      - if:
          condition:
            switch.is_on: nachtmodus
          then:
            - light.turn_off: hintergrundlicht

  # langer Druck: nach 0,8 s ohne Bewegung die Seite festhalten oder wieder freigeben (schon während man drückt)
  - id: lang_warten
    mode: restart
    then:
      - delay: 800ms
      - if:
          condition:
            lambda: |-
              return abs(id(t_x1) - id(t_x0)) < 20 && abs(id(t_y1) - id(t_y0)) < 20 &&
                     id(hintergrundlicht).remote_values.is_on();
          then:
            - lambda: id(t_lang) = true;
            - script.execute:
                id: geste
                art: 3

  # Schloss kurz zeigen (sanft ein- und ausblenden); jede Berührung einer gehaltenen Seite startet es neu
  - id: schloss_zeigen
    mode: restart
    then:
      - lvgl.widget.show: schloss
      - lambda: lv_obj_fade_in(id(schloss), 200, 0);
      - delay: 3s
      - lambda: lv_obj_fade_out(id(schloss), 600, 0);
      - delay: 600ms
      - lvgl.widget.hide: schloss

  # Gesten: 0 = Tippen (nächste Seite), 1 = Wischen hoch (heller), 2 = Wischen runter (dunkler), 3 = lang (Seite halten)
  - id: geste
    parameters:
      art: int
    then:
      - if:
          # dunkel im Nachtmodus: jede Berührung weckt nur
          condition:
            lambda: return id(nachtmodus).state && !id(hintergrundlicht).remote_values.is_on();
          then:
            - light.turn_on:
                id: hintergrundlicht
                brightness: !lambda return id(helligkeit);
            - script.execute: nacht_wecken
          else:
            - if:
                condition:
                  switch.is_on: nachtmodus
                then:
                  - script.execute: nacht_wecken   # die Weckzeit zählt ab der letzten Berührung
            - if:
                condition:
                  lambda: return art == 1 || art == 2;
                then:
                  # über den Regler "Helligkeit", damit Home Assistant den neuen Wert sieht
                  - number.set:
                      id: nr_helligkeit
                      value: !lambda |-
                        float h = id(nr_helligkeit).state + (art == 1 ? 20 : -20);
                        return h > 100 ? 100 : (h < 10 ? 10 : h);
            - if:
                condition:
                  lambda: return art == 3;
                then:
                  # langer Druck: festhalten oder freigeben
                  - lambda: id(seite_gehalten) = !id(seite_gehalten);
                  - if:
                      condition:
                        lambda: return id(seite_gehalten);
                      then:
                        - script.stop: seite_weiter
                        - script.execute: schloss_zeigen
                      else:
                        - script.stop: schloss_zeigen
                        - lvgl.widget.hide: schloss
                        - script.execute: seite_weiter
                else:
                  - if:
                      condition:
                        lambda: return art == 0;
                      then:
                        - if:
                            # die Hunderunde ist offen: Tippen schließt sie
                            condition:
                              lambda: return !lv_obj_has_flag(id(hunderunde), LV_OBJ_FLAG_HIDDEN);
                            then:
                              - script.execute: hunderunde_schliessen
                            else:
                              - if:
                                  # zweiter Tipp kurz nach dem ersten: Doppeltipp, die Hunderunde erscheint
                                  condition:
                                    script.is_running: tipp_warten
                                  then:
                                    - script.stop: tipp_warten
                                    - script.execute: hunderunde_zeigen
                                  else:
                                    - script.execute: tipp_warten
                      else:
                        - if:
                            # gehaltene Seite: Wischen zeigt kurz das Schloss
                            condition:
                              lambda: return id(seite_gehalten);
                            then:
                              - script.execute: schloss_zeigen

  # einfaches Tippen: erst nach der Doppeltipp-Zeit, falls kein zweiter Tipp kommt. Auf einer gehaltenen Seite zeigt
  # es nur das Schloss, sonst wechselt es die Seite.
  - id: tipp_warten
    then:
      - delay: !lambda 'return (uint32_t) id(nr_doppeltipp).state;'
      - if:
          condition:
            lambda: return id(seite_gehalten);
          then:
            - script.execute: schloss_zeigen
          else:
            - script.execute: seite_wechseln
            - script.execute: seite_weiter

  # Easter Egg Hunderunde: über beiden Seiten, schließt sich nach 15 s oder mit einem Tippen
  - id: hunderunde_zeigen
    mode: restart
    then:
      - script.execute: hund_zeichnen
      - lvgl.widget.show: hunderunde
      - lambda: lv_obj_fade_in(id(hunderunde), 250, 0);
      - delay: 15s
      - lambda: lv_obj_fade_out(id(hunderunde), 400, 0);
      - delay: 400ms
      - lvgl.widget.hide: hunderunde
  - id: hunderunde_schliessen
    then:
      - script.stop: hunderunde_zeigen
      - lambda: lv_obj_fade_out(id(hunderunde), 250, 0);
      - delay: 250ms
      - lvgl.widget.hide: hunderunde
  - id: hund_zeichnen
    then:
      - lambda: |-
          std::string x = id(wetter_hunderunde).state;
          if (wx::part(x, 0).empty()) x = "mix;Hunderunde;–;0;Noch keine Daten aus Home Assistant;;-1";
          std::string ic = wx::part(x, 0);
          bool schirm = ic == "schirm", frost = ic == "frost";
          wx::sichtbar(id(hr_sonne), ic == "sonne");
          wx::sichtbar(id(hr_mix), ic == "mix");
          wx::sichtbar(id(hr_schirm), schirm);
          wx::sichtbar(id(hr_hund), !schirm);
          wx::sichtbar(id(hr_hund_klein), schirm);
          for (lv_obj_t *f : {(lv_obj_t *) id(hr_flocke_0), (lv_obj_t *) id(hr_flocke_1), (lv_obj_t *) id(hr_flocke_2),
                              (lv_obj_t *) id(hr_flocke_3)})
            wx::sichtbar(f, frost);
          int n = atoi(wx::part(x, 3).c_str());
          std::string g = wx::part(x, 2);
          lv_label_set_text(id(hr_klein), wx::part(x, 1).c_str());
          lv_label_set_text(id(hr_gross44), g.c_str());
          lv_label_set_text(id(hr_gross32), g.c_str());
          wx::sichtbar(id(hr_gross44), n < 2);
          wx::sichtbar(id(hr_gross32), n >= 2);
          lv_label_set_text(id(hr_tipp), wx::part(x, 4).c_str());
          lv_obj_t *feld[16] = {id(hr_feld_0), id(hr_feld_1), id(hr_feld_2), id(hr_feld_3), id(hr_feld_4), id(hr_feld_5), id(hr_feld_6), id(hr_feld_7), id(hr_feld_8), id(hr_feld_9), id(hr_feld_10), id(hr_feld_11), id(hr_feld_12), id(hr_feld_13), id(hr_feld_14), id(hr_feld_15)};
          wx::hund_streifen(x, feld, id(hr_strich), 40, 400,
                            id(ha_time).now().is_valid() ? id(ha_time).now().minute : 0);

  # Tag oder Nacht neu bestimmen (jede Minute und wenn sich die Sonne ändert); bei einem Wechsel Thema und Bild
  - id: tag_pruefen
    then:
      - if:
          condition:
            lambda: |-
              bool t = wx::ist_tag(id(sonne_zustand).state, id(wetter_sonne).state, id(ha_time).now());
              bool neu = t != id(ist_tag) || !id(thema_gesetzt);
              id(ist_tag) = t;
              id(thema_gesetzt) = true;
              return neu;
          then:
            - script.execute: thema_setzen
            - script.execute: jetzt_zeichnen

  # helles Design am Tag, dunkles in der Nacht
  - id: thema_setzen
    then:
      - if:
          condition:
            lambda: return id(ist_tag);
          then:
            - lvgl.style.update:
                id: s_seite
                bg_color: 0xF3F5F9
            - lvgl.style.update:
                id: s_karte
                bg_color: 0xFFFFFF
                shadow_opa: 10%
            - lvgl.style.update:
                id: s_panel
                bg_color: 0x14583A
                bg_grad_color: 0x004225
            - lvgl.style.update:
                id: s_ink
                text_color: 0x14213D
            - lvgl.style.update:
                id: s_muted
                text_color: 0x5F6B80
            - lvgl.style.update:
                id: s_gold
                text_color: 0xB8862B
            - lvgl.style.update:
                id: s_linie
                bg_color: 0x6B5420
            - lvgl.style.update:
                id: s_kurve
                line_color: 0x6B5420
            - lvgl.style.update:
                id: s_spur
                bg_color: 0xE9EDF4
          else:
            - lvgl.style.update:
                id: s_seite
                bg_color: 0x070D0A
            - lvgl.style.update:
                id: s_karte
                bg_color: 0x121C17
                shadow_opa: 0%
            - lvgl.style.update:
                id: s_panel
                bg_color: 0x082A1B
                bg_grad_color: 0x02120B
            - lvgl.style.update:
                id: s_ink
                text_color: 0xE4EAE6
            - lvgl.style.update:
                id: s_muted
                text_color: 0x8A9C92
            - lvgl.style.update:
                id: s_gold
                text_color: 0xC9A04A
            - lvgl.style.update:
                id: s_linie
                bg_color: 0xC9A04A
            - lvgl.style.update:
                id: s_kurve
                line_color: 0xC9A04A
            - lvgl.style.update:
                id: s_spur
                bg_color: 0x22302A

  # Warnung (gefüllt) oder Vorwarnung (nur Rand) unter dem Wetterbild; das Bild wird dafür kleiner
  - id: warn_zeichnen
    then:
      - lambda: |-
          bool an = wx::warn_pille(id(warn_pill), id(lbl_warn_icon), id(lbl_warn), id(wetter_warnung).state,
                                   id(wetter_vorwarnung).state, 222);
          wx::bild_skalieren(id(bild_jetzt), id(bild_klein), 149, 66, an ? 218 : 256);

  # Titel der Wind-Kachel: Richtung und Böen ("SW · Böen 38"), ohne Böen "Wind SW"
  - id: wind_titel
    then:
      - lvgl.label.update:
          id: lbl_wind_titel
          text: !lambda |-
            auto r = wx::richtung(id(wetter_windrichtung).state);
            float b = id(wetter_boeen).state;
            if (!std::isnan(b)) return (r.empty() ? std::string("Böen ") : r + " · Böen ") + wx::percent(b);
            return r.empty() ? std::string("Wind") : "Wind " + r;

  # unten im Panel: die Seitenpunkte, oder bei fehlender Verbindung die Wolke mit der Uhrzeit. Auf der Wetterseite
  # gibt es die Punkte erst, wenn auch die Seite Raumklima Daten hat.
  - id: punkte_zeichnen
    then:
      - lambda: |-
          bool off = id(offline_an);
          bool innen = wx::innen_da(id(co2_wohnzimmer).state, id(co2_schlafzimmer).state, id(co2_buero).state);
          auto zeig = [](lv_obj_t *o, bool an) {
            if (an) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          zeig(id(punkte_w), !off && innen);
          zeig(id(punkte_i), !off);
          zeig(id(offline_w), off);
          zeig(id(offline_i), off);
          lv_label_set_text(id(lbl_offline_w), id(offline_text).c_str());
          lv_label_set_text(id(lbl_offline_i), id(offline_text).c_str());

  # ohne Verbindung zu Home Assistant: Werte blass, unten die Wolke mit der Uhrzeit
  - id: verbindung_zeichnen
    then:
      - lambda: |-
          lv_opa_t o = id(offline_an) ? LV_OPA_40 : LV_OPA_COVER;
          lv_obj_t *blass[] = {id(temp_zeile), id(bild_jetzt), id(bild_klein), id(warn_pill), id(lbl_hochtief), id(karte_tage), id(karte_regen), id(kachel_wind), id(kachel_regen), id(kachel_feuchte), id(kachel_uv), id(lbl_co2_wohnzimmer), id(block_wohnzimmer), id(marker_wohnzimmer), id(lbl_trend_wohnzimmer), id(kachel_wohnzimmer), id(lbl_co2_schlafzimmer), id(block_schlafzimmer), id(marker_schlafzimmer), id(lbl_trend_schlafzimmer), id(kachel_schlafzimmer), id(lbl_co2_buero), id(block_buero), id(marker_buero), id(lbl_trend_buero), id(kachel_buero), id(karte_feinstaub), id(karte_gase)};
          for (auto *b : blass) lv_obj_set_style_opa(b, o, LV_PART_MAIN);
      - script.execute: punkte_zeichnen

# ---------------- Hardware (Pins wie in ESPHomes Guition-4848S040-Vorlage) ----------------
spi:
  id: lcd_spi
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  id: touch_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    # 150 Hz dimmt auf allen Chargen dieses Boards; falls es fiept, auf 20 kHz stellen.
    frequency: 150 Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    id: hintergrundlicht
    name: Hintergrundlicht
    output: backlight_pwm
    # beim Start aus; on_boot schaltet es ein, außer im Nachtmodus
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms

display:
  - platform: st7701s
    id: my_display
    dimensions: {width: 480, height: 480}
    spi_id: lcd_spi
    spi_mode: MODE0
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 16MHz
    pclk_inverted: false
    hsync_front_porch: 10
    hsync_pulse_width: 8
    hsync_back_porch: 50
    vsync_front_porch: 10
    vsync_pulse_width: 8
    vsync_back_porch: 20
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
      - [0xC7, 0x00]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x3A, 0x60]
      - [0x36, 0x00]
      - [0x20]
      - [0x11]
      - delay 120ms
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    update_interval: 20ms
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
    # Gesten (Ablauf im Skript "geste"): Tippen = nächste Seite, Doppeltipp = Hunderunde, lange drücken = Seite halten,
    # Wischen hoch/runter = heller/dunkler; im Nachtmodus weckt jede Berührung das Display
    on_touch:
      - lambda: |-
          id(t_x0) = id(t_x1) = touch.x;
          id(t_y0) = id(t_y1) = touch.y;
          id(t_lang) = false;
      - script.execute: lang_warten
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            id(t_x1) = touches[0].x;
            id(t_y1) = touches[0].y;
          }
    on_release:
      - script.stop: lang_warten
      - if:
          condition:
            lambda: return !id(t_lang);
          then:
            - script.execute:
                id: geste
                art: !lambda |-
                  int dx = id(t_x1) - id(t_x0), dy = id(t_y1) - id(t_y0);
                  if (abs(dy) >= 60 && abs(dy) > abs(dx)) return dy < 0 ? 1 : 2;
                  return 0;



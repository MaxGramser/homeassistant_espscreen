# ---------------- Daten aus Home Assistant ----------------
text_sensor:
  - platform: homeassistant
    id: wetter_zustand
    entity_id: ${wetter_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_icon_jetzt
            text: !lambda 'return wx::icon(x);'
            text_color: !lambda 'return wx::color(x);'
        - lvgl.label.update:
            id: lbl_zustand
            text: !lambda 'return wx::text(x);'
  - platform: homeassistant
    id: wetter_sonne
    entity_id: ${vorhersage_entity}
    attribute: sonne
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_sonne_icon
            text: !lambda 'return wx::part(x, 0) == "auf" ? "\U000F059C" : "\U000F059B";'
        - lvgl.label.update:
            id: lbl_sonne
            text: !lambda 'auto t = wx::part(x, 1); return t.empty() ? std::string("--:--") : t;'


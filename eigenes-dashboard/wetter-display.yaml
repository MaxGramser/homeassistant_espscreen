# Wetter-Dashboard für das Guition ESP32-S3-4848S040 (480 x 480, ST7701S + GT911).
# Eigenständige ESPHome-Konfiguration mit LVGL, ohne Tessera. README.md erklärt die Einrichtung.
# Diese Datei schreibt werkzeuge/yaml_bauen.py; Änderungen am Aufbau dort machen, Einstellungen hier oben.
#
# Oben ein blaues Panel: Ort, Datum, Kalenderwoche, Temperatur, Sonnenauf- und -untergang, großes Wetterbild
# (nachts die Mondphase mit dem Wetter klein daneben), Wettertext, Hoch und Tief. Bei einer DWD-Warnung ein Rahmen
# und ein Hinweis in der Farbe der Warnstufe. Darunter vier Kacheln (Wind, Regen heute, Luftfeuchte, UV-Index),
# die Temperaturkurve der 5 Tage und der Regen der nächsten Stunden.

substitutions:
  name: wetter-display
  friendly_name: Wetter-Display
  ort: Sassenberg
  # die Wetter-Entität (DWD oder Met.no) und der Sensor aus home-assistant/wetter_display.yaml
  wetter_entity: weather.controlroom_sassenberg
  # UV-Index von der Integration OpenUV (die DWD-Integration liefert ihn nicht mehr)
  uv_entity: sensor.controlroom_openuv_aktueller_uv_index
  vorhersage_entity: sensor.display_wetter
  # Raumklima (zweite Seite): Platzhalter, bis die drei Sensoren gebaut sind
  co2_wohnzimmer: sensor.luft_wohnzimmer_co2
  temp_wohnzimmer: sensor.luft_wohnzimmer_temperatur
  feuchte_wohnzimmer: sensor.luft_wohnzimmer_luftfeuchte
  co2_schlafzimmer: sensor.luft_schlafzimmer_co2
  temp_schlafzimmer: sensor.luft_schlafzimmer_temperatur
  feuchte_schlafzimmer: sensor.luft_schlafzimmer_luftfeuchte
  co2_buero: sensor.luft_buero_co2
  temp_buero: sensor.luft_buero_temperatur
  feuchte_buero: sensor.luft_buero_luftfeuchte
  pm1_buero: sensor.luft_buero_pm1
  pm25_buero: sensor.luft_buero_pm2_5
  pm4_buero: sensor.luft_buero_pm4
  pm10_buero: sensor.luft_buero_pm10
  voc_buero: sensor.luft_buero_voc_index
  nox_buero: sensor.luft_buero_nox_index
  # Sekunden, nach denen das Display zwischen Wetter und Raumklima wechselt
  seitenwechsel: 45s
  # so lange bleibt das Display an, wenn man es im Nachtmodus mit einem Tippen weckt
  weckdauer: 10min

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.6.2
  includes:
    - wetter.h
  on_boot:
    priority: -100
    then:
      # im Nachtmodus (Schalter, den eine Automation in HA setzt) bleibt das Licht aus
      - if:
          condition:
            switch.is_off: nachtmodus
          then:
            - light.turn_on:
                id: hintergrundlicht
                brightness: !lambda return id(helligkeit);
      - script.execute: seite_weiter

globals:
  # Helligkeit, die Wischen hoch/runter einstellt; bleibt über einen Neustart erhalten
  - {id: helligkeit, type: float, restore_value: true, initial_value: "0.8"}
  # Seite festgehalten (langer Druck): kein automatischer Wechsel, das Schloss ist zu sehen
  - {id: seite_gehalten, type: bool, initial_value: "false"}
  # Gesten: Start- und letzter Punkt einer Berührung, ob der lange Druck schon ausgelöst hat
  - {id: t_x0, type: int, initial_value: "0"}
  - {id: t_y0, type: int, initial_value: "0"}
  - {id: t_x1, type: int, initial_value: "0"}
  - {id: t_y1, type: int, initial_value: "0"}
  - {id: t_lang, type: bool, initial_value: "false"}

switch:
  # Nachtmodus: an = Licht aus, ein Tippen weckt das Display für ${weckdauer}. Wann es Nacht ist, entscheidet eine
  # Automation in Home Assistant (Beispiel in home-assistant/wetter_display.yaml).
  - platform: template
    id: nachtmodus
    name: Nachtmodus
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.stop: nacht_wecken
      - light.turn_off: hintergrundlicht
    on_turn_off:
      - script.stop: nacht_wecken
      - light.turn_on:
          id: hintergrundlicht
          brightness: !lambda return id(helligkeit);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
    sdkconfig_options:
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret wetter_display_api_key

ota:
  - platform: esphome
    password: !secret wetter_display_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wetter-Display Setup"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: uhr_zeichnen
        - script.execute: jetzt_zeichnen
    on_time:
      - seconds: 0
        then:
          - script.execute: uhr_zeichnen
      - seconds: 0
        minutes: 0
        then:
          - script.execute: jetzt_zeichnen   # die Mondphase wechselt langsam: einmal pro Stunde reicht

script:
  # jede Minute: Datum, Kalenderwoche, "vor/in ... Std" bei der Sonne
  - id: uhr_zeichnen
    then:
      - lvgl.label.update:
          id: lbl_datum
          text: !lambda 'return wx::datum(id(ha_time).now());'
      - lvgl.label.update:
          id: lbl_kw
          text: !lambda 'return wx::kw(id(ha_time).now());'
      - lvgl.label.update:
          id: lbl_auf_wann
          text: !lambda 'return wx::wann(wx::part(id(wetter_sonne).state, 0), wx::part(id(wetter_sonne).state, 1), id(ha_time).now());'
      - lvgl.label.update:
          id: lbl_unter_wann
          text: !lambda 'return wx::wann(wx::part(id(wetter_sonne).state, 1), wx::part(id(wetter_sonne).state, 0), id(ha_time).now());'
  # das große Bild: am Tag das Wetter, nachts die Mondphase und das Wetter klein daneben; dazu die Panelfarbe
  - id: jetzt_zeichnen
    then:
      - lvgl.image.update:
          id: bild_jetzt
          src: !lambda |-
              auto c = id(wetter_zustand).state;
              if (id(sonne_zustand).state == "below_horizon" || c == "clear-night") {
                int m = id(ha_time).now().is_valid() ? wx::mondphase(id(ha_time).now().timestamp) : 4;
              if (m == 0) return id(img_mond_0);
              if (m == 1) return id(img_mond_1);
              if (m == 2) return id(img_mond_2);
              if (m == 3) return id(img_mond_3);
              if (m == 4) return id(img_mond_4);
              if (m == 5) return id(img_mond_5);
              if (m == 6) return id(img_mond_6);
                return id(img_mond_7);
              }
              if (c == "sunny") return id(img_tag_sunny);
              if (c == "partlycloudy") return id(img_tag_partlycloudy);
              if (c == "cloudy") return id(img_tag_cloudy);
              if (c == "fog") return id(img_tag_fog);
              if (c == "rainy") return id(img_tag_rainy);
              if (c == "pouring") return id(img_tag_pouring);
              if (c == "lightning") return id(img_tag_lightning);
              if (c == "lightning-rainy") return id(img_tag_lightning_rainy);
              if (c == "snowy") return id(img_tag_snowy);
              if (c == "snowy-rainy") return id(img_tag_snowy_rainy);
              if (c == "hail") return id(img_tag_hail);
              if (c == "windy") return id(img_tag_windy);
              if (c == "windy-variant") return id(img_tag_windy_variant);
              if (c == "exceptional") return id(img_tag_exceptional);
              return id(img_tag_cloudy);
      - lvgl.image.update:
          id: bild_klein
          src: !lambda |-
              auto a = wx::nacht_art(id(wetter_zustand).state);
              if (a == "wolke") return id(img_nacht_wolke);
              if (a == "fog") return id(img_nacht_fog);
              if (a == "rainy") return id(img_nacht_rainy);
              if (a == "pouring") return id(img_nacht_pouring);
              if (a == "lightning") return id(img_nacht_lightning);
              if (a == "lightning-rainy") return id(img_nacht_lightning_rainy);
              if (a == "snowy") return id(img_nacht_snowy);
              if (a == "snowy-rainy") return id(img_nacht_snowy_rainy);
              if (a == "hail") return id(img_nacht_hail);
              if (a == "windy") return id(img_nacht_windy);
              if (a == "windy-variant") return id(img_nacht_windy_variant);
              if (a == "exceptional") return id(img_nacht_exceptional);
              return id(img_nacht_wolke);
      - if:
          condition:
            lambda: |-
              return id(sonne_zustand).state == "below_horizon" && !wx::nacht_art(id(wetter_zustand).state).empty();
          then:
            - lvgl.widget.show: bild_klein
          else:
            - lvgl.widget.hide: bild_klein
      - lvgl.obj.update:
          id: panel
          bg_color: !lambda 'return lv_color_hex(id(sonne_zustand).state == "below_horizon" ? 0x0B3A26 : 0x14583A);'
          bg_grad_color: !lambda 'return lv_color_hex(id(sonne_zustand).state == "below_horizon" ? 0x021A10 : 0x004225);'
      # UV-Index: OpenUV wird nur tagsüber abgefragt; nachts ist er 0
      - lvgl.label.update:
          id: lbl_uv
          text: !lambda 'return id(sonne_zustand).state == "below_horizon" ? std::string("0") : wx::percent(id(wetter_uv).state);'
      - lvgl.label.update:
          id: lbl_uv_text
          text: !lambda 'return wx::uv_text(id(sonne_zustand).state == "below_horizon" ? 0.0f : id(wetter_uv).state);'
          text_color: !lambda 'return wx::uv_color(id(sonne_zustand).state == "below_horizon" ? 0.0f : id(wetter_uv).state);'
  # die Temperaturkurve, ihre Punkte und Werte; läuft, wenn ein Tag neue Daten hat
  - id: kurve_zeichnen
    mode: restart
    then:
      - delay: 300ms  # die fünf Tage kommen kurz nacheinander: einmal zeichnen
      - lvgl.line.update:
          id: kurve
          points:
            - x: !lambda 'return wx::kurve_x(0);'
              y: !lambda 'return wx::kurve_y(0);'
            - x: !lambda 'return wx::kurve_x(1);'
              y: !lambda 'return wx::kurve_y(1);'
            - x: !lambda 'return wx::kurve_x(2);'
              y: !lambda 'return wx::kurve_y(2);'
            - x: !lambda 'return wx::kurve_x(3);'
              y: !lambda 'return wx::kurve_y(3);'
            - x: !lambda 'return wx::kurve_x(4);'
              y: !lambda 'return wx::kurve_y(4);'
            - x: !lambda 'return wx::kurve_x(5);'
              y: !lambda 'return wx::kurve_y(5);'
            - x: !lambda 'return wx::kurve_x(6);'
              y: !lambda 'return wx::kurve_y(6);'
            - x: !lambda 'return wx::kurve_x(7);'
              y: !lambda 'return wx::kurve_y(7);'
            - x: !lambda 'return wx::kurve_x(8);'
              y: !lambda 'return wx::kurve_y(8);'
            - x: !lambda 'return wx::kurve_x(9);'
              y: !lambda 'return wx::kurve_y(9);'
            - x: !lambda 'return wx::kurve_x(10);'
              y: !lambda 'return wx::kurve_y(10);'
            - x: !lambda 'return wx::kurve_x(11);'
              y: !lambda 'return wx::kurve_y(11);'
            - x: !lambda 'return wx::kurve_x(12);'
              y: !lambda 'return wx::kurve_y(12);'
            - x: !lambda 'return wx::kurve_x(13);'
              y: !lambda 'return wx::kurve_y(13);'
            - x: !lambda 'return wx::kurve_x(14);'
              y: !lambda 'return wx::kurve_y(14);'
            - x: !lambda 'return wx::kurve_x(15);'
              y: !lambda 'return wx::kurve_y(15);'
            - x: !lambda 'return wx::kurve_x(16);'
              y: !lambda 'return wx::kurve_y(16);'
            - x: !lambda 'return wx::kurve_x(17);'
              y: !lambda 'return wx::kurve_y(17);'
            - x: !lambda 'return wx::kurve_x(18);'
              y: !lambda 'return wx::kurve_y(18);'
            - x: !lambda 'return wx::kurve_x(19);'
              y: !lambda 'return wx::kurve_y(19);'
            - x: !lambda 'return wx::kurve_x(20);'
              y: !lambda 'return wx::kurve_y(20);'
            - x: !lambda 'return wx::kurve_x(21);'
              y: !lambda 'return wx::kurve_y(21);'
            - x: !lambda 'return wx::kurve_x(22);'
              y: !lambda 'return wx::kurve_y(22);'
            - x: !lambda 'return wx::kurve_x(23);'
              y: !lambda 'return wx::kurve_y(23);'
            - x: !lambda 'return wx::kurve_x(24);'
              y: !lambda 'return wx::kurve_y(24);'
            - x: !lambda 'return wx::kurve_x(25);'
              y: !lambda 'return wx::kurve_y(25);'
            - x: !lambda 'return wx::kurve_x(26);'
              y: !lambda 'return wx::kurve_y(26);'
            - x: !lambda 'return wx::kurve_x(27);'
              y: !lambda 'return wx::kurve_y(27);'
            - x: !lambda 'return wx::kurve_x(28);'
              y: !lambda 'return wx::kurve_y(28);'
            - x: !lambda 'return wx::kurve_x(29);'
              y: !lambda 'return wx::kurve_y(29);'
            - x: !lambda 'return wx::kurve_x(30);'
              y: !lambda 'return wx::kurve_y(30);'
            - x: !lambda 'return wx::kurve_x(31);'
              y: !lambda 'return wx::kurve_y(31);'
            - x: !lambda 'return wx::kurve_x(32);'
              y: !lambda 'return wx::kurve_y(32);'
      - lvgl.widget.update:
          id: punkt_0
          y: !lambda 'return wx::punkt_y(0) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_0
          y: !lambda 'return wx::punkt_y(0) - 28;'
      - lvgl.widget.update:
          id: punkt_1
          y: !lambda 'return wx::punkt_y(1) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_1
          y: !lambda 'return wx::punkt_y(1) - 28;'
      - lvgl.widget.update:
          id: punkt_2
          y: !lambda 'return wx::punkt_y(2) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_2
          y: !lambda 'return wx::punkt_y(2) - 28;'
      - lvgl.widget.update:
          id: punkt_3
          y: !lambda 'return wx::punkt_y(3) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_3
          y: !lambda 'return wx::punkt_y(3) - 28;'
      - lvgl.widget.update:
          id: punkt_4
          y: !lambda 'return wx::punkt_y(4) - 5;'
      - lvgl.widget.update:
          id: lbl_hoch_4
          y: !lambda 'return wx::punkt_y(4) - 28;'

  # Raumklima: der Raum mit dem meisten CO2 bestimmt Hinweis und Rahmen, ab der Stufe "Mittel"
  - id: innen_status
    then:
      - if:
          condition:
            lambda: |-
              float m = fmaxf(fmaxf(id(co2_wohnzimmer).state, id(co2_schlafzimmer).state), id(co2_buero).state);
              return wx::co2_stufe(m) >= 3;
          then:
            - lvgl.obj.update:
                id: rahmen_innen
                border_color: !lambda |-
                  float m = fmaxf(fmaxf(id(co2_wohnzimmer).state, id(co2_schlafzimmer).state), id(co2_buero).state);
                  return wx::co2_color(wx::co2_stufe(m));
            - lvgl.obj.update:
                id: pill_innen
                bg_color: !lambda |-
                  float m = fmaxf(fmaxf(id(co2_wohnzimmer).state, id(co2_schlafzimmer).state), id(co2_buero).state);
                  return wx::co2_color(wx::co2_stufe(m));
            - lvgl.label.update:
                id: lbl_pill_innen_icon
                text_color: !lambda |-
                  float m = fmaxf(fmaxf(id(co2_wohnzimmer).state, id(co2_schlafzimmer).state), id(co2_buero).state);
                  return wx::co2_text_color(wx::co2_stufe(m));
            - lvgl.label.update:
                id: lbl_pill_innen
                text: !lambda |-
                  float a = id(co2_wohnzimmer).state, b = id(co2_schlafzimmer).state, c = id(co2_buero).state;
                  float m = fmaxf(fmaxf(a, b), c);
                  if (m == c) return std::string("Büro lüften");
                  if (m == b) return std::string("Schlafzimmer lüften");
                  return std::string("Wohnzimmer lüften");
                text_color: !lambda |-
                  float m = fmaxf(fmaxf(id(co2_wohnzimmer).state, id(co2_schlafzimmer).state), id(co2_buero).state);
                  return wx::co2_text_color(wx::co2_stufe(m));
            - lvgl.widget.show: [rahmen_innen, pill_innen]
          else:
            - lvgl.widget.hide: [rahmen_innen, pill_innen]

  # alle ${seitenwechsel} zwischen Wetter und Raumklima wechseln; ein Tippen wechselt sofort und startet die Zeit neu
  - id: seite_weiter
    mode: restart
    then:
      - delay: ${seitenwechsel}
      - if:
          condition:
            lambda: return !id(seite_gehalten);
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 400ms
            - script.execute: seite_weiter

  # Nachtmodus: nach ${weckdauer} ohne Berührung geht das Licht wieder aus
  - id: nacht_wecken
    mode: restart
    then:
      - delay: ${weckdauer}
      - if:
          condition:
            switch.is_on: nachtmodus
          then:
            - light.turn_off: hintergrundlicht

  # langer Druck: nach 0,8 s ohne Bewegung die Seite festhalten oder wieder freigeben (schon während man drückt)
  - id: lang_warten
    mode: restart
    then:
      - delay: 800ms
      - if:
          condition:
            lambda: |-
              return abs(id(t_x1) - id(t_x0)) < 20 && abs(id(t_y1) - id(t_y0)) < 20 &&
                     id(hintergrundlicht).remote_values.is_on();
          then:
            - lambda: id(t_lang) = true;
            - script.execute:
                id: geste
                art: 3

  # Schloss kurz zeigen (sanft ein- und ausblenden); jede Berührung einer gehaltenen Seite startet es neu
  - id: schloss_zeigen
    mode: restart
    then:
      - lvgl.widget.show: schloss
      - lambda: lv_obj_fade_in(id(schloss), 200, 0);
      - delay: 3s
      - lambda: lv_obj_fade_out(id(schloss), 600, 0);
      - delay: 600ms
      - lvgl.widget.hide: schloss

  # Gesten: 0 = Tippen (nächste Seite), 1 = Wischen hoch (heller), 2 = Wischen runter (dunkler), 3 = lang (Seite halten)
  - id: geste
    parameters:
      art: int
    then:
      - if:
          # dunkel im Nachtmodus: jede Berührung weckt nur
          condition:
            lambda: return id(nachtmodus).state && !id(hintergrundlicht).remote_values.is_on();
          then:
            - light.turn_on:
                id: hintergrundlicht
                brightness: !lambda return id(helligkeit);
            - script.execute: nacht_wecken
          else:
            - if:
                condition:
                  switch.is_on: nachtmodus
                then:
                  - script.execute: nacht_wecken   # die Weckzeit zählt ab der letzten Berührung
            - if:
                condition:
                  lambda: return art == 1 || art == 2;
                then:
                  - lambda: |-
                      float h = id(helligkeit) + (art == 1 ? 0.2f : -0.2f);
                      id(helligkeit) = h > 1.0f ? 1.0f : (h < 0.1f ? 0.1f : h);
                  - light.turn_on:
                      id: hintergrundlicht
                      brightness: !lambda return id(helligkeit);
                      transition_length: 200ms
            - if:
                condition:
                  lambda: return art == 3;
                then:
                  # langer Druck: festhalten oder freigeben
                  - lambda: id(seite_gehalten) = !id(seite_gehalten);
                  - if:
                      condition:
                        lambda: return id(seite_gehalten);
                      then:
                        - script.stop: seite_weiter
                        - script.execute: schloss_zeigen
                      else:
                        - script.stop: schloss_zeigen
                        - lvgl.widget.hide: schloss
                        - script.execute: seite_weiter
                else:
                  - if:
                      # gehaltene Seite: jede Berührung zeigt kurz das Schloss, ein Tippen wechselt nicht
                      condition:
                        lambda: return id(seite_gehalten);
                      then:
                        - script.execute: schloss_zeigen
                      else:
                        - if:
                            condition:
                              lambda: return art == 0;
                            then:
                              - lvgl.page.next:
                                  animation: MOVE_LEFT
                                  time: 400ms
                              - script.execute: seite_weiter

# ---------------- Hardware (Pins wie in ESPHomes Guition-4848S040-Vorlage) ----------------
spi:
  id: lcd_spi
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  id: touch_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    # 150 Hz dimmt auf allen Chargen dieses Boards; falls es fiept, auf 20 kHz stellen.
    frequency: 150 Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    id: hintergrundlicht
    name: Hintergrundlicht
    output: backlight_pwm
    # beim Start aus; on_boot schaltet es ein, außer im Nachtmodus
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms

display:
  - platform: st7701s
    id: my_display
    dimensions: {width: 480, height: 480}
    spi_id: lcd_spi
    spi_mode: MODE0
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 16MHz
    pclk_inverted: false
    hsync_front_porch: 10
    hsync_pulse_width: 8
    hsync_back_porch: 50
    vsync_front_porch: 10
    vsync_pulse_width: 8
    vsync_back_porch: 20
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
      - [0xC7, 0x00]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x3A, 0x60]
      - [0x36, 0x00]
      - [0x20]
      - [0x11]
      - delay 120ms
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    update_interval: 20ms
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
    # Gesten (Ablauf im Skript "geste"): Tippen = nächste Seite, lange drücken = Seite halten,
    # Wischen hoch/runter = heller/dunkler; im Nachtmodus weckt jede Berührung das Display
    on_touch:
      - lambda: |-
          id(t_x0) = id(t_x1) = touch.x;
          id(t_y0) = id(t_y1) = touch.y;
          id(t_lang) = false;
      - script.execute: lang_warten
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            id(t_x1) = touches[0].x;
            id(t_y1) = touches[0].y;
          }
    on_release:
      - script.stop: lang_warten
      - if:
          condition:
            lambda: return !id(t_lang);
          then:
            - script.execute:
                id: geste
                art: !lambda |-
                  int dx = id(t_x1) - id(t_x0), dy = id(t_y1) - id(t_y0);
                  if (abs(dy) >= 60 && abs(dy) > abs(dx)) return dy < 0 ? 1 : 2;
                  return 0;


